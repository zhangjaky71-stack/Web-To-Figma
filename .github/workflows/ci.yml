name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Validate NODE-31 P0 closure
        run: node scripts/validate-node-31-p0-closure.mjs

      - name: Validate NODE-31 NODE-30 evidence
        run: node scripts/validate-node-31-node30-evidence.mjs

      - name: Validate NODE-31 file protocol evidence
        run: node scripts/validate-node-31-file-protocol-evidence.mjs

      - name: Validate NODE-31 security evidence
        run: node scripts/validate-node-31-security-evidence.mjs

      - name: Validate NODE-31 known limitations
        run: node scripts/validate-node-31-known-limitations.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NODE-31 Dependency security audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Measurement provenance
        run: node scripts/run-node-31-measurement-provenance.mjs

      - name: NODE-31 Level-1 measurement input
        run: node scripts/run-node-31-measurement-input-level1.mjs

      - name: Upload NODE-31 Level-1 measurement input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node31-level1-measurement-input
          path: artifacts/node31-measurement-input/
          if-no-files-found: warn
          retention-days: 14

      - name: NODE-31 File protocol P0
        run: node scripts/run-node-31-file-protocol-runtime-v18.mjs

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: NODE-31 Font geometry P0
        run: node scripts/run-node-31-font-geometry-runtime.mjs

      - name: Format check
        run: pnpm format:check
