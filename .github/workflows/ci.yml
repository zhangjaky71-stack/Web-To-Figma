name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NODE-31 create formatted P0 validator blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec prettier scripts/validate-node-31-p0.mjs --write
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
            method: "POST",
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              "x-github-api-version": "2022-11-28",
              "content-type": "application/json",
            },
            body: JSON.stringify({
              content: readFileSync("scripts/validate-node-31-p0.mjs").toString("base64"),
              encoding: "base64",
            }),
          });
          const body = await response.json();
          if (!response.ok || typeof body.sha !== "string") {
            throw new Error(`GitHub blob creation failed: ${response.status} ${JSON.stringify(body)}`);
          }
          console.log(`NODE31_P0_FORMATTED_BLOB_SHA=${body.sha}`);
          NODE
          exit 1
