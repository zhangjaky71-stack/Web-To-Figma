name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Plugin UI trusted-click diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/run-node-31-plugin-ui-runtime.mjs";
          const source = readFileSync(path, "utf8");
          const needle = '  await evaluate(client, `document.getElementById("choose-file").click()`);';
          const replacement = `  const chooseButtonCenter = await evaluate(
            client,
            \`(() => {
              const button = document.getElementById("choose-file");
              if (!(button instanceof HTMLElement)) return null;
              const rect = button.getBoundingClientRect();
              return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            })()\`,
          );
          assert(chooseButtonCenter, "choose-file button has no clickable geometry");
          await client.send("Input.dispatchMouseEvent", {
            type: "mousePressed",
            x: chooseButtonCenter.x,
            y: chooseButtonCenter.y,
            button: "left",
            buttons: 1,
            clickCount: 1,
          });
          await client.send("Input.dispatchMouseEvent", {
            type: "mouseReleased",
            x: chooseButtonCenter.x,
            y: chooseButtonCenter.y,
            button: "left",
            buttons: 0,
            clickCount: 1,
          });`;
          if (!source.includes(needle)) throw new Error("choose-file click needle not found");
          writeFileSync(path, source.replace(needle, replacement));
          NODE
          pnpm exec prettier scripts/run-node-31-plugin-ui-runtime.mjs --write
          node scripts/run-node-31-plugin-ui-runtime.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
            method: "POST",
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              "x-github-api-version": "2022-11-28",
              "content-type": "application/json",
            },
            body: JSON.stringify({
              content: readFileSync("scripts/run-node-31-plugin-ui-runtime.mjs").toString("base64"),
              encoding: "base64",
            }),
          });
          const body = await response.json();
          if (!response.ok || typeof body.sha !== "string") {
            throw new Error(`GitHub blob creation failed: ${response.status} ${JSON.stringify(body)}`);
          }
          console.log(`NODE31_PLUGIN_UI_FIXED_BLOB_SHA=${body.sha}`);
          NODE
          exit 1

      - name: Format check
        run: pnpm format:check
