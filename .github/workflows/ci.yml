name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize NODE-31 visual-state audit migration candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const oldAuditPath = 'docs/qa/results/NODE-31_P0_AUDIT_861.json';
          const newAuditPath = 'docs/qa/results/NODE-31_P0_AUDIT_882.json';
          const manifestPath = 'docs/qa/NODE-31_RC_EVIDENCE_V1.json';
          const validatorPath = 'scripts/validate-node-31-p0.mjs';
          const visualEvidencePath = 'docs/qa/results/NODE-31_VISUAL_STATE_RUNTIME_EVIDENCE_882.json';
          const remainingBlockers = [
            'file-protocol-explicit-permission',
            'geometry-preserving-correction-policy',
            'raster-text-only-when-policy-justifies',
          ];

          const audit = JSON.parse(fs.readFileSync(oldAuditPath, 'utf8'));
          audit.auditedAgainstBranchHead = '913373bc7afd1d4add7165c693c2e69f10342181';
          audit.ci = {
            runNumber: 882,
            runId: 33160065371,
            jobId: 98812093098,
            branchHead: '913373bc7afd1d4add7165c693c2e69f10342181',
            mergeRef: '44f486945309acd3ab488c4418fc5eee3ec2519e',
            base: '28b52dc3e0d3074bf76205c8deb324a06dfe9e23',
            conclusion: 'PASS',
            qualityChecks: {
              node31Validator: 'PASS',
              node31CorpusValidator: 'PASS',
              node31P0Validator: 'PASS',
              lint: 'PASS',
              typecheck: 'PASS',
              tests: 'PASS',
              build: 'PASS',
              browserRuntime: 'PASS',
              standardCaptureRuntime: 'PASS',
              visualStateRuntime: 'PASS',
              pluginUiChooseFileRuntime: 'PASS',
              pluginCanvasDropRuntime: 'PASS',
              format: 'PASS',
            },
          };
          const visualItem = audit.capture.find((entry) => entry.id === 'visual-state-freeze-and-restore');
          if (!visualItem) throw new Error('visual-state P0 item missing from source audit');
          visualItem.status = 'PASS';
          visualItem.sourceArtifacts = [
            'apps/browser-extension/src/runtime/visual-state-runtime.ts',
            'apps/browser-extension/src/runtime/service-worker.ts',
            'apps/browser-extension/test/visual-state-runtime.test.ts',
            'qa/corpus/node31/p0/visual-state-runtime.html',
            'scripts/run-node-31-visual-state-runtime.mjs',
            visualEvidencePath,
          ];
          visualItem.reason =
            'CI #882 runs the final built visual-state runtime in real Chrome 151 and proves CSS/WAAPI animation timelines and geometry plus playing media inside an open ShadowRoot stop while frozen, then resume after restore with zero resume failures and no permanent DOM or inline-state mutation. The exact-head product service worker wraps page/region capture and each responsive viewport capture in the same fail-closed visual-state transaction.';
          audit.blockingUnavailableCount = remainingBlockers.length;
          audit.blockingUnavailableIds = remainingBlockers;
          fs.writeFileSync(newAuditPath, `${JSON.stringify(audit, null, 2)}\n`);

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.p0.status = 'UNAVAILABLE';
          manifest.p0.evidenceArtifact = newAuditPath;
          manifest.p0.blockingUnavailableCount = remainingBlockers.length;
          manifest.p0.note =
            'P0 audit remains fail-closed. CI #882 adds exact-head real-Chrome proof that the final visual-state runtime freezes CSS/WAAPI animations and ShadowRoot media during capture and restores them without permanent page mutation. Three items remain UNAVAILABLE: explicit file:// permission capture, geometry-preserving font correction policy, and raster-text policy justification.';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          let validator = fs.readFileSync(validatorPath, 'utf8');
          function replaceOnce(before, after, label) {
            if (!validator.includes(before)) throw new Error(`validator migration anchor missing: ${label}`);
            validator = validator.replace(before, after);
          }

          replaceOnce(
            'const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_861.json";',
            'const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_882.json";',
            'audit path',
          );
          replaceOnce(
            'const pluginCanvasEvidencePath = "docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json";',
            'const pluginCanvasEvidencePath = "docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json";\nconst visualStateEvidencePath =\n  "docs/qa/results/NODE-31_VISUAL_STATE_RUNTIME_EVIDENCE_882.json";',
            'visual evidence path',
          );
          replaceOnce(
            'const pluginMainSourcePath = "apps/figma-plugin/src/main.ts";',
            'const pluginMainSourcePath = "apps/figma-plugin/src/main.ts";\nconst visualStateHarnessPath = "scripts/run-node-31-visual-state-runtime.mjs";\nconst visualStateSourcePath = "apps/browser-extension/src/runtime/visual-state-runtime.ts";\nconst visualStateServiceWorkerPath = "apps/browser-extension/src/runtime/service-worker.ts";\nconst visualStateTestPath = "apps/browser-extension/test/visual-state-runtime.test.ts";\nconst visualStateFixturePath = "qa/corpus/node31/p0/visual-state-runtime.html";\nconst visualStateBuiltArtifactPath =\n  "apps/browser-extension/dist/runtime/visual-state-runtime.js";',
            'visual provenance constants',
          );
          replaceOnce(
            'const expectedBlockingIds = [\n  "file-protocol-explicit-permission",\n  "visual-state-freeze-and-restore",\n  "geometry-preserving-correction-policy",\n  "raster-text-only-when-policy-justifies",\n].sort();',
            'const expectedBlockingIds = [\n  "file-protocol-explicit-permission",\n  "geometry-preserving-correction-policy",\n  "raster-text-only-when-policy-justifies",\n].sort();',
            'blocking ids',
          );
          replaceOnce(
            'const p0BoundaryIds = [',
            `const expectedVisualStateAssertions = [\n  "animations-advance-before-freeze",\n  "animated-geometry-advances-before-freeze",\n  "shadow-root-media-advances-before-freeze",\n  "freeze-receipt-valid",\n  "running-animations-paused-during-freeze",\n  "animation-timelines-stable-during-freeze",\n  "css-and-waapi-geometry-stable-during-freeze",\n  "shadow-root-media-paused-during-freeze",\n  "media-timeline-stable-during-freeze",\n  "freeze-does-not-mutate-dom-inline-state",\n  "restore-receipt-valid-zero-resume-failures",\n  "animations-resume-after-restore",\n  "animated-geometry-resumes-after-restore",\n  "shadow-root-media-resumes-after-restore",\n  "freeze-global-removed-after-restore",\n  "restore-leaves-no-permanent-dom-inline-mutation",\n].sort();\n\nconst p0BoundaryIds = [`,
            'visual assertions',
          );
          replaceOnce(
            '  pluginCanvasEvidencePath,\n  runtimeHarnessPath,',
            '  pluginCanvasEvidencePath,\n  visualStateEvidencePath,\n  runtimeHarnessPath,',
            'require visual evidence',
          );
          replaceOnce(
            '  pluginCanvasHarnessPath,\n  pluginMainSourcePath,\n]);',
            '  pluginCanvasHarnessPath,\n  pluginMainSourcePath,\n  visualStateHarnessPath,\n  visualStateSourcePath,\n  visualStateServiceWorkerPath,\n  visualStateTestPath,\n  visualStateFixturePath,\n]);',
            'require visual sources',
          );
          replaceOnce(
            'const pluginCanvasEvidence = readJson(pluginCanvasEvidencePath);',
            'const pluginCanvasEvidence = readJson(pluginCanvasEvidencePath);\nconst visualStateEvidence = readJson(visualStateEvidencePath);',
            'read visual evidence',
          );

          const visualValidation = `if (visualStateEvidence) {\n  assert(visualStateEvidence.version === "1.0.0", "Visual-state evidence version mismatch");\n  assert(\n    visualStateEvidence.evidenceType === "node31-visual-state-browser-runtime",\n    "Visual-state evidenceType mismatch",\n  );\n  assert(visualStateEvidence.status === "PASS", "Visual-state evidence must PASS");\n  assert(visualStateEvidence.ci?.runNumber === 882, "Visual-state evidence must identify CI #882");\n  assert(visualStateEvidence.ci?.runId === 33160065371, "Visual-state run id mismatch");\n  assert(visualStateEvidence.ci?.jobId === 98812093098, "Visual-state job id mismatch");\n  assert(\n    visualStateEvidence.ci?.branchHead === "913373bc7afd1d4add7165c693c2e69f10342181",\n    "Visual-state branch head mismatch",\n  );\n  assert(\n    visualStateEvidence.ci?.mergeRef === "44f486945309acd3ab488c4418fc5eee3ec2519e",\n    "Visual-state merge ref mismatch",\n  );\n  assert(\n    visualStateEvidence.ci?.base === "28b52dc3e0d3074bf76205c8deb324a06dfe9e23",\n    "Visual-state base mismatch",\n  );\n  assertQualityChecks(\n    visualStateEvidence,\n    [\n      "node31Validator",\n      "node31CorpusValidator",\n      "node31P0Validator",\n      "lint",\n      "typecheck",\n      "tests",\n      "build",\n      "browserRuntime",\n      "standardCaptureRuntime",\n      "visualStateRuntime",\n      "pluginUiChooseFileRuntime",\n      "pluginCanvasDropRuntime",\n      "format",\n    ],\n    "Visual-state evidence",\n  );\n  assert(\n    visualStateEvidence.environment?.chrome === "Chrome/151.0.7922.173",\n    "Visual-state Chrome mismatch",\n  );\n  assert(\n    visualStateEvidence.moduleArtifact === visualStateBuiltArtifactPath,\n    "Visual-state built artifact mismatch",\n  );\n  assert(\n    visualStateEvidence.runtimeHarness === visualStateHarnessPath,\n    "Visual-state harness mismatch",\n  );\n  assert(\n    visualStateEvidence.fixtureArtifact === visualStateFixturePath,\n    "Visual-state fixture mismatch",\n  );\n  assertIncludesAll(\n    visualStateEvidence.sourceArtifacts,\n    [visualStateSourcePath, visualStateServiceWorkerPath, visualStateTestPath],\n    "Visual-state source",\n  );\n  assertArrayEquals(\n    visualStateEvidence.assertions,\n    expectedVisualStateAssertions,\n    "Visual-state assertion set mismatch",\n  );\n  assertArrayEquals(\n    visualStateEvidence.provesP0Items,\n    ["visual-state-freeze-and-restore"],\n    "Visual-state proven P0 set mismatch",\n  );\n  assertArrayEquals(\n    visualStateEvidence.notProvenByThisArtifact,\n    expectedBlockingIds,\n    "Visual-state not-proven boundary mismatch",\n  );\n}\n\n`;
          replaceOnce('if (pluginUiEvidence) {', `${visualValidation}if (pluginUiEvidence) {`, 'visual validation block');

          replaceOnce(
            '  const requiredPassProvenance = new Map([',
            '  const requiredPassProvenance = new Map([\n    [\n      "visual-state-freeze-and-restore",\n      [\n        visualStateSourcePath,\n        visualStateServiceWorkerPath,\n        visualStateTestPath,\n        visualStateFixturePath,\n        visualStateHarnessPath,\n        visualStateEvidencePath,\n      ],\n    ],',
            'visual pass provenance',
          );

          replaceOnce(
            'audit.auditedAgainstBranchHead === "6195def8a960843c2ea2883638c84386e2ef733a",\n    "P0 audit must stay anchored to exact-head CI #861",',
            'audit.auditedAgainstBranchHead === "913373bc7afd1d4add7165c693c2e69f10342181",\n    "P0 audit must stay anchored to exact-head CI #882",',
            'audit exact-head anchor',
          );
          replaceOnce(
            'assert(audit.ci?.runNumber === 861, "P0 audit must identify CI #861");',
            'assert(audit.ci?.runNumber === 882, "P0 audit must identify CI #882");',
            'audit run number',
          );
          replaceOnce(
            'assert(audit.ci?.runId === 33074321682, "P0 audit run id mismatch");',
            'assert(audit.ci?.runId === 33160065371, "P0 audit run id mismatch");',
            'audit run id',
          );
          replaceOnce(
            'assert(audit.ci?.jobId === 98524433660, "P0 audit job id mismatch");',
            'assert(audit.ci?.jobId === 98812093098, "P0 audit job id mismatch");',
            'audit job id',
          );
          replaceOnce(
            'audit.ci?.branchHead === "6195def8a960843c2ea2883638c84386e2ef733a",',
            'audit.ci?.branchHead === "913373bc7afd1d4add7165c693c2e69f10342181",',
            'audit branch head',
          );
          replaceOnce(
            'audit.ci?.mergeRef === "0b1bd9b0278471c1621d4c502c5579bef05e185c",',
            'audit.ci?.mergeRef === "44f486945309acd3ab488c4418fc5eee3ec2519e",',
            'audit merge ref',
          );
          replaceOnce(
            '      "standardCaptureRuntime",\n      "pluginUiChooseFileRuntime",\n      "pluginCanvasDropRuntime",\n      "format",\n    ],\n    "P0 audit",',
            '      "standardCaptureRuntime",\n      "visualStateRuntime",\n      "pluginUiChooseFileRuntime",\n      "pluginCanvasDropRuntime",\n      "format",\n    ],\n    "P0 audit",',
            'audit visual quality check',
          );
          replaceOnce(
            'assert(audit.blockingUnavailableCount === 4, "P0 audit must retain exactly 4 blockers");',
            'assert(audit.blockingUnavailableCount === 3, "P0 audit must retain exactly 3 blockers");',
            'audit blocker count',
          );
          replaceOnce(
            'assert(manifest.p0?.blockingUnavailableCount === 4, "manifest P0 blocker count must be 4");',
            'assert(manifest.p0?.blockingUnavailableCount === 3, "manifest P0 blocker count must be 3");',
            'manifest blocker count',
          );

          fs.writeFileSync(validatorPath, validator);
          NODE
          pnpm exec prettier docs/qa/results/NODE-31_P0_AUDIT_882.json docs/qa/NODE-31_RC_EVIDENCE_V1.json scripts/validate-node-31-p0.mjs --write

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated visual-state audit migration
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/node31-audit-migration/docs/qa/results /tmp/node31-audit-migration/docs/qa /tmp/node31-audit-migration/scripts
          cp docs/qa/results/NODE-31_P0_AUDIT_882.json /tmp/node31-audit-migration/docs/qa/results/
          cp docs/qa/NODE-31_RC_EVIDENCE_V1.json /tmp/node31-audit-migration/docs/qa/
          cp scripts/validate-node-31-p0.mjs /tmp/node31-audit-migration/scripts/
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]; then
            echo "Branch head moved during validation; refusing to materialize stale audit migration."
            exit 1
          fi
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/node31-audit-migration/docs/qa/results/NODE-31_P0_AUDIT_882.json docs/qa/results/
          cp /tmp/node31-audit-migration/docs/qa/NODE-31_RC_EVIDENCE_V1.json docs/qa/
          cp /tmp/node31-audit-migration/scripts/validate-node-31-p0.mjs scripts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/results/NODE-31_P0_AUDIT_882.json docs/qa/NODE-31_RC_EVIDENCE_V1.json scripts/validate-node-31-p0.mjs
          git commit -m "docs(node-31): close visual-state P0 blocker"
          git push origin HEAD:"$HEAD_REF"
