name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

  node25-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-25-basic-figma-renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout NODE-25 head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Close and validate NODE-25
        shell: bash
        run: |
          LOG=/tmp/node25-bootstrap.log
          set +e
          {
            rm -f NODE25_BOOTSTRAP_FAILURE.log
            pnpm install --no-frozen-lockfile
            node scripts/node-25-finalize.mjs
            pnpm install --no-frozen-lockfile
            pnpm exec prettier --write \
              packages/figma-renderer \
              apps/figma-plugin/package.json \
              apps/figma-plugin/src/figma-basic-adapter.ts \
              apps/figma-plugin/src/main.ts \
              apps/figma-plugin/src/protocol.ts \
              apps/figma-plugin/src/ui.ts \
              apps/figma-plugin/test/protocol.test.ts \
              apps/figma-plugin/scripts/validate-plugin-package.mjs \
              docs/adr/ADR-0025-transactional-basic-figma-renderer.md \
              docs/nodes/NODE-25_BASIC_FIGMA_RENDERER.md \
              docs/IMPLEMENTATION_STATUS.md \
              scripts/validate-node-25.mjs \
              scripts/validate-foundation.mjs \
              pnpm-lock.yaml
            git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
            git rm scripts/node-25-finalize.mjs
            pnpm check
          } >"$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -eq 0 ]; then
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat(node-25): complete basic Figma renderer integration"
              git push origin "HEAD:${{ github.head_ref }}"
            fi
            exit 0
          fi

          git reset --hard HEAD
          tail -n 900 "$LOG" > NODE25_BOOTSTRAP_FAILURE.log
          git add -f NODE25_BOOTSTRAP_FAILURE.log
          git commit -m "ci(node-25): record bootstrap failure"
          git push origin "HEAD:${{ github.head_ref }}"
          exit "$STATUS"
