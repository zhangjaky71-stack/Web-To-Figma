name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture scroll-root diagnostic
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/run-node-31-standard-capture-runtime.mjs";
          let source = readFileSync(path, "utf8");
          const needle = `  assert(\n    appScrollRoot.isPrimaryApplicationScrollRoot === true,\n    "Largest visible application scroller was not identified as the primary app scroll root",\n  );`;
          const diagnostic = `  console.log(\n    JSON.stringify(\n      {\n        viewport: snapshot.environment,\n        scrollContainers: snapshot.scrollContainers.map((item) => {\n          const node = snapshot.nodes.find((candidate) => candidate.captureNodeId === item.sourceNodeId);\n          return {\n            tagName: node?.source?.tagName ?? (item.sourceNodeId === snapshot.rootCaptureNodeId ? "DOCUMENT" : "UNKNOWN"),\n            role: node?.source?.attributes?.["data-node31-role"] ?? null,\n            clientWidth: item.clientWidth,\n            clientHeight: item.clientHeight,\n            area: item.clientWidth * item.clientHeight,\n            scrollWidth: item.scrollWidth,\n            scrollHeight: item.scrollHeight,\n            scrollTop: item.scrollTop,\n            isDocumentScrollRoot: item.isDocumentScrollRoot,\n            isPrimaryApplicationScrollRoot: item.isPrimaryApplicationScrollRoot,\n          };\n        }),\n      },\n      null,\n      2,\n    ),\n  );\n${needle}`;
          if (!source.includes(needle)) throw new Error("Diagnostic insertion point not found");
          source = source.replace(needle, diagnostic);
          writeFileSync(path, source);
          NODE
          node scripts/run-node-31-standard-capture-runtime.mjs
