name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

  node22-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/node-22-figma-plugin-shell-file-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout NODE-22 head
        uses: actions/checkout@v6
        with:
          ref: feat/node-22-figma-plugin-shell-file-intake
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Close and validate NODE-22
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f NODE22_BOOTSTRAP_FAILURE.log
          set +e
          {
            pnpm install --no-frozen-lockfile
            node scripts/node-22-finalize.mjs
            pnpm install --no-frozen-lockfile
            pnpm exec prettier --write \
              apps/figma-plugin/package.json \
              apps/figma-plugin/manifest.json \
              apps/figma-plugin/tsconfig.json \
              apps/figma-plugin/src \
              apps/figma-plugin/test \
              apps/figma-plugin/static/ui.html \
              apps/figma-plugin/scripts \
              apps/figma-plugin/README.md \
              scripts/validate-foundation.mjs \
              scripts/validate-node-22.mjs \
              docs/FIGMA_PLUGIN_SHELL_FILE_INTAKE_V2.md \
              docs/adr/ADR-0022-figma-file-intake-boundary.md \
              docs/nodes/NODE-22_FIGMA_PLUGIN_SHELL_FILE_INTAKE.md \
              docs/IMPLEMENTATION_STATUS.md
            git checkout origin/main -- .github/workflows/ci.yml
            git rm scripts/node-22-finalize.mjs
            pnpm check
          } > /tmp/node22-bootstrap.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            tail -n 700 /tmp/node22-bootstrap.log > NODE22_BOOTSTRAP_FAILURE.log
            git add -f NODE22_BOOTSTRAP_FAILURE.log
            git commit -m "ci(node-22): record bootstrap failure"
            git push origin HEAD:feat/node-22-figma-plugin-shell-file-intake
            echo "NODE-22 bootstrap failed; diagnostic report committed."
            exit "$status"
          fi

          git add -A
          git commit -m "feat(node-22): complete Figma shell and file intake integration"
          git push origin HEAD:feat/node-22-figma-plugin-shell-file-intake
