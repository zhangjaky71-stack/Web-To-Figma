name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize NODE-31 file permission candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 scripts/materialize-node31-file-permission-candidate.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-file-protocol-runtime.mjs")
          text = path.read_text()

          management_old = '''  await reactivateUnpackedExtension(browserClient, extensionRoot, extensionId);\n  await waitFor(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {'''
          management_new = '''  await reactivateUnpackedExtension(browserClient, extensionRoot, extensionId);\n  await navigate(\n    primaryClient,\n    "chrome://extensions/",\n    "chrome://extensions after unpacked reactivation",\n  );\n  await waitFor(\n    primaryClient,\n    `typeof chrome?.developerPrivate?.getExtensionInfo === "function"`,\n    "chrome.developerPrivate did not recover after unpacked reactivation",\n  );\n  await waitFor(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {'''
          if management_old in text:
              text = text.replace(management_old, management_new, 1)
          elif management_new not in text:
              raise SystemExit("reactivation management-context anchor missing")

          wake_old = '''  const extensionClient = await createExtensionWorkerSession(browserClient, extensionId);'''
          wake_new = '''  console.log("NODE-31 file protocol: probing page-session ServiceWorker domain");\n  const pageDomains = await primaryClient.send("Schema.getDomains");\n  const pageDomainNames = (pageDomains.domains ?? []).map((domain) => domain.name).sort();\n  console.log(`NODE-31 file protocol: page-session domains ${JSON.stringify(pageDomainNames)}`);\n  assert(\n    pageDomainNames.includes("ServiceWorker"),\n    `Page target session does not expose ServiceWorker domain: ${JSON.stringify(pageDomainNames)}`,\n  );\n  await primaryClient.send("ServiceWorker.enable");\n  await primaryClient.send("ServiceWorker.startWorker", {\n    scopeURL: `chrome-extension://${extensionId}/`,\n  });\n  const extensionClient = await createExtensionWorkerSession(browserClient, extensionId);'''
          if wake_old in text:
              text = text.replace(wake_old, wake_new, 1)
          elif wake_new not in text:
              raise SystemExit("page-session worker wake anchor missing")

          send_old = '''  send(method, params = {}, sessionId) {'''
          send_new = '''  send(method, params = {}, sessionId, timeoutMs = 10000) {'''
          if send_old in text:
              text = text.replace(send_old, send_new, 1)
          elif send_new not in text:
              raise SystemExit("CDP send timeout signature anchor missing")

          timeout_old = '''        reject(new Error(`Timed out waiting for CDP pipe response: ${method}.\\n${this.stderr()}`));\n      }, 10000);'''
          timeout_new = '''        reject(new Error(`Timed out waiting for CDP pipe response: ${method}.\\n${this.stderr()}`));\n      }, timeoutMs);'''
          if timeout_old in text:
              text = text.replace(timeout_old, timeout_new, 1)
          elif timeout_new not in text:
              raise SystemExit("CDP send timeout body anchor missing")

          bootstrap_old = '''  const browserVersion = await browserClient.send("Browser.getVersion");'''
          bootstrap_new = '''  const browserVersion = await browserClient.send(\n    "Browser.getVersion",\n    {},\n    undefined,\n    60000,\n  );'''
          if bootstrap_old in text:
              text = text.replace(bootstrap_old, bootstrap_new, 1)
          elif bootstrap_new not in text:
              raise SystemExit("Browser.getVersion bootstrap anchor missing")

          path.write_text(text)
          PY

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format file permission candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: pnpm exec prettier scripts/validate-foundation.mjs scripts/validate-node-08.mjs scripts/validate-node-09.mjs apps/browser-extension/scripts/validate-extension-package.mjs scripts/run-node-31-file-protocol-runtime.mjs --write

      - name: Revalidate foundation after formatting
        run: node scripts/validate-foundation.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 File protocol P0
        run: node scripts/run-node-31-file-protocol-runtime.mjs

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated file permission candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=(
            scripts/validate-foundation.mjs
            scripts/validate-node-08.mjs
            scripts/validate-node-09.mjs
            apps/browser-extension/scripts/validate-extension-package.mjs
            scripts/run-node-31-file-protocol-runtime.mjs
          )
          mkdir -p /tmp/node31-file-permission
          for file in "${files[@]}"; do
            mkdir -p "/tmp/node31-file-permission/$(dirname "$file")"
            cp "$file" "/tmp/node31-file-permission/$file"
          done
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]; then
            echo "Branch head moved during validation; refusing stale materialization."
            exit 1
          fi
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          for file in "${files[@]}"; do
            cp "/tmp/node31-file-permission/$file" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "File permission candidate already materialized."
            exit 0
          fi
          git commit -m "test(node-31): enforce explicit file access runtime gate"
          git push origin HEAD:"$HEAD_REF"
