name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize file-only host permission validator candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/validate-foundation.mjs": [(
                  '''  assert(\n    !("host_permissions" in browserManifest),\n    "region selection must not introduce broad default host permissions",\n  );''',
                  '''  const browserHostPermissions = [...(browserManifest.host_permissions ?? [])].sort();\n  assert(\n    JSON.stringify(browserHostPermissions) === JSON.stringify(["file:///*"]),\n    "browser host permissions must remain limited to file:///* for explicit local-file capture",\n  );'''
              )],
              "scripts/validate-node-08.mjs": [(
                  '''  assert(!("host_permissions" in manifest), "NODE-08 must not add broad host permissions");''',
                  '''  assert(\n    JSON.stringify([...(manifest.host_permissions ?? [])].sort()) ===\n      JSON.stringify(["file:///*"]),\n    "NODE-08 host permissions must remain limited to file:///*",\n  );'''
              )],
              "scripts/validate-node-09.mjs": [(
                  '''  for (const manifest of [standardManifest, highManifest]) {\n    assert(!("host_permissions" in manifest), "NODE-09 must not add broad host permissions");\n    assert(!("content_scripts" in manifest), "NODE-09 must preserve user-action content injection");\n  }''',
                  '''  for (const manifest of [standardManifest, highManifest]) {\n    assert(\n      JSON.stringify([...(manifest.host_permissions ?? [])].sort()) ===\n        JSON.stringify(["file:///*"]),\n      "NODE-09 host permissions must remain limited to file:///*",\n    );\n    assert(!("content_scripts" in manifest), "NODE-09 must preserve user-action content injection");\n  }'''
              )],
              "apps/browser-extension/scripts/validate-extension-package.mjs": [(
                  '''assert(\n  !("host_permissions" in manifest),\n  "capture profiles must not request broad host permissions",\n);''',
                  '''const hostPermissions = [...(manifest.host_permissions ?? [])].sort();\nassert(\n  JSON.stringify(hostPermissions) === JSON.stringify(["file:///*"]),\n  "capture profiles must request only file:///* host permission",\n);'''
              )],
          }

          for name, items in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in items:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new in text:
                      continue
                  else:
                      raise SystemExit(f"expected validator anchor missing in {name}")
              path.write_text(text)
          PY

      - name: Materialize file-access management-state runtime candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-file-protocol-runtime.mjs")
          text = path.read_text()

          old = '''  await updateFileAccess(primaryClient, extensionId, false);\n  await navigate(primaryClient, extensionPageUrl, "extension options with file access disabled");\n  const disabledAccess = await evaluate(\n    primaryClient,\n    `chrome.extension.isAllowedFileSchemeAccess()`,\n  );\n  assert(disabledAccess === false, "Explicit file URL access disable did not take effect");\n\n  await navigate(primaryClient, "chrome://extensions/", "chrome://extensions after disable");\n  await waitFor(\n    primaryClient,\n    `typeof chrome?.developerPrivate?.updateExtensionConfiguration === "function"`,\n    "chrome.developerPrivate did not recover after extension reload",\n  );\n  await updateFileAccess(primaryClient, extensionId, true);\n  await navigate(primaryClient, extensionPageUrl, "extension options with file access enabled");\n  const enabledAccess = await evaluate(\n    primaryClient,\n    `chrome.extension.isAllowedFileSchemeAccess()`,\n  );\n  assert(enabledAccess === true, "Explicit file URL access enable did not take effect");'''

          new = '''  console.log("NODE-31 file protocol: disabling explicit file access");\n  await updateFileAccess(primaryClient, extensionId, false);\n  await waitFor(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {\n      chrome.developerPrivate.getExtensionInfo(\n        ${JSON.stringify(extensionId)},\n        (info) => chrome.runtime.lastError\n          ? reject(new Error(chrome.runtime.lastError.message))\n          : resolvePromise(info.fileAccess?.isEnabled === true && info.fileAccess?.isActive === false),\n      );\n    })`,\n    "Chrome extension management state did not report file access disabled",\n  );\n  const disabledAccess = await evaluate(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {\n      chrome.developerPrivate.getExtensionInfo(\n        ${JSON.stringify(extensionId)},\n        (info) => chrome.runtime.lastError\n          ? reject(new Error(chrome.runtime.lastError.message))\n          : resolvePromise(info.fileAccess ?? null),\n      );\n    })`,\n  );\n  assert(disabledAccess?.isEnabled === true, "File access permission toggle is unavailable");\n  assert(disabledAccess?.isActive === false, "Explicit file URL access disable did not take effect");\n\n  console.log("NODE-31 file protocol: enabling explicit file access");\n  await updateFileAccess(primaryClient, extensionId, true);\n  await waitFor(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {\n      chrome.developerPrivate.getExtensionInfo(\n        ${JSON.stringify(extensionId)},\n        (info) => chrome.runtime.lastError\n          ? reject(new Error(chrome.runtime.lastError.message))\n          : resolvePromise(info.fileAccess?.isEnabled === true && info.fileAccess?.isActive === true),\n      );\n    })`,\n    "Chrome extension management state did not report file access enabled",\n  );\n  const enabledAccess = await evaluate(\n    primaryClient,\n    `new Promise((resolvePromise, reject) => {\n      chrome.developerPrivate.getExtensionInfo(\n        ${JSON.stringify(extensionId)},\n        (info) => chrome.runtime.lastError\n          ? reject(new Error(chrome.runtime.lastError.message))\n          : resolvePromise(info.fileAccess ?? null),\n      );\n    })`,\n  );\n  assert(enabledAccess?.isEnabled === true, "File access permission toggle became unavailable");\n  assert(enabledAccess?.isActive === true, "Explicit file URL access enable did not take effect");'''

          if old not in text:
              raise SystemExit("file-access state transition anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace('version: "1.1.0"', 'version: "1.2.0"', 1)
          text = text.replace(
              '"public-extension-api-reports-file-access-disabled",',
              '"chrome-management-state-reports-file-access-disabled",',
              1,
          )
          text = text.replace(
              '"public-extension-api-reports-file-access-enabled",',
              '"chrome-management-state-reports-file-access-enabled",\n          "public-extension-api-reports-file-access-enabled",',
              1,
          )
          path.write_text(text)
          PY

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format file permission candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: pnpm exec prettier scripts/validate-foundation.mjs scripts/validate-node-08.mjs scripts/validate-node-09.mjs apps/browser-extension/scripts/validate-extension-package.mjs scripts/run-node-31-file-protocol-runtime.mjs --write

      - name: Revalidate foundation after formatting
        run: node scripts/validate-foundation.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 File protocol P0
        run: node scripts/run-node-31-file-protocol-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated file permission validator migration
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=(
            scripts/validate-foundation.mjs
            scripts/validate-node-08.mjs
            scripts/validate-node-09.mjs
            apps/browser-extension/scripts/validate-extension-package.mjs
            scripts/run-node-31-file-protocol-runtime.mjs
          )
          mkdir -p /tmp/node31-file-permission
          for file in "${files[@]}"; do
            mkdir -p "/tmp/node31-file-permission/$(dirname "$file")"
            cp "$file" "/tmp/node31-file-permission/$file"
          done
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]; then
            echo "Branch head moved during validation; refusing stale materialization."
            exit 1
          fi
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          for file in "${files[@]}"; do
            cp "/tmp/node31-file-permission/$file" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "File permission validator candidate already materialized."
            exit 0
          fi
          git commit -m "test(node-31): enforce explicit file access runtime gate"
          git push origin HEAD:"$HEAD_REF"
