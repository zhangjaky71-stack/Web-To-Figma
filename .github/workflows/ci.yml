name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format font geometry runtime candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: pnpm exec prettier scripts/run-node-31-font-geometry-runtime.mjs --write

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 File protocol P0
        run: node scripts/run-node-31-file-protocol-runtime.mjs

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: NODE-31 Font geometry P0
        run: node scripts/run-node-31-font-geometry-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated font geometry runtime formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/node31-font-geometry-runtime/scripts
          cp scripts/run-node-31-font-geometry-runtime.mjs /tmp/node31-font-geometry-runtime/scripts/run-node-31-font-geometry-runtime.mjs
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]; then
            echo "Branch head moved during validation; refusing stale materialization."
            exit 1
          fi
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/node31-font-geometry-runtime/scripts/run-node-31-font-geometry-runtime.mjs scripts/run-node-31-font-geometry-runtime.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-node-31-font-geometry-runtime.mjs
          if git diff --cached --quiet; then
            echo "Font geometry runtime already formatted."
            exit 0
          fi
          git commit -m "style(node-31): format font geometry runtime"
          git push origin HEAD:"$HEAD_REF"
