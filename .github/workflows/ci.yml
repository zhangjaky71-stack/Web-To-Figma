name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate NODE-31 P0 promotion blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const HEAD = "a563cf2046b613d64ba7402034979c70e567bd7a";
          const MERGE_REF = "778f68f85c9b4032b39dc8053c7496a743fe5322";
          const BASE = "28b52dc3e0d3074bf76205c8deb324a06dfe9e23";
          const RUN_NUMBER = 847;
          const RUN_ID = 33049035729;
          const JOB_ID = 98439753613;
          const oldAuditPath = "docs/qa/results/NODE-31_P0_AUDIT_825.json";
          const newAuditPath = "docs/qa/results/NODE-31_P0_AUDIT_847.json";
          const manifestPath = "docs/qa/NODE-31_RC_EVIDENCE_V1.json";
          const validatorPath = "scripts/validate-node-31-p0.mjs";
          const standardEvidencePath = "docs/qa/results/NODE-31_STANDARD_CAPTURE_RUNTIME_EVIDENCE_847.json";
          const pluginEvidencePath = "docs/qa/results/NODE-31_PLUGIN_UI_EVIDENCE_847.json";
          const standardSource = "packages/standard-capture-adapter/src/capture.ts";
          const standardTest = "packages/standard-capture-adapter/test/capture-contract.test.ts";
          const standardHarness = "scripts/run-node-31-standard-capture-runtime.mjs";
          const p0Fixture = "qa/corpus/node31/p0/standard-capture-runtime.html";
          const corpusValidator = "scripts/validate-node-31-corpus.mjs";
          const shadowFixture = "qa/corpus/node31/class-b/shadow-dom.html";
          const iframeFixture = "qa/corpus/node31/class-b/iframe.html";
          const pluginHarness = "scripts/run-node-31-plugin-ui-runtime.mjs";
          const pluginStaticUi = "apps/figma-plugin/static/ui.html";
          const pluginUiSource = "apps/figma-plugin/src/ui.ts";
          const pluginIntakeSource = "apps/figma-plugin/src/intake-state.ts";
          const blockers = [
            "file-protocol-explicit-permission",
            "visual-state-freeze-and-restore",
            "drop-on-canvas-path",
            "geometry-preserving-correction-policy",
            "raster-text-only-when-policy-justifies",
          ];

          function fail(message) {
            throw new Error(message);
          }

          function replaceOnce(source, needle, replacement, label) {
            if (!source.includes(needle)) fail(`missing replacement anchor: ${label}`);
            const updated = source.replace(needle, replacement);
            if (updated === source) fail(`replacement did not change source: ${label}`);
            return updated;
          }

          function replaceBlock(source, startMarker, endMarker, replacement, label) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0 || end <= start) fail(`missing block anchor: ${label}`);
            return `${source.slice(0, start)}${replacement}${source.slice(end)}`;
          }

          const audit = JSON.parse(readFileSync(oldAuditPath, "utf8"));
          audit.auditedAgainstBranchHead = HEAD;
          audit.ci = {
            runNumber: RUN_NUMBER,
            runId: RUN_ID,
            jobId: JOB_ID,
            branchHead: HEAD,
            mergeRef: MERGE_REF,
            base: BASE,
            conclusion: "PASS",
            qualityChecks: {
              node31Validator: "PASS",
              node31CorpusValidator: "PASS",
              node31P0Validator: "PASS",
              lint: "PASS",
              typecheck: "PASS",
              tests: "PASS",
              build: "PASS",
              browserRuntime: "PASS",
              standardCaptureRuntime: "PASS",
              pluginUiChooseFileRuntime: "PASS",
              format: "PASS",
            },
          };

          for (const section of [audit.capture, audit.packageAcceptance, audit.importAcceptance, audit.fontAcceptance]) {
            for (const entry of section) {
              if (typeof entry.reason === "string") entry.reason = entry.reason.replaceAll("CI #825", "CI #847");
            }
          }

          function promote(section, id, sourceArtifacts, reason) {
            const entry = section.find((item) => item.id === id);
            if (!entry) fail(`missing audit item ${id}`);
            entry.status = "PASS";
            entry.sourceArtifacts = sourceArtifacts;
            entry.reason = reason;
          }

          const standardRuntimeArtifacts = [standardSource, standardTest, p0Fixture, standardHarness, standardEvidencePath];
          promote(
            audit.capture,
            "current-document-deterministic-online",
            standardRuntimeArtifacts,
            "CI #847 runs the final packaged Standard capture adapter against a real current HTTP document in headless Chrome and repeats document capture 10 times. After removing only volatile capturedAt evidence, all ten snapshots are byte-identical, directly proving deterministic current-document capture for this versioned runtime fixture.",
          );
          promote(
            audit.capture,
            "region-intersections-and-structural-ancestors",
            standardRuntimeArtifacts,
            "CI #847 exercises real-browser region capture and proves partial intersections are retained, geometry-free structural ancestors are retained, non-intersecting siblings are excluded, and relationship closure remains valid.",
          );
          promote(
            audit.capture,
            "document-and-primary-app-scroll-root-semantics",
            standardRuntimeArtifacts,
            "CI #847 uses a real browser fixture with both the document scroll root and a large application scroll container. The final packaged Standard adapter preserves both live scroll positions and marks the qualifying application container as the primary application scroll root.",
          );
          promote(
            audit.capture,
            "open-shadow-dom-slot-composed-tree",
            [standardSource, shadowFixture, corpusValidator, standardHarness, standardEvidencePath],
            "CI #847 reruns the final packaged Standard adapter in real Chrome against the versioned open-ShadowRoot fixture and preserves host, named slot, source/composed parent, assignedSlotId, and editable shadow/slotted text evidence.",
          );
          promote(
            audit.capture,
            "same-origin-iframe",
            [standardSource, iframeFixture, corpusValidator, standardHarness, standardEvidencePath],
            "CI #847 reruns the final packaged Standard adapter in real Chrome against the versioned same-origin iframe fixture and preserves the accessible child frame, nested document linkage, editable child-frame text, and absence of false inaccessible-frame diagnostics.",
          );
          promote(
            audit.capture,
            "inaccessible-cross-origin-frame-diagnostic",
            standardRuntimeArtifacts,
            "CI #847 runs the final packaged Standard adapter against a real cross-origin iframe boundary. The snapshot records an inaccessible child frame, links STANDARD_CAPTURE_FRAME_INACCESSIBLE to the iframe boundary, and does not fabricate an editable child subtree.",
          );
          promote(
            audit.importAcceptance,
            "choose-file-path",
            [pluginStaticUi, pluginUiSource, pluginIntakeSource, pluginHarness, pluginEvidencePath],
            "CI #847 loads the final built Figma plugin UI in real Chrome, uses a trusted CDP pointer click to open the native single-file chooser, assigns a real .wtf archive, securely parses it to preview-ready, preserves choose-source intake metadata and parsed handoff payloads, and emits the render request only after the user import action.",
          );

          audit.blockingUnavailableCount = blockers.length;
          audit.blockingUnavailableIds = blockers;
          writeFileSync(newAuditPath, `${JSON.stringify(audit, null, 2)}\n`);

          let manifest = readFileSync(manifestPath, "utf8");
          const oldP0 = `  "p0": {
            "status": "UNAVAILABLE",
            "evidenceArtifact": "docs/qa/results/NODE-31_P0_AUDIT_825.json",
            "blockingUnavailableCount": 10,
            "note": "P0 audit is intentionally fail-closed. Real Chrome proves region-selector cleanup and now directly proves open Shadow DOM/slot composed-tree plus same-origin iframe structured Standard capture; exact/nearest font mapping has deterministic policy tests plus persistent requested-to-chosen diagnostics; CI #798 proves capture-profile-required Pixel Ground Truth is fail-closed at the final .wtf packaging boundary. Ten browser-runtime/UI/font-policy items remain UNAVAILABLE until direct evidence exists."
          },`;
          const newP0 = `  "p0": {
            "status": "UNAVAILABLE",
            "evidenceArtifact": "docs/qa/results/NODE-31_P0_AUDIT_847.json",
            "blockingUnavailableCount": 5,
            "note": "P0 audit remains fail-closed. CI #847 adds real-Chrome proof for deterministic current HTTP document capture, region ancestor closure, document/primary application scroll roots, inaccessible cross-origin iframe diagnostics, and the native choose-file intake path. Five items remain UNAVAILABLE: explicit file:// permission capture, visual-state freeze/restore, drop-on-canvas intake, geometry-preserving correction policy, and raster-text policy justification."
          },`;
          manifest = replaceOnce(manifest, oldP0, newP0, "manifest p0 block");
          writeFileSync(manifestPath, manifest);

          let validator = readFileSync(validatorPath, "utf8");
          validator = replaceOnce(
            validator,
            'const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_825.json";',
            'const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_847.json";',
            "audit path",
          );
          validator = replaceOnce(
            validator,
            'const standardCaptureEvidencePath =\n  "docs/qa/results/NODE-31_STANDARD_CAPTURE_RUNTIME_EVIDENCE_825.json";',
            'const standardCaptureEvidencePath =\n  "docs/qa/results/NODE-31_STANDARD_CAPTURE_RUNTIME_EVIDENCE_847.json";\nconst pluginUiEvidencePath = "docs/qa/results/NODE-31_PLUGIN_UI_EVIDENCE_847.json";',
            "evidence paths",
          );
          validator = replaceOnce(
            validator,
            'const iframeFixturePath = "qa/corpus/node31/class-b/iframe.html";',
            'const iframeFixturePath = "qa/corpus/node31/class-b/iframe.html";\nconst p0StandardFixturePath = "qa/corpus/node31/p0/standard-capture-runtime.html";\nconst standardCaptureTestPath = "packages/standard-capture-adapter/test/capture-contract.test.ts";\nconst pluginUiHarnessPath = "scripts/run-node-31-plugin-ui-runtime.mjs";\nconst pluginUiStaticPath = "apps/figma-plugin/static/ui.html";\nconst pluginUiSourcePath = "apps/figma-plugin/src/ui.ts";\nconst pluginUiIntakePath = "apps/figma-plugin/src/intake-state.ts";',
            "runtime source paths",
          );

          const oldBlockers = `const expectedBlockingIds = [
            "current-document-deterministic-online",
            "file-protocol-explicit-permission",
            "region-intersections-and-structural-ancestors",
            "document-and-primary-app-scroll-root-semantics",
            "inaccessible-cross-origin-frame-diagnostic",
            "visual-state-freeze-and-restore",
            "choose-file-path",
            "drop-on-canvas-path",
            "geometry-preserving-correction-policy",
            "raster-text-only-when-policy-justifies",
          ].sort();`;
          const newBlockers = `const expectedBlockingIds = [
            "file-protocol-explicit-permission",
            "visual-state-freeze-and-restore",
            "drop-on-canvas-path",
            "geometry-preserving-correction-policy",
            "raster-text-only-when-policy-justifies",
          ].sort();`;
          validator = replaceOnce(validator, oldBlockers, newBlockers, "blocker set");

          const oldStandardAssertions = `const expectedStandardCaptureAssertions = [
            "open-shadow-root-captured",
            "shadow-host-relationship-preserved",
            "named-slot-captured",
            "slotted-light-dom-source-parent-preserved",
            "slotted-light-dom-composed-parent-remapped",
            "slotted-light-dom-assigned-slot-id-preserved",
            "shadow-root-editable-text-captured",
            "same-origin-iframe-accessible-child-frame-captured",
            "same-origin-iframe-root-linked-to-boundary",
            "same-origin-iframe-editable-text-captured",
            "same-origin-iframe-no-inaccessible-diagnostic",
          ].sort();`;
          const newStandardAssertions = `const expectedStandardCaptureAssertions = [
            "open-shadow-root-captured",
            "shadow-host-relationship-preserved",
            "named-slot-captured",
            "slotted-light-dom-source-parent-preserved",
            "slotted-light-dom-composed-parent-remapped",
            "slotted-light-dom-assigned-slot-id-preserved",
            "shadow-root-editable-text-captured",
            "same-origin-iframe-accessible-child-frame-captured",
            "same-origin-iframe-root-linked-to-boundary",
            "same-origin-iframe-editable-text-captured",
            "same-origin-iframe-no-inaccessible-diagnostic",
            "current-http-document-capture-repeat-10-normalized-identical",
            "document-scroll-root-live-position-preserved",
            "primary-app-scroll-root-identified",
            "primary-app-scroll-root-live-position-preserved",
            "cross-origin-iframe-inaccessible-frame-recorded",
            "cross-origin-iframe-diagnostic-linked-to-boundary",
            "cross-origin-iframe-no-editable-child-subtree-fabricated",
            "region-partial-intersection-retained",
            "region-geometry-free-structural-ancestor-retained",
            "region-non-intersecting-sibling-excluded",
            "region-relationship-closure-preserved",
          ].sort();

          const expectedPluginUiAssertions = [
            "choose-button-opens-native-single-file-chooser",
            "native-file-input-receives-real-wtf-file",
            "intake-metadata-preserves-choose-source",
            "secure-parser-reaches-preview-ready",
            "secure-parser-preview-exposes-render-and-section-counts",
            "import-enabled-only-after-secure-parse",
            "choose-flow-emits-no-runtime-error",
            "parsed-render-tree-handoff-preserved",
            "parsed-source-graph-handoff-preserved",
            "render-request-emitted-after-user-import-action",
          ].sort();`;
          validator = replaceOnce(
            validator,
            oldStandardAssertions,
            newStandardAssertions,
            "runtime assertion sets",
          );

          validator = replaceOnce(
            validator,
            `  standardCaptureEvidencePath,
            runtimeHarnessPath,`,
            `  standardCaptureEvidencePath,
            pluginUiEvidencePath,
            runtimeHarnessPath,`,
            "required evidence files",
          );
          validator = replaceOnce(
            validator,
            `  shadowFixturePath,
            iframeFixturePath,
          ]);`,
            `  shadowFixturePath,
            iframeFixturePath,
            p0StandardFixturePath,
            standardCaptureTestPath,
            pluginUiHarnessPath,
            pluginUiStaticPath,
            pluginUiSourcePath,
            pluginUiIntakePath,
          ]);`,
            "required runtime files",
          );
          validator = replaceOnce(
            validator,
            `const standardCaptureEvidence = readJson(standardCaptureEvidencePath);`,
            `const standardCaptureEvidence = readJson(standardCaptureEvidencePath);
          const pluginUiEvidence = readJson(pluginUiEvidencePath);`,
            "plugin evidence load",
          );

          const standardAndPluginValidation = `if (standardCaptureEvidence) {
            assert(standardCaptureEvidence.version === "1.1.0", "Standard capture evidence version mismatch");
            assert(
              standardCaptureEvidence.evidenceType === "node31-standard-capture-browser-runtime",
              "Standard capture evidenceType mismatch",
            );
            assert(standardCaptureEvidence.status === "PASS", "Standard capture evidence must PASS");
            assert(standardCaptureEvidence.ci?.runNumber === 847, "Standard capture must identify CI #847");
            assert(standardCaptureEvidence.ci?.runId === 33049035729, "Standard capture run id mismatch");
            assert(standardCaptureEvidence.ci?.jobId === 98439753613, "Standard capture job id mismatch");
            assert(standardCaptureEvidence.ci?.branchHead === "${HEAD}", "Standard capture branch head mismatch");
            assert(standardCaptureEvidence.ci?.mergeRef === "${MERGE_REF}", "Standard capture merge ref mismatch");
            assert(standardCaptureEvidence.ci?.base === "${BASE}", "Standard capture base mismatch");
            assertQualityChecks(
              standardCaptureEvidence,
              [
                "node31Validator",
                "node31CorpusValidator",
                "node31P0Validator",
                "lint",
                "typecheck",
                "tests",
                "build",
                "browserRuntime",
                "standardCaptureRuntime",
                "pluginUiChooseFileRuntime",
                "format",
              ],
              "Standard capture evidence",
            );
            assert(standardCaptureEvidence.environment?.chrome === "Chrome/151.0.7922.137", "Standard capture Chrome mismatch");
            assert(standardCaptureEvidence.environment?.node === "24.19.0", "Standard capture Node mismatch");
            assert(standardCaptureEvidence.environment?.pnpm === "11.22.0", "Standard capture pnpm mismatch");
            assert(standardCaptureEvidence.harnessArtifact === standardCaptureHarnessPath, "Standard capture harness mismatch");
            assert(standardCaptureEvidence.loadedBuiltArtifact === standardCaptureBuiltArtifactPath, "Standard capture built artifact mismatch");
            assertArrayEquals(
              standardCaptureEvidence.fixtureArtifacts,
              [shadowFixturePath, iframeFixturePath, p0StandardFixturePath],
              "Standard capture fixture set mismatch",
            );
            assertIncludesAll(
              standardCaptureEvidence.supportingSourceArtifacts,
              [standardCaptureSourcePath, standardCaptureTestPath, corpusValidatorPath],
              "Standard capture source",
            );
            assert(
              Array.isArray(standardCaptureEvidence.transportBoundary?.mocked) && standardCaptureEvidence.transportBoundary.mocked.length === 0,
              "Standard capture runtime must not mock the capture boundary",
            );
            assertArrayEquals(
              standardCaptureEvidence.assertions,
              expectedStandardCaptureAssertions,
              "Standard capture assertion set mismatch",
            );
            assert(
              standardCaptureEvidence.suiteEvidence?.browserExtension?.testFiles === 27 &&
                standardCaptureEvidence.suiteEvidence?.browserExtension?.testCount === 74 &&
                standardCaptureEvidence.suiteEvidence?.browserExtension?.status === "PASS",
              "Standard capture browser extension suite mismatch",
            );
            assert(
              standardCaptureEvidence.suiteEvidence?.standardCaptureAdapter?.testFiles === 2 &&
                standardCaptureEvidence.suiteEvidence?.standardCaptureAdapter?.testCount === 7 &&
                standardCaptureEvidence.suiteEvidence?.standardCaptureAdapter?.status === "PASS",
              "Standard capture adapter suite mismatch",
            );
            assertArrayEquals(
              standardCaptureEvidence.provesP0Items,
              [
                "current-document-deterministic-online",
                "region-intersections-and-structural-ancestors",
                "document-and-primary-app-scroll-root-semantics",
                "open-shadow-dom-slot-composed-tree",
                "same-origin-iframe",
                "inaccessible-cross-origin-frame-diagnostic",
              ],
              "Standard capture proven P0 set mismatch",
            );
            assertIncludesAll(
              standardCaptureEvidence.notProvenByThisArtifact,
              [...expectedBlockingIds, "choose-file-path", ...releaseBoundaries],
              "Standard capture not-proven boundary",
            );
          }

          if (pluginUiEvidence) {
            assert(pluginUiEvidence.version === "1.0.0", "Plugin UI evidence version mismatch");
            assert(pluginUiEvidence.evidenceType === "node31-plugin-ui-choose-file-runtime", "Plugin UI evidenceType mismatch");
            assert(pluginUiEvidence.status === "PASS", "Plugin UI evidence must PASS");
            assert(pluginUiEvidence.ci?.runNumber === 847, "Plugin UI evidence must identify CI #847");
            assert(pluginUiEvidence.ci?.runId === 33049035729, "Plugin UI run id mismatch");
            assert(pluginUiEvidence.ci?.jobId === 98439753613, "Plugin UI job id mismatch");
            assert(pluginUiEvidence.ci?.branchHead === "${HEAD}", "Plugin UI branch head mismatch");
            assert(pluginUiEvidence.ci?.mergeRef === "${MERGE_REF}", "Plugin UI merge ref mismatch");
            assert(pluginUiEvidence.ci?.base === "${BASE}", "Plugin UI base mismatch");
            assertQualityChecks(
              pluginUiEvidence,
              [
                "node31Validator",
                "node31CorpusValidator",
                "node31P0Validator",
                "lint",
                "typecheck",
                "tests",
                "build",
                "browserRuntime",
                "standardCaptureRuntime",
                "pluginUiChooseFileRuntime",
                "format",
              ],
              "Plugin UI evidence",
            );
            assert(pluginUiEvidence.environment?.chrome === "Chrome/151.0.7922.137", "Plugin UI Chrome mismatch");
            assert(pluginUiEvidence.harnessArtifact === pluginUiHarnessPath, "Plugin UI harness mismatch");
            assert(pluginUiEvidence.loadedBuiltArtifact === "apps/figma-plugin/dist/ui.html", "Plugin UI built artifact mismatch");
            assert(pluginUiEvidence.fixtureProducer === "packages/wtf-packager/dist/index.js", "Plugin UI fixture producer mismatch");
            assert(
              pluginUiEvidence.fixtureArchiveSha256 === "ab7f99170edd51a1d89536303977fb14c2635c6c181a217b2f537d3ab91ac97c",
              "Plugin UI fixture archive hash mismatch",
            );
            assertIncludesAll(
              pluginUiEvidence.productSourceArtifacts,
              [pluginUiStaticPath, pluginUiSourcePath, pluginUiIntakePath],
              "Plugin UI source",
            );
            assertArrayEquals(pluginUiEvidence.assertions, expectedPluginUiAssertions, "Plugin UI assertion set mismatch");
            assertArrayEquals(pluginUiEvidence.provesP0Items, ["choose-file-path"], "Plugin UI proven P0 set mismatch");
            assertIncludesAll(
              pluginUiEvidence.notProvenByThisArtifact,
              [...expectedBlockingIds, ...releaseBoundaries],
              "Plugin UI not-proven boundary",
            );
          }

          `;
          validator = replaceBlock(
            validator,
            "if (standardCaptureEvidence) {",
            "if (audit) {",
            standardAndPluginValidation,
            "standard/plugin evidence validation",
          );

          const auditValidation = `if (audit) {
            assert(audit.version === "1.0.0", "P0 audit version mismatch");
            assert(audit.evidenceType === "node31-p0-audit", "P0 audit evidenceType mismatch");
            assert(audit.contract === "docs/ACCEPTANCE_CONTRACT_V2.md", "P0 audit contract mismatch");
            assert(audit.auditedAgainstBranchHead === "${HEAD}", "P0 audit must stay anchored to exact-head CI #847");
            assert(audit.ci?.runNumber === 847, "P0 audit must identify CI #847");
            assert(audit.ci?.runId === 33049035729, "P0 audit run id mismatch");
            assert(audit.ci?.jobId === 98439753613, "P0 audit job id mismatch");
            assert(audit.ci?.branchHead === "${HEAD}", "P0 audit branch head mismatch");
            assert(audit.ci?.mergeRef === "${MERGE_REF}", "P0 audit merge ref mismatch");
            assert(audit.ci?.base === "${BASE}", "P0 audit base mismatch");
            assert(audit.ci?.conclusion === "PASS", "P0 audit CI must PASS");
            assertQualityChecks(
              audit,
              [
                "node31Validator",
                "node31CorpusValidator",
                "node31P0Validator",
                "lint",
                "typecheck",
                "tests",
                "build",
                "browserRuntime",
                "standardCaptureRuntime",
                "pluginUiChooseFileRuntime",
                "format",
              ],
              "P0 audit",
            );
            assert(audit.policy?.unavailableIsPass === false, "P0 audit must fail closed on UNAVAILABLE");
            assert(audit.policy?.overallStatus === "UNAVAILABLE", "P0 audit overall status must remain UNAVAILABLE");

            const allItems = [];
            for (const [sectionName, ids] of Object.entries(requiredIds)) {
              validateAuditSection(audit, sectionName, ids, allItems);
            }
            const byId = new Map(allItems.map((entry) => [entry.id, entry]));

            const standardP0RuntimeProvenance = [
              standardCaptureSourcePath,
              standardCaptureTestPath,
              p0StandardFixturePath,
              standardCaptureHarnessPath,
              standardCaptureEvidencePath,
            ];
            const requiredPassProvenance = new Map([
              ["finally-scroll-focus-temporary-style-restore", [runtimeProductSourcePath, runtimeHarnessPath, runtimeEvidencePath]],
              ["exact-available-font-preferred", [fontResolutionPath, fontRendererPath, fontResolutionTestPath, fontEvidencePath]],
              [
                "nearest-mapping-with-diagnostic",
                [fontResolutionPath, fontDiagnosticsPath, fontRendererPath, fontResolutionTestPath, fontDiagnosticsTestPath, fontEvidencePath],
              ],
              [
                "profile-required-pixel-ground-truth-end-to-end",
                [pixelRuntimePath, pixelContractPath, profilePackagePath, wtfExportRuntimePath, wtfPackageBuilderPath, pixelIntegrationTestPath, node21PackageValidatorPath, pixelEvidencePath],
              ],
              ["current-document-deterministic-online", standardP0RuntimeProvenance],
              ["region-intersections-and-structural-ancestors", standardP0RuntimeProvenance],
              ["document-and-primary-app-scroll-root-semantics", standardP0RuntimeProvenance],
              [
                "open-shadow-dom-slot-composed-tree",
                [standardCaptureSourcePath, shadowFixturePath, corpusValidatorPath, standardCaptureHarnessPath, standardCaptureEvidencePath],
              ],
              [
                "same-origin-iframe",
                [standardCaptureSourcePath, iframeFixturePath, corpusValidatorPath, standardCaptureHarnessPath, standardCaptureEvidencePath],
              ],
              ["inaccessible-cross-origin-frame-diagnostic", standardP0RuntimeProvenance],
              [
                "choose-file-path",
                [pluginUiStaticPath, pluginUiSourcePath, pluginUiIntakePath, pluginUiHarnessPath, pluginUiEvidencePath],
              ],
            ]);

            for (const [id, artifacts] of requiredPassProvenance) {
              const entry = byId.get(id);
              assert(entry?.status === "PASS", \`P0 item \${id} must be PASS\`);
              assertIncludesAll(entry?.sourceArtifacts, artifacts, \`P0 item \${id} provenance\`);
            }

            const unavailableIds = allItems
              .filter((entry) => entry.status === "UNAVAILABLE")
              .map((entry) => entry.id)
              .sort();
            assertArrayEquals(unavailableIds, expectedBlockingIds, "P0 unavailable set mismatch");
            assertArrayEquals(audit.blockingUnavailableIds, expectedBlockingIds, "P0 declared blocker set mismatch");
            assert(audit.blockingUnavailableCount === 5, "P0 audit must retain exactly 5 blockers");

            if (manifest) {
              assert(manifest.p0?.status === "UNAVAILABLE", "manifest P0 must remain UNAVAILABLE");
              assert(manifest.p0?.evidenceArtifact === auditPath, "manifest P0 evidenceArtifact mismatch");
              assert(manifest.p0?.blockingUnavailableCount === 5, "manifest P0 blocker count must be 5");
            }
          }

          `;
          validator = replaceBlock(
            validator,
            "if (audit) {",
            "if (failures.length > 0) {",
            auditValidation,
            "audit validation",
          );
          writeFileSync(validatorPath, validator);
          NODE

          pnpm exec prettier docs/qa/results/NODE-31_P0_AUDIT_847.json docs/qa/NODE-31_RC_EVIDENCE_V1.json scripts/validate-node-31-p0.mjs --write
