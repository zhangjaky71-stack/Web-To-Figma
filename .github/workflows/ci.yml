name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply NODE-31 canvas-drop evidence promotion candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const oldAuditPath = "docs/qa/results/NODE-31_P0_AUDIT_847.json";
          const newAuditPath = "docs/qa/results/NODE-31_P0_AUDIT_861.json";
          const canvasEvidencePath = "docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json";
          const manifestPath = "docs/qa/NODE-31_RC_EVIDENCE_V1.json";
          const validatorPath = "scripts/validate-node-31-p0.mjs";
          const branchHead = "6195def8a960843c2ea2883638c84386e2ef733a";
          const mergeRef = "0b1bd9b0278471c1621d4c502c5579bef05e185c";
          const base = "28b52dc3e0d3074bf76205c8deb324a06dfe9e23";
          const remainingBlockers = [
            "file-protocol-explicit-permission",
            "visual-state-freeze-and-restore",
            "geometry-preserving-correction-policy",
            "raster-text-only-when-policy-justifies",
          ];
          const releaseBoundaries = [
            "zero-known-critical-security-blockers",
            "zero-known-high-security-blockers",
            "class-a-visual-geometry-text-asset-structure-measurements",
            "class-b-browser-to-wtf-to-figma-measurements",
          ];
          const qualityChecks = {
            node31Validator: "PASS",
            node31CorpusValidator: "PASS",
            node31P0Validator: "PASS",
            lint: "PASS",
            typecheck: "PASS",
            tests: "PASS",
            build: "PASS",
            browserRuntime: "PASS",
            standardCaptureRuntime: "PASS",
            pluginUiChooseFileRuntime: "PASS",
            pluginCanvasDropRuntime: "PASS",
            format: "PASS",
          };
          const canvasAssertions = [
            "final-main-registers-figma-canvas-drop-handler",
            "non-wtf-canvas-drop-passes-through-without-byte-read",
            "wtf-canvas-drop-consumed-by-plugin",
            "canvas-drop-file-bytes-read-once",
            "canvas-drop-bytes-forwarded-main-to-final-ui",
            "canvas-drop-source-preserved",
            "canvas-drop-absolute-point-preserved-in-intake-metadata",
            "canvas-drop-byte-length-preserved",
            "canvas-drop-secure-parser-reaches-preview-ready",
            "canvas-drop-import-disabled-until-secure-parse-completes",
            "canvas-drop-source-and-rounded-point-visible-in-ui",
            "trusted-import-pointer-emits-render-request",
            "canvas-drop-intake-identity-preserved-to-render-request",
            "canvas-drop-destination-preserved-to-render-request",
            "canvas-drop-parsed-render-tree-handoff-preserved",
            "canvas-drop-parsed-source-graph-handoff-preserved",
          ];

          function readJson(path) {
            return JSON.parse(readFileSync(path, "utf8"));
          }
          function writeJson(path, value) {
            writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`missing validator patch point: ${label}`);
            return source.replace(before, after);
          }

          const canvasEvidence = {
            version: "1.0.0",
            evidenceType: "node31-plugin-canvas-drop-integration-runtime",
            status: "PASS",
            contract: "docs/ACCEPTANCE_CONTRACT_V2.md",
            ci: {
              runNumber: 861,
              runId: 33074321682,
              jobId: 98524433660,
              branchHead,
              mergeRef,
              base,
              conclusion: "PASS",
              qualityChecks,
            },
            environment: {
              runner: "ubuntu-24.04",
              os: "Ubuntu 24.04.4",
              node: "24.19.0",
              pnpm: "11.22.0",
              chrome: "Chrome/151.0.7922.137",
            },
            harnessArtifact: "scripts/run-node-31-plugin-canvas-drop-runtime.mjs",
            productSourceArtifacts: [
              "apps/figma-plugin/src/main.ts",
              "apps/figma-plugin/src/ui.ts",
              "apps/figma-plugin/src/intake-state.ts",
            ],
            mainBundleArtifact: "apps/figma-plugin/dist/code.js",
            uiBundleArtifact: "apps/figma-plugin/dist/ui.html",
            mainBundleSha256: "a4a4ccd413f3830542ddd0d96ed669a9c3883ffdbb601c2f9b669bf662822711",
            uiBundleSha256: "d71609a9fd4041ad34060d74b64163163d4fc44b8f07f46ed980bb9382137147",
            fixtureProducer: "packages/wtf-packager/dist/index.js",
            fixtureArchiveSha256: "9e02cd0d1b6ae6369d1c7553f395c5cd020f4dcfcea63decccf05bebf38b9cb6",
            hostBoundary: {
              figmaApi: "simulated",
              note: "The final built plugin main bundle executes unchanged against a narrow Figma host API simulator for showUI/ui.postMessage/figma.on(drop). The final built UI, secure parser, DOM, pointer import action and .wtf bytes run in real Chrome. This is not a claim of Figma Desktop execution.",
            },
            assertions: canvasAssertions,
            provesP0Items: ["drop-on-canvas-path"],
            notProvenByThisArtifact: [...remainingBlockers, ...releaseBoundaries],
          };
          writeJson(canvasEvidencePath, canvasEvidence);

          const audit = readJson(oldAuditPath);
          audit.auditedAgainstBranchHead = branchHead;
          audit.ci = {
            runNumber: 861,
            runId: 33074321682,
            jobId: 98524433660,
            branchHead,
            mergeRef,
            base,
            conclusion: "PASS",
            qualityChecks,
          };
          for (const section of ["capture", "packageAcceptance", "importAcceptance", "fontAcceptance"]) {
            for (const item of audit[section] ?? []) {
              if (typeof item.reason === "string") item.reason = item.reason.replaceAll("CI #847", "CI #861");
            }
          }
          const dropItem = audit.importAcceptance.find((item) => item.id === "drop-on-canvas-path");
          if (!dropItem) throw new Error("drop-on-canvas-path audit item not found");
          dropItem.status = "PASS";
          dropItem.sourceArtifacts = [
            "apps/figma-plugin/src/main.ts",
            "apps/figma-plugin/src/ui.ts",
            "apps/figma-plugin/src/intake-state.ts",
            "scripts/run-node-31-plugin-canvas-drop-runtime.mjs",
            canvasEvidencePath,
          ];
          dropItem.reason =
            "CI #861 executes the final built plugin main bundle unchanged against a narrow simulated Figma host boundary, invokes its registered canvas drop handler with a real .wtf archive, reads the dropped bytes once, preserves canvas-drop source and absolute destination, forwards the bytes to the final built UI in real Chrome, completes secure parsing before enabling import, and uses a trusted pointer import action to emit a render request with the parsed Render Tree, Source Graph and destination intact. The evidence explicitly does not claim Figma Desktop execution.";
          audit.blockingUnavailableIds = [...remainingBlockers].sort();
          audit.blockingUnavailableCount = 4;
          writeJson(newAuditPath, audit);

          const manifest = readJson(manifestPath);
          manifest.p0.evidenceArtifact = newAuditPath;
          manifest.p0.blockingUnavailableCount = 4;
          manifest.p0.note =
            "P0 audit remains fail-closed. CI #861 preserves the previously proven browser/capture/choose-file paths and adds exact-head Canvas-drop integration proof using the final built plugin main bundle, a narrow simulated Figma host boundary, the final UI in real Chrome, secure parsing, destination preservation, and trusted-pointer render handoff. Four items remain UNAVAILABLE: explicit file:// permission capture, visual-state freeze/restore, geometry-preserving correction policy, and raster-text policy justification.";
          writeJson(manifestPath, manifest);

          let validator = readFileSync(validatorPath, "utf8");
          validator = replaceRequired(
            validator,
            `const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_847.json";`,
            `const auditPath = "docs/qa/results/NODE-31_P0_AUDIT_861.json";`,
            "audit path",
          );
          validator = replaceRequired(
            validator,
            `const pluginUiEvidencePath = "docs/qa/results/NODE-31_PLUGIN_UI_EVIDENCE_847.json";`,
            `const pluginUiEvidencePath = "docs/qa/results/NODE-31_PLUGIN_UI_EVIDENCE_847.json";\nconst pluginCanvasEvidencePath =\n  "docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json";`,
            "canvas evidence path",
          );
          validator = replaceRequired(
            validator,
            `const pluginUiIntakePath = "apps/figma-plugin/src/intake-state.ts";`,
            `const pluginUiIntakePath = "apps/figma-plugin/src/intake-state.ts";\nconst pluginCanvasHarnessPath = "scripts/run-node-31-plugin-canvas-drop-runtime.mjs";\nconst pluginMainSourcePath = "apps/figma-plugin/src/main.ts";`,
            "canvas source constants",
          );
          validator = replaceRequired(
            validator,
            `  "visual-state-freeze-and-restore",\n  "drop-on-canvas-path",\n  "geometry-preserving-correction-policy",`,
            `  "visual-state-freeze-and-restore",\n  "geometry-preserving-correction-policy",`,
            "blocking set",
          );
          const pluginAssertionsMarker = `const p0BoundaryIds = [`;
          const canvasAssertionBlock = `const expectedPluginCanvasAssertions = ${JSON.stringify(canvasAssertions, null, 2)}.sort();\n\n`;
          validator = replaceRequired(
            validator,
            pluginAssertionsMarker,
            `${canvasAssertionBlock}${pluginAssertionsMarker}`,
            "canvas assertion constants",
          );
          validator = replaceRequired(
            validator,
            `  pluginUiEvidencePath,\n  runtimeHarnessPath,`,
            `  pluginUiEvidencePath,\n  pluginCanvasEvidencePath,\n  runtimeHarnessPath,`,
            "require canvas evidence",
          );
          validator = replaceRequired(
            validator,
            `  pluginUiIntakePath,\n]);`,
            `  pluginUiIntakePath,\n  pluginCanvasHarnessPath,\n  pluginMainSourcePath,\n]);`,
            "require canvas sources",
          );
          validator = replaceRequired(
            validator,
            `const pluginUiEvidence = readJson(pluginUiEvidencePath);`,
            `const pluginUiEvidence = readJson(pluginUiEvidencePath);\nconst pluginCanvasEvidence = readJson(pluginCanvasEvidencePath);`,
            "read canvas evidence",
          );

          const auditMarker = `if (audit) {`;
          const auditIndex = validator.indexOf(auditMarker);
          if (auditIndex < 0) throw new Error("audit validator block not found");
          const beforeAudit = validator.slice(0, auditIndex);
          let auditBlock = validator.slice(auditIndex);
          const canvasValidationBlock = `if (pluginCanvasEvidence) {\n  assert(pluginCanvasEvidence.version === "1.0.0", "Plugin canvas evidence version mismatch");\n  assert(\n    pluginCanvasEvidence.evidenceType === "node31-plugin-canvas-drop-integration-runtime",\n    "Plugin canvas evidenceType mismatch",\n  );\n  assert(pluginCanvasEvidence.status === "PASS", "Plugin canvas evidence must PASS");\n  assert(pluginCanvasEvidence.contract === "docs/ACCEPTANCE_CONTRACT_V2.md", "Plugin canvas contract mismatch");\n  assert(pluginCanvasEvidence.ci?.runNumber === 861, "Plugin canvas evidence must identify CI #861");\n  assert(pluginCanvasEvidence.ci?.runId === 33074321682, "Plugin canvas run id mismatch");\n  assert(pluginCanvasEvidence.ci?.jobId === 98524433660, "Plugin canvas job id mismatch");\n  assert(\n    pluginCanvasEvidence.ci?.branchHead === "6195def8a960843c2ea2883638c84386e2ef733a",\n    "Plugin canvas branch head mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.ci?.mergeRef === "0b1bd9b0278471c1621d4c502c5579bef05e185c",\n    "Plugin canvas merge ref mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.ci?.base === "28b52dc3e0d3074bf76205c8deb324a06dfe9e23",\n    "Plugin canvas base mismatch",\n  );\n  assertQualityChecks(\n    pluginCanvasEvidence,\n    [\n      "node31Validator",\n      "node31CorpusValidator",\n      "node31P0Validator",\n      "lint",\n      "typecheck",\n      "tests",\n      "build",\n      "browserRuntime",\n      "standardCaptureRuntime",\n      "pluginUiChooseFileRuntime",\n      "pluginCanvasDropRuntime",\n      "format",\n    ],\n    "Plugin canvas evidence",\n  );\n  assert(pluginCanvasEvidence.environment?.chrome === "Chrome/151.0.7922.137", "Plugin canvas Chrome mismatch");\n  assert(pluginCanvasEvidence.environment?.node === "24.19.0", "Plugin canvas Node mismatch");\n  assert(pluginCanvasEvidence.environment?.pnpm === "11.22.0", "Plugin canvas pnpm mismatch");\n  assert(\n    pluginCanvasEvidence.harnessArtifact === pluginCanvasHarnessPath,\n    "Plugin canvas harness mismatch",\n  );\n  assertIncludesAll(\n    pluginCanvasEvidence.productSourceArtifacts,\n    [pluginMainSourcePath, pluginUiSourcePath, pluginUiIntakePath],\n    "Plugin canvas source",\n  );\n  assert(\n    pluginCanvasEvidence.mainBundleArtifact === "apps/figma-plugin/dist/code.js",\n    "Plugin canvas main bundle artifact mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.uiBundleArtifact === "apps/figma-plugin/dist/ui.html",\n    "Plugin canvas UI bundle artifact mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.mainBundleSha256 ===\n      "a4a4ccd413f3830542ddd0d96ed669a9c3883ffdbb601c2f9b669bf662822711",\n    "Plugin canvas main bundle hash mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.uiBundleSha256 ===\n      "d71609a9fd4041ad34060d74b64163163d4fc44b8f07f46ed980bb9382137147",\n    "Plugin canvas UI bundle hash mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.fixtureProducer === "packages/wtf-packager/dist/index.js",\n    "Plugin canvas fixture producer mismatch",\n  );\n  assert(\n    pluginCanvasEvidence.fixtureArchiveSha256 ===\n      "9e02cd0d1b6ae6369d1c7553f395c5cd020f4dcfcea63decccf05bebf38b9cb6",\n    "Plugin canvas fixture archive hash mismatch",\n  );\n  assert(pluginCanvasEvidence.hostBoundary?.figmaApi === "simulated", "Plugin canvas host boundary mismatch");\n  assert(\n    typeof pluginCanvasEvidence.hostBoundary?.note === "string" &&\n      pluginCanvasEvidence.hostBoundary.note.includes("not a claim of Figma Desktop execution"),\n    "Plugin canvas evidence must preserve the non-Desktop claim boundary",\n  );\n  assertArrayEquals(\n    pluginCanvasEvidence.assertions,\n    expectedPluginCanvasAssertions,\n    "Plugin canvas assertion set mismatch",\n  );\n  assertArrayEquals(\n    pluginCanvasEvidence.provesP0Items,\n    ["drop-on-canvas-path"],\n    "Plugin canvas proven P0 set mismatch",\n  );\n  assertIncludesAll(\n    pluginCanvasEvidence.notProvenByThisArtifact,\n    [...expectedBlockingIds, ...releaseBoundaries],\n    "Plugin canvas not-proven boundary",\n  );\n}\n\n`;

          auditBlock = replaceRequired(
            auditBlock,
            `audit.auditedAgainstBranchHead === "a563cf2046b613d64ba7402034979c70e567bd7a",\n    "P0 audit must stay anchored to exact-head CI #847",`,
            `audit.auditedAgainstBranchHead === "6195def8a960843c2ea2883638c84386e2ef733a",\n    "P0 audit must stay anchored to exact-head CI #861",`,
            "audit exact head",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `assert(audit.ci?.runNumber === 847, "P0 audit must identify CI #847");\n  assert(audit.ci?.runId === 33049035729, "P0 audit run id mismatch");\n  assert(audit.ci?.jobId === 98439753613, "P0 audit job id mismatch");`,
            `assert(audit.ci?.runNumber === 861, "P0 audit must identify CI #861");\n  assert(audit.ci?.runId === 33074321682, "P0 audit run id mismatch");\n  assert(audit.ci?.jobId === 98524433660, "P0 audit job id mismatch");`,
            "audit CI ids",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `audit.ci?.branchHead === "a563cf2046b613d64ba7402034979c70e567bd7a",`,
            `audit.ci?.branchHead === "6195def8a960843c2ea2883638c84386e2ef733a",`,
            "audit branch head",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `audit.ci?.mergeRef === "778f68f85c9b4032b39dc8053c7496a743fe5322",`,
            `audit.ci?.mergeRef === "0b1bd9b0278471c1621d4c502c5579bef05e185c",`,
            "audit merge ref",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `      "pluginUiChooseFileRuntime",\n      "format",`,
            `      "pluginUiChooseFileRuntime",\n      "pluginCanvasDropRuntime",\n      "format",`,
            "audit quality checks",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `    [\n      "choose-file-path",\n      [\n        pluginUiStaticPath,\n        pluginUiSourcePath,\n        pluginUiIntakePath,\n        pluginUiHarnessPath,\n        pluginUiEvidencePath,\n      ],\n    ],\n  ]);`,
            `    [\n      "choose-file-path",\n      [\n        pluginUiStaticPath,\n        pluginUiSourcePath,\n        pluginUiIntakePath,\n        pluginUiHarnessPath,\n        pluginUiEvidencePath,\n      ],\n    ],\n    [\n      "drop-on-canvas-path",\n      [\n        pluginMainSourcePath,\n        pluginUiSourcePath,\n        pluginUiIntakePath,\n        pluginCanvasHarnessPath,\n        pluginCanvasEvidencePath,\n      ],\n    ],\n  ]);`,
            "canvas audit provenance",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `assert(audit.blockingUnavailableCount === 5, "P0 audit must retain exactly 5 blockers");`,
            `assert(audit.blockingUnavailableCount === 4, "P0 audit must retain exactly 4 blockers");`,
            "audit blocker count",
          );
          auditBlock = replaceRequired(
            auditBlock,
            `assert(manifest.p0?.blockingUnavailableCount === 5, "manifest P0 blocker count must be 5");`,
            `assert(manifest.p0?.blockingUnavailableCount === 4, "manifest P0 blocker count must be 4");`,
            "manifest blocker count",
          );
          validator = `${beforeAudit}${canvasValidationBlock}${auditBlock}`;
          writeFileSync(validatorPath, validator);
          NODE

      - name: Format NODE-31 evidence candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          npx --yes prettier@3.9.6 docs/qa/NODE-31_RC_EVIDENCE_V1.json docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json docs/qa/results/NODE-31_P0_AUDIT_861.json scripts/validate-node-31-p0.mjs --write

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated canvas-drop evidence promotion
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const changed = execFileSync("git", ["diff", "--name-only"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);
          const untracked = execFileSync("git", ["ls-files", "--others", "--exclude-standard"], {
            encoding: "utf8",
          })
            .trim()
            .split("\n")
            .filter(Boolean);
          const paths = [...new Set([...changed, ...untracked])].filter(
            (path) =>
              path === "docs/qa/NODE-31_RC_EVIDENCE_V1.json" ||
              path === "docs/qa/results/NODE-31_PLUGIN_CANVAS_DROP_EVIDENCE_861.json" ||
              path === "docs/qa/results/NODE-31_P0_AUDIT_861.json" ||
              path === "scripts/validate-node-31-p0.mjs",
          );
          if (paths.length !== 4) {
            throw new Error(`expected exactly 4 evidence-promotion files, got ${JSON.stringify(paths)}`);
          }

          const api = "https://api.github.com";
          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            "x-github-api-version": "2022-11-28",
            "content-type": "application/json",
          };
          async function request(apiPath, init = {}) {
            const response = await fetch(`${api}${apiPath}`, {
              ...init,
              headers: { ...headers, ...(init.headers ?? {}) },
            });
            const body = await response.json();
            if (!response.ok) {
              throw new Error(`GitHub API failed ${response.status} ${apiPath}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          const blobs = [];
          for (const path of paths) {
            const blob = await request(`/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: "POST",
              body: JSON.stringify({
                content: readFileSync(path).toString("base64"),
                encoding: "base64",
              }),
            });
            blobs.push({ path, sha: blob.sha });
          }
          const headCommit = await request(
            `/repos/${process.env.GITHUB_REPOSITORY}/git/commits/${process.env.HEAD_SHA}`,
          );
          const tree = await request(`/repos/${process.env.GITHUB_REPOSITORY}/git/trees`, {
            method: "POST",
            body: JSON.stringify({
              base_tree: headCommit.tree.sha,
              tree: blobs.map(({ path, sha }) => ({ path, mode: "100644", type: "blob", sha })),
            }),
          });
          const commit = await request(`/repos/${process.env.GITHUB_REPOSITORY}/git/commits`, {
            method: "POST",
            body: JSON.stringify({
              message: "docs(node-31): promote canvas-drop P0 evidence",
              tree: tree.sha,
              parents: [process.env.HEAD_SHA],
            }),
          });
          await request(`/repos/${process.env.GITHUB_REPOSITORY}/git/refs/heads/${process.env.HEAD_REF}`, {
            method: "PATCH",
            body: JSON.stringify({ sha: commit.sha, force: false }),
          });
          console.log(`Materialized canvas-drop evidence promotion as ${commit.sha}.`);
          NODE
