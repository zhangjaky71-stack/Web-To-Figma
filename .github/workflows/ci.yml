name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-01-monorepo-foundation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate authoritative lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm exec prettier --write eslint.config.mjs README.md scripts/validate-foundation.mjs

      - name: Freeze CI configuration
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Validate foundation
                  run: node scripts/validate-foundation.mjs

                - name: Setup pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 11.22.0
                    run_install: false

                - name: Setup Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: 24
                    package-manager-cache: false

                - name: Verify toolchain
                  run: |
                    node --version
                    pnpm --version

                - name: Install dependencies
                  run: pnpm install --frozen-lockfile

                - name: Lint
                  run: pnpm lint

                - name: Typecheck
                  run: pnpm typecheck

                - name: Test
                  run: pnpm test

                - name: Build
                  run: pnpm build

                - name: Format check
                  run: pnpm format:check
          YAML
          rm -f .github/workflows/format-snapshot.yml

      - name: Validate finalized repository
        run: pnpm check

      - name: Commit finalized NODE-01 bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml eslint.config.mjs README.md scripts/validate-foundation.mjs
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "build(node-01): finalize frozen lockfile CI gate"
          git push origin HEAD:feat/node-01-monorepo-foundation
