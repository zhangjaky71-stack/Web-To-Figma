name: CI

on:
  push:
    branches:
      - feat/node-05-browser-extension-shell
  pull_request:

permissions:
  contents: write

jobs:
  node-05-format-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-05-browser-extension-shell

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          apps/browser-extension
          scripts/validate-foundation.mjs
          docs/BROWSER_EXTENSION_SHELL_V2.md
          docs/adr/ADR-0005-browser-extension-mv3-shell-and-permission-boundary.md
          docs/nodes/NODE-05_BROWSER_EXTENSION_SHELL.md

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Commit formatting
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/browser-extension scripts/validate-foundation.mjs docs/BROWSER_EXTENSION_SHELL_V2.md docs/adr/ADR-0005-browser-extension-mv3-shell-and-permission-boundary.md docs/nodes/NODE-05_BROWSER_EXTENSION_SHELL.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "style(node-05): apply canonical shell documentation formatting"
          git push origin HEAD:feat/node-05-browser-extension-shell
