name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize file-only host permission validator candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/validate-foundation.mjs": [(
                  '''  assert(\n    !("host_permissions" in browserManifest),\n    "region selection must not introduce broad default host permissions",\n  );''',
                  '''  const browserHostPermissions = [...(browserManifest.host_permissions ?? [])].sort();\n  assert(\n    JSON.stringify(browserHostPermissions) === JSON.stringify(["file:///*"]),\n    "browser host permissions must remain limited to file:///* for explicit local-file capture",\n  );'''
              )],
              "scripts/validate-node-08.mjs": [(
                  '''  assert(!("host_permissions" in manifest), "NODE-08 must not add broad host permissions");''',
                  '''  assert(\n    JSON.stringify([...(manifest.host_permissions ?? [])].sort()) ===\n      JSON.stringify(["file:///*"]),\n    "NODE-08 host permissions must remain limited to file:///*",\n  );'''
              )],
              "scripts/validate-node-09.mjs": [(
                  '''  for (const manifest of [standardManifest, highManifest]) {\n    assert(!("host_permissions" in manifest), "NODE-09 must not add broad host permissions");\n    assert(!("content_scripts" in manifest), "NODE-09 must preserve user-action content injection");\n  }''',
                  '''  for (const manifest of [standardManifest, highManifest]) {\n    assert(\n      JSON.stringify([...(manifest.host_permissions ?? [])].sort()) ===\n        JSON.stringify(["file:///*"]),\n      "NODE-09 host permissions must remain limited to file:///*",\n    );\n    assert(!("content_scripts" in manifest), "NODE-09 must preserve user-action content injection");\n  }'''
              )],
              "apps/browser-extension/scripts/validate-extension-package.mjs": [(
                  '''assert(\n  !("host_permissions" in manifest),\n  "capture profiles must not request broad host permissions",\n);''',
                  '''const hostPermissions = [...(manifest.host_permissions ?? [])].sort();\nassert(\n  JSON.stringify(hostPermissions) === JSON.stringify(["file:///*"]),\n  "capture profiles must request only file:///* host permission",\n);'''
              )],
          }

          for name, items in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in items:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new in text:
                      continue
                  else:
                      raise SystemExit(f"expected validator anchor missing in {name}")
              path.write_text(text)
          PY

      - name: Materialize file runtime Chrome preference candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-file-protocol-runtime.mjs")
          text = path.read_text()
          old = '''const chromeCandidates = [
            process.env.W2F_EXTENSION_TEST_CHROME_BIN,
            process.env.CHROMIUM_BIN,
            "/usr/bin/chromium",
            "/usr/bin/chromium-browser",
            process.env.CHROME_BIN,
            "/usr/bin/google-chrome",
            "/usr/bin/google-chrome-stable",
          ].filter(Boolean);'''
          new = '''const chromeCandidates = [
            process.env.W2F_EXTENSION_TEST_CHROME_BIN,
            process.env.CHROME_BIN,
            "/usr/bin/google-chrome",
            "/usr/bin/google-chrome-stable",
            process.env.CHROMIUM_BIN,
            "/usr/bin/chromium",
            "/usr/bin/chromium-browser",
          ].filter(Boolean);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("file runtime Chrome candidate anchor missing")
          path.write_text(text)
          PY

      - name: Materialize modern unpacked extension loader candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-file-protocol-runtime.mjs")
          text = path.read_text()

          class_anchor = '''  close() {
            this.socket.close();
          }
          }

          async function waitForDevToolsPort'''
          class_replacement = '''  close() {
            this.socket.close();
          }
          }

          class PipeCdpClient {
            constructor(input, output) {
              this.input = input;
              this.output = output;
              this.nextId = 1;
              this.pending = new Map();
              this.buffer = "";
              output.setEncoding("utf8");
              output.on("data", (chunk) => {
                this.buffer += chunk;
                for (;;) {
                  const boundary = this.buffer.indexOf("\\0");
                  if (boundary < 0) break;
                  const payload = this.buffer.slice(0, boundary);
                  this.buffer = this.buffer.slice(boundary + 1);
                  if (!payload) continue;
                  const message = JSON.parse(payload);
                  if (typeof message.id !== "number") continue;
                  const pending = this.pending.get(message.id);
                  if (!pending) continue;
                  this.pending.delete(message.id);
                  clearTimeout(pending.timeout);
                  if (message.error) {
                    pending.reject(new Error(`${message.error.code}: ${message.error.message}`));
                  } else {
                    pending.resolve(message.result ?? {});
                  }
                }
              });
              output.on("close", () => {
                for (const pending of this.pending.values()) {
                  clearTimeout(pending.timeout);
                  pending.reject(new Error("CDP pipe closed before response"));
                }
                this.pending.clear();
              });
            }

            send(method, params = {}) {
              const id = this.nextId++;
              return new Promise((resolvePromise, reject) => {
                const timeout = setTimeout(() => {
                  this.pending.delete(id);
                  reject(new Error(`Timed out waiting for CDP pipe response: ${method}`));
                }, 10000);
                this.pending.set(id, { resolve: resolvePromise, reject, timeout });
                this.input.write(`${JSON.stringify({ id, method, params })}\\0`);
              });
            }

            close() {
              this.input.end();
              this.output.destroy();
            }
          }

          async function installUnpackedExtension(chromePath, profileDir) {
            let installerStderr = "";
            const installer = spawn(
              chromePath,
              [
                "--headless=new",
                "--no-sandbox",
                "--disable-dev-shm-usage",
                "--disable-gpu",
                "--remote-debugging-pipe",
                "--enable-unsafe-extension-debugging",
                `--user-data-dir=${profileDir}`,
                "about:blank",
              ],
              { stdio: ["ignore", "ignore", "pipe", "pipe", "pipe"] },
            );
            installer.stderr.setEncoding("utf8");
            installer.stderr.on("data", (chunk) => {
              installerStderr = `${installerStderr}${chunk}`.slice(-20000);
            });
            const pipeInput = installer.stdio[3];
            const pipeOutput = installer.stdio[4];
            assert(pipeInput && pipeOutput, "Chrome remote debugging pipe was not created");
            const client = new PipeCdpClient(pipeInput, pipeOutput);
            try {
              const loaded = await client.send("Extensions.loadUnpacked", {
                path: extensionRoot,
                enableInIncognito: false,
              });
              assert(loaded.id, `Extensions.loadUnpacked did not return an extension id.\\n${installerStderr}`);
              const listed = await client.send("Extensions.getExtensions");
              assert(
                listed.extensions?.some((extension) => extension.id === loaded.id),
                `CDP did not list the newly installed unpacked extension.\\n${installerStderr}`,
              );
              await client.send("Browser.close");
              assert(
                await waitForProcessExit(installer, 5000),
                `Installer Chrome did not exit after Browser.close.\\n${installerStderr}`,
              );
              return loaded.id;
            } catch (error) {
              await stopChrome(installer);
              throw new Error(`Unable to install unpacked extension through CDP: ${String(error)}\\n${installerStderr}`);
            } finally {
              client.close();
            }
          }

          async function waitForDevToolsPort'''
          if class_anchor in text:
              text = text.replace(class_anchor, class_replacement, 1)
          elif "class PipeCdpClient" not in text or "installUnpackedExtension" not in text:
              raise SystemExit("modern extension loader class anchor missing")

          try_anchor = '''try {
            chromeProcess = spawn('''
          try_replacement = '''try {
            const installedExtensionId = await installUnpackedExtension(chromePath, profileDir);
            chromeProcess = spawn('''
          if try_anchor in text:
              text = text.replace(try_anchor, try_replacement, 1)
          elif try_replacement not in text:
              raise SystemExit("modern extension installer call anchor missing")

          cli_anchor = '''      `--user-data-dir=${profileDir}`,
                `--disable-extensions-except=${extensionRoot}`,
                `--load-extension=${extensionRoot}`,
                "about:blank",'''
          cli_replacement = '''      `--user-data-dir=${profileDir}`,
                "about:blank",'''
          if cli_anchor in text:
              text = text.replace(cli_anchor, cli_replacement, 1)
          elif cli_replacement not in text:
              raise SystemExit("deprecated load-extension launch anchor missing")

          discovery_anchor = '''  const extensionInfo = await evaluate(
              primaryClient,
              `new Promise((resolvePromise, reject) => {
                chrome.developerPrivate.getExtensionsInfo(
                  { includeDisabled: true, includeTerminated: true },
                  (items) => chrome.runtime.lastError
                    ? reject(new Error(chrome.runtime.lastError.message))
                    : resolvePromise(items.find((item) => item.name.startsWith("Web-To-Figma Capture")) ?? null),
                );
              })`,
            );
            assert(
              extensionInfo?.id,
              `Loaded unpacked Web-To-Figma extension was not found with ${chromePath}`,
            );
            const extensionId = extensionInfo.id;'''
          discovery_replacement = '''  await waitFor(
              primaryClient,
              `new Promise((resolvePromise) => {
                chrome.developerPrivate.getExtensionsInfo(
                  { includeDisabled: true, includeTerminated: true },
                  (items) => resolvePromise(items.some((item) => item.id === ${JSON.stringify(installedExtensionId)})),
                );
              })`,
              `CDP-installed unpacked Web-To-Figma extension was not restored with ${chromePath}`,
            );
            const extensionId = installedExtensionId;'''
          if discovery_anchor in text:
              text = text.replace(discovery_anchor, discovery_replacement, 1)
          elif discovery_replacement not in text:
              raise SystemExit("extension discovery anchor missing")

          path.write_text(text)
          PY

      - name: Validate foundation
        run: node scripts/validate-foundation.mjs

      - name: Validate NODE-27 responsive layout
        run: node scripts/validate-node-27.mjs

      - name: Validate NODE-28 hybrid raster renderer
        run: node scripts/validate-node-28.mjs

      - name: Validate NODE-29 visual structure editability QA
        run: node scripts/validate-node-29.mjs

      - name: Validate NODE-30 responsive determinism performance QA
        run: node scripts/validate-node-30.mjs

      - name: Validate NODE-31 release candidate
        run: node scripts/validate-node-31.mjs

      - name: Validate NODE-31 Class B corpus
        run: node scripts/validate-node-31-corpus.mjs

      - name: Validate NODE-31 P0 audit
        run: node scripts/validate-node-31-p0.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format file permission candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        run: pnpm exec prettier scripts/validate-foundation.mjs scripts/validate-node-08.mjs scripts/validate-node-09.mjs apps/browser-extension/scripts/validate-extension-package.mjs scripts/run-node-31-file-protocol-runtime.mjs --write

      - name: Revalidate foundation after formatting
        run: node scripts/validate-foundation.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: NODE-31 Browser runtime P0
        run: node scripts/run-node-31-browser-runtime.mjs

      - name: NODE-31 Standard capture runtime P0
        run: node scripts/run-node-31-standard-capture-runtime.mjs

      - name: NODE-31 Visual-state freeze P0
        run: node scripts/run-node-31-visual-state-runtime.mjs

      - name: NODE-31 File protocol P0
        run: node scripts/run-node-31-file-protocol-runtime.mjs

      - name: NODE-31 Plugin UI choose-file P0
        run: node scripts/run-node-31-plugin-ui-runtime.mjs

      - name: NODE-31 Plugin canvas-drop P0
        run: node scripts/run-node-31-plugin-canvas-drop-runtime.mjs

      - name: Format check
        run: pnpm format:check

      - name: Commit validated file permission validator migration
        if: github.event_name == 'pull_request' && github.head_ref == 'node-31-real-world-compatibility-release-candidate'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=(
            scripts/validate-foundation.mjs
            scripts/validate-node-08.mjs
            scripts/validate-node-09.mjs
            apps/browser-extension/scripts/validate-extension-package.mjs
            scripts/run-node-31-file-protocol-runtime.mjs
          )
          mkdir -p /tmp/node31-file-permission
          for file in "${files[@]}"; do
            mkdir -p "/tmp/node31-file-permission/$(dirname "$file")"
            cp "$file" "/tmp/node31-file-permission/$file"
          done
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]; then
            echo "Branch head moved during validation; refusing stale materialization."
            exit 1
          fi
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          for file in "${files[@]}"; do
            cp "/tmp/node31-file-permission/$file" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "File permission validator candidate already materialized."
            exit 0
          fi
          git commit -m "test(node-31): enforce file-only host permission gate"
          git push origin HEAD:"$HEAD_REF"
