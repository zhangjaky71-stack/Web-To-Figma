name: NODE-07 Canonical Format

on:
  push:
    branches:
      - feat/node-07-region-selector-redaction

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-07-region-selector-redaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply canonical NODE-07 formatting
        run: >-
          pnpm exec prettier --write
          apps/browser-extension/src/runtime/content-script.ts
          apps/browser-extension/src/runtime/job-state.ts
          apps/browser-extension/src/runtime/popup.ts
          apps/browser-extension/src/runtime/protocol.ts
          apps/browser-extension/src/runtime/region-selection.ts
          apps/browser-extension/src/runtime/service-worker.ts
          apps/browser-extension/src/index.ts
          apps/browser-extension/test/index.test.ts
          apps/browser-extension/test/job-state.test.ts
          apps/browser-extension/test/protocol.test.ts
          apps/browser-extension/test/region-selection.test.ts
          apps/browser-extension/scripts/validate-extension-package.mjs
          apps/browser-extension/static/popup.html
          docs/REGION_SELECTOR_REDACTION_V2.md
          docs/adr/ADR-0007-region-selection-and-redaction-boundary.md
          docs/nodes/NODE-07_REGION_SELECTOR_REDACTION.md

      - name: Validate formatted implementation
        run: pnpm check

      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/browser-extension docs/REGION_SELECTOR_REDACTION_V2.md docs/adr/ADR-0007-region-selection-and-redaction-boundary.md docs/nodes/NODE-07_REGION_SELECTOR_REDACTION.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "style(node-07): apply canonical region-selector formatting"
          git push origin HEAD:feat/node-07-region-selector-redaction
