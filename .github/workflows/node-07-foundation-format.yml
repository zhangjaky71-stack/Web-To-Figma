name: NODE-07 Foundation Format

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: node-07-foundation-format
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'feat/node-07-region-selector-redaction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-07-region-selector-redaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply canonical foundation formatting
        run: pnpm exec prettier --write scripts/validate-foundation.mjs

      - name: Validate repository
        run: pnpm check

      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-foundation.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "style(node-07): format foundation validator"
          git push origin HEAD:feat/node-07-region-selector-redaction
