name: NODE-08 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: node-08-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-08-standard-dom-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-08-standard-dom-capture

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update authoritative workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-08 safe source patches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) {
              throw new Error(`NODE-08 patch target missing: ${label}`);
            }
            return source.replace(before, after);
          }

          const capturePath = "packages/standard-capture-adapter/src/capture.ts";
          let capture = readFileSync(capturePath, "utf8");
          capture = capture.replace("  RawCaptureTarget,\n", "");
          capture = replaceRequired(
            capture,
            `\n  function exclusionsFor(bounds: LocalRect | undefined): RawCaptureTarget extends infer _T ? RawCaptureTarget : never {\n    return captureTarget;\n  }\n`,
            "",
            "remove dead exclusionsFor helper",
          );
          capture = replaceRequired(
            capture,
            `    const source = {\n      tagName,\n      namespace: element.namespaceURI ?? undefined,\n      role: element.getAttribute("role") ?? undefined,\n      sourceSelector: sourceSelector(element),\n      ...(masked ? {} : { attributes: sanitizeAttributes(element) }),\n    };`,
            `    const namespace = element.namespaceURI;\n    const role = element.getAttribute("role");\n    const source = {\n      tagName,\n      ...(namespace === null ? {} : { namespace }),\n      ...(role === null ? {} : { role }),\n      sourceSelector: sourceSelector(element),\n      ...(masked ? {} : { attributes: sanitizeAttributes(element) }),\n    };`,
            "exact optional source metadata",
          );
          capture = replaceRequired(
            capture,
            `    const raw: RawNode = {\n      captureNodeId,\n      kind,\n      relationships: {`,
            `    const visibility = visibilityFor(element);\n    const raw: RawNode = {\n      captureNodeId,\n      kind,\n      relationships: {`,
            "capture visibility before RawNode",
          );
          capture = replaceRequired(
            capture,
            `      ...(bounds === undefined\n        ? {}\n        : { geometry: { bounds, clientRects: clientRects(element, offsetX, offsetY) } }),\n      visibility: visibilityFor(element),\n    };`,
            `      ...(bounds === undefined\n        ? {}\n        : { geometry: { bounds, clientRects: clientRects(element, offsetX, offsetY) } }),\n      ...(visibility === undefined ? {} : { visibility }),\n    };`,
            "exact optional visibility",
          );
          capture = replaceRequired(
            capture,
            `  const usedFrameIds = new Set(finalNodes.map((node) => node.frameContext.frameId));\n  let frameClosureChanged = true;`,
            `  const usedFrameIds = new Set(finalNodes.map((node) => node.frameContext.frameId));\n  for (const diagnostic of diagnostics) {\n    if (\n      diagnostic.frameId &&\n      (diagnostic.sourceNodeId === undefined || finalNodeIds.has(diagnostic.sourceNodeId))\n    ) {\n      usedFrameIds.add(diagnostic.frameId);\n    }\n  }\n  let frameClosureChanged = true;`,
            "retain inaccessible frame records referenced by diagnostics",
          );
          capture = replaceRequired(
            capture,
            `  const finalFrames = frames\n    .filter((frame) => usedFrameIds.has(frame.context.frameId))\n    .map((frame) => ({\n      ...frame,\n      ...(frame.rootCaptureNodeId && finalNodeIds.has(frame.rootCaptureNodeId)\n        ? { rootCaptureNodeId: frame.rootCaptureNodeId }\n        : { rootCaptureNodeId: undefined }),\n    })) as RawFrameRecord[];`,
            `  const finalFrames: RawFrameRecord[] = frames\n    .filter((frame) => usedFrameIds.has(frame.context.frameId))\n    .map((frame) => {\n      if (!frame.rootCaptureNodeId || finalNodeIds.has(frame.rootCaptureNodeId)) return frame;\n      return {\n        context: frame.context,\n        accessible: frame.accessible,\n        ...(frame.inaccessibleReason === undefined\n          ? {}\n          : { inaccessibleReason: frame.inaccessibleReason }),\n      };\n    });`,
            "omit pruned frame roots without explicit undefined",
          );
          writeFileSync(capturePath, capture, "utf8");

          const foundationPath = "scripts/validate-foundation.mjs";
          let foundation = readFileSync(foundationPath, "utf8");
          if (!foundation.includes('import "./validate-node-08.mjs";')) {
            foundation = replaceRequired(
              foundation,
              `import { resolve } from "node:path";\n`,
              `import { resolve } from "node:path";\nimport "./validate-node-08.mjs";\n`,
              "NODE-08 foundation validator import",
            );
          }
          foundation = foundation.replace(
            'W2F_EXTENSION_SHELL_VERSION = "1.1.0"',
            'W2F_EXTENSION_SHELL_VERSION = "1.2.0"',
          );
          foundation = foundation.replace(
            "Browser shell protocol must remain at NODE-07 version 1.1.0",
            "Browser shell protocol must remain at NODE-08 version 1.2.0",
          );
          writeFileSync(foundationPath, foundation, "utf8");
          NODE

      - name: Apply canonical formatting
        run: pnpm exec prettier --write .

      - name: Validate complete repository
        run: pnpm check

      - name: Commit authoritative NODE-08 bootstrap outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "build(node-08): finalize Standard capture bootstrap"
          git push origin HEAD:feat/node-08-standard-dom-capture
