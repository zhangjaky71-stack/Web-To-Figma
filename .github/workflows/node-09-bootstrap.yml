name: NODE-09 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: node-09-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-09-cdp-high-fidelity-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-09-cdp-high-fidelity-adapter

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update authoritative workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-09 foundation patches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`NODE-09 patch target missing: ${label}`);
            return source.replace(before, after);
          }

          const normalizePath = "packages/cdp-capture-adapter/src/normalize.ts";
          let normalize = readFileSync(normalizePath, "utf8");
          normalize = replaceRequired(
            normalize,
            "  const scrollContainers = [];",
            '  const scrollContainers: RawSnapshot["scrollContainers"] = [];',
            "typed CDP scroll containers",
          );
          writeFileSync(normalizePath, normalize, "utf8");

          const foundationPath = "scripts/validate-foundation.mjs";
          let foundation = readFileSync(foundationPath, "utf8");
          if (!foundation.includes('import "./validate-node-09.mjs";')) {
            foundation = replaceRequired(
              foundation,
              'import "./validate-node-08.mjs";\n',
              'import "./validate-node-08.mjs";\nimport "./validate-node-09.mjs";\n',
              "NODE-09 foundation import",
            );
          }
          writeFileSync(foundationPath, foundation, "utf8");

          const node08Path = "scripts/validate-node-08.mjs";
          let node08 = readFileSync(node08Path, "utf8");
          node08 = replaceRequired(
            node08,
            `  assert(\n    protocol.includes('W2F_EXTENSION_SHELL_VERSION = "1.2.0"'),\n    "Browser protocol must advance to NODE-08 version 1.2.0",\n  );\n`,
            "",
            "remove obsolete NODE-08 protocol version pin",
          );
          node08 = node08.replace(
            '    "standard-capture-failed",\n',
            '    "capturePreferredDom",\n',
          );
          writeFileSync(node08Path, node08, "utf8");
          NODE

      - name: Apply canonical formatting
        run: pnpm exec prettier --write .

      - name: Validate complete repository
        run: pnpm check

      - name: Commit authoritative NODE-09 bootstrap outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "build(node-09): finalize CDP adapter bootstrap"
          git push origin HEAD:feat/node-09-cdp-high-fidelity-adapter
