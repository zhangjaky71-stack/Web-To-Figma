name: NODE-10 Bootstrap Recovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: node-10-bootstrap-recovery
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-10-text-inline-pseudo-capture' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-10-text-inline-pseudo-capture

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Extract and run NODE-10 patch
        shell: bash
        run: |
          node --input-type=module <<'RECOVER'
          import { readFileSync, writeFileSync } from "node:fs";

          const workflow = readFileSync(".github/workflows/node-10-bootstrap.yml", "utf8");
          const startMarker = "          node --input-type=module <<'NODE'\n";
          const endMarker = "\n          NODE\n";
          const start = workflow.indexOf(startMarker);
          const end = workflow.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) throw new Error("NODE-10 bootstrap patch payload markers not found");

          const payload = workflow
            .slice(start + startMarker.length, end)
            .split("\n")
            .map((line) => (line.startsWith("          ") ? line.slice(10) : line));

          const templates = [
            { name: "standardHelpers", marker: "const standardHelpers = `", closes: (trimmed) => trimmed === "`;" },
            { name: "newTextBlock", marker: "const newTextBlock = `", closes: (trimmed) => trimmed.endsWith("}`;") },
            { name: "cdpHelpers", marker: "const cdpHelpers = `", closes: (trimmed) => trimmed === "`;" },
            { name: "newCdpLoop", marker: "const newCdpLoop = `", closes: (trimmed) => trimmed.endsWith("});`;") },
          ];

          const fixed = [];
          let activeTemplate = null;
          for (let index = 0; index < payload.length; index += 1) {
            let line = payload[index];
            if (!activeTemplate) {
              const candidate = templates.find((template) => line.includes(template.marker));
              if (candidate) {
                line = line.replace(candidate.marker, candidate.marker.replace("= `", "= String.raw`"));
                fixed.push(line);
                activeTemplate = candidate;
                continue;
              }
            }

            if (activeTemplate && activeTemplate.closes(line.trim())) {
              fixed.push(line);
              activeTemplate = null;
              continue;
            }

            if (activeTemplate) {
              if (line.includes(".replace(") && line.includes("A") && line.includes("gi")) {
                const indent = line.slice(0, Math.max(0, line.indexOf(".replace")));
                fixed.push(`${indent}.replace(/\\\\A\\s?/gi, "\\n");`);
                if (payload[index + 1]?.trim() === '");') index += 1;
                continue;
              }
              line = line.replaceAll("`", "\\`").replaceAll("${", "\\${");
            }
            fixed.push(line);
          }

          if (activeTemplate) throw new Error(`NODE-10 generated template recovery did not close: ${activeTemplate.name}`);
          writeFileSync("/tmp/node-10-bootstrap.mjs", fixed.join("\n") + "\n", "utf8");
          RECOVER
          node /tmp/node-10-bootstrap.mjs

      - name: Apply canonical formatting
        run: pnpm exec prettier --write packages/capture-core packages/standard-capture-adapter packages/cdp-capture-adapter scripts

      - name: Hide temporary workflows from final-shape validation
        run: rm -f .github/workflows/node-10-bootstrap.yml .github/workflows/node-10-bootstrap-recovery.yml

      - name: Validate complete repository
        run: pnpm check

      - name: Commit validated NODE-10 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/capture-core packages/standard-capture-adapter packages/cdp-capture-adapter scripts/validate-foundation.mjs scripts/validate-node-10.mjs
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "feat(node-10): implement text inline pseudo capture paths"
          git push origin HEAD:feat/node-10-text-inline-pseudo-capture
