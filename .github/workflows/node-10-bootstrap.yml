name: NODE-10 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: node-10-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-10-text-inline-pseudo-capture' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-10-text-inline-pseudo-capture

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Apply NODE-10 capture patches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceRequired(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`NODE-10 patch target missing: ${label}`);
            return source.replace(before, after);
          }

          function replaceBetween(source, startMarker, endMarker, replacement, label) {
            const start = source.indexOf(startMarker);
            if (start < 0) throw new Error(`NODE-10 start marker missing: ${label}`);
            const endStart = source.indexOf(endMarker, start);
            if (endStart < 0) throw new Error(`NODE-10 end marker missing: ${label}`);
            return source.slice(0, start) + replacement + source.slice(endStart + endMarker.length);
          }

          const standardPath = "packages/standard-capture-adapter/src/capture.ts";
          let standard = readFileSync(standardPath, "utf8");

          const standardHelpers = `  function cssPixels(value: string): number | undefined {
            if (!value || value === "normal") return undefined;
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed) ? parsed : undefined;
          }

          function textStyleForNode(node: Node): CSSStyleDeclaration | undefined {
            const parent =
              node.parentElement ??
              (node.parentNode instanceof ShadowRoot ? node.parentNode.host : node.ownerDocument?.documentElement);
            const view = node.ownerDocument?.defaultView;
            return parent && view ? view.getComputedStyle(parent) : undefined;
          }

          function rawTextRun(text: string, style: CSSStyleDeclaration): NonNullable<RawNode["text"]>["runs"][number] {
            const fontSize = cssPixels(style.fontSize) ?? 0;
            const lineHeight = cssPixels(style.lineHeight);
            const letterSpacing = cssPixels(style.letterSpacing);
            return {
              start: 0,
              end: text.length,
              text,
              font: {
                family: style.fontFamily,
                ...(style.fontStyle ? { style: style.fontStyle } : {}),
                ...(style.fontWeight ? { weight: style.fontWeight } : {}),
                ...(style.fontStretch ? { stretch: style.fontStretch } : {}),
                ...(style.fontVariationSettings ? { variationSettings: style.fontVariationSettings } : {}),
                ...(style.fontFeatureSettings ? { featureSettings: style.fontFeatureSettings } : {}),
              },
              fontSize,
              ...(lineHeight === undefined ? { lineHeight: style.lineHeight || "normal" } : { lineHeight }),
              ...(letterSpacing === undefined ? {} : { letterSpacing }),
              ...(style.color ? { color: style.color } : {}),
              ...(style.textDecorationLine ? { decoration: style.textDecorationLine } : {}),
              direction: style.direction === "rtl" ? "rtl" : "ltr",
            };
          }

          function baselineForRect(
            rect: LocalRect,
            style: CSSStyleDeclaration,
            doc: Document,
          ): Pick<NonNullable<RawNode["text"]>["fragments"][number], "baseline" | "baselineSource" | "baselineConfidence"> {
            const canvas = doc.createElement("canvas");
            const context = canvas.getContext("2d");
            if (context) {
              context.font =
                style.font ||
                `${style.fontStyle || "normal"} ${style.fontWeight || "400"} ${style.fontSize || "16px"} ${style.fontFamily || "sans-serif"}`;
              const metrics = context.measureText("Hg");
              const ascent = metrics.actualBoundingBoxAscent;
              const descent = metrics.actualBoundingBoxDescent;
              if (Number.isFinite(ascent) && Number.isFinite(descent) && ascent + descent > 0) {
                return {
                  baseline: rect.y + Math.max(0, (rect.height - (ascent + descent)) / 2) + ascent,
                  baselineSource: "font-metrics",
                  baselineConfidence: 0.9,
                };
              }
            }
            return {
              baseline: rect.y + rect.height * 0.8,
              baselineSource: "line-box-estimate",
              baselineConfidence: 0.55,
            };
          }

          function textFragments(
            node: Text,
            style: CSSStyleDeclaration,
            offsetX: number,
            offsetY: number,
          ): NonNullable<RawNode["text"]>["fragments"] {
            const text = node.textContent ?? "";
            const doc = node.ownerDocument;
            const range = doc.createRange();
            const samples: Array<{ start: number; end: number; bounds: LocalRect }> = [];
            const measurementEnd = Math.min(text.length, 4096);
            for (let start = 0; start < measurementEnd; ) {
              const codePoint = text.codePointAt(start);
              const end = start + (codePoint !== undefined && codePoint > 0xffff ? 2 : 1);
              range.setStart(node, start);
              range.setEnd(node, Math.min(end, measurementEnd));
              for (const rect of [...range.getClientRects()]) {
                if (rect.width === 0 && rect.height === 0) continue;
                samples.push({
                  start,
                  end: Math.min(end, measurementEnd),
                  bounds: toDocumentRect(rect, offsetX, offsetY),
                });
              }
              start = end;
            }

            const vertical = style.writingMode.startsWith("vertical") || style.writingMode.startsWith("sideways");
            const lines: Array<{ start: number; end: number; bounds: LocalRect }> = [];
            for (const sample of samples) {
              const last = lines.at(-1);
              const sameLine =
                last !== undefined &&
                (vertical
                  ? Math.abs(sample.bounds.x - last.bounds.x) <= Math.max(1, Math.min(sample.bounds.width, last.bounds.width) * 0.5)
                  : Math.abs(sample.bounds.y - last.bounds.y) <= Math.max(1, Math.min(sample.bounds.height, last.bounds.height) * 0.5));
              if (!last || !sameLine) {
                lines.push({ ...sample });
                continue;
              }
              const left = Math.min(last.bounds.x, sample.bounds.x);
              const top = Math.min(last.bounds.y, sample.bounds.y);
              const right = Math.max(last.bounds.x + last.bounds.width, sample.bounds.x + sample.bounds.width);
              const bottom = Math.max(last.bounds.y + last.bounds.height, sample.bounds.y + sample.bounds.height);
              last.start = Math.min(last.start, sample.start);
              last.end = Math.max(last.end, sample.end);
              last.bounds = { x: left, y: top, width: right - left, height: bottom - top };
            }

            return lines.map((line, lineIndex) => ({
              start: line.start,
              end: line.end,
              bounds: line.bounds,
              ...baselineForRect(line.bounds, style, doc),
              lineIndex,
            }));
          }

          function textEvidence(
            node: Text,
            offsetX: number,
            offsetY: number,
          ): RawNode["text"] {
            const value = node.textContent ?? "";
            const style = textStyleForNode(node);
            if (!style) return undefined;
            return {
              value,
              runs: [rawTextRun(value, style)],
              fragments: textFragments(node, style, offsetX, offsetY),
              whiteSpace: style.whiteSpace,
              wordBreak: style.wordBreak,
              overflowWrap: style.overflowWrap,
              textAlign: style.textAlign,
              direction: style.direction === "rtl" ? "rtl" : "ltr",
              writingMode: style.writingMode,
            };
          }

          function inlineEvidence(element: Element, rects: LocalRect[]): RawNode["inline"] {
            const view = element.ownerDocument.defaultView;
            if (!view) return undefined;
            const style = view.getComputedStyle(element);
            if (!(style.display.startsWith("inline") || style.display.startsWith("ruby"))) return undefined;
            return {
              display: style.display,
              writingMode: style.writingMode,
              ...(style.verticalAlign ? { verticalAlign: style.verticalAlign } : {}),
              fragmentBounds: rects,
            };
          }

          function formVisualEvidence(element: Element): RawNode["formVisual"] {
            const tagName = element.tagName.toUpperCase();
            if (!["INPUT", "TEXTAREA", "SELECT", "BUTTON", "PROGRESS", "METER", "OUTPUT"].includes(tagName)) {
              return undefined;
            }
            const view = element.ownerDocument.defaultView;
            const style = view?.getComputedStyle(element);
            const common = {
              disabled: "disabled" in element ? Boolean((element as HTMLInputElement).disabled) : false,
              ...(style?.appearance ? { appearance: style.appearance } : {}),
              ...(style?.accentColor ? { accentColor: style.accentColor } : {}),
            };
            if (tagName === "INPUT") {
              const input = element as HTMLInputElement;
              const type = (input.getAttribute("type") || "text").toLowerCase();
              const checkable = type === "checkbox" || type === "radio";
              const textual = !["button", "submit", "reset", "checkbox", "radio", "range", "color", "file", "image", "hidden"].includes(type);
              return {
                controlKind: "input",
                inputType: type,
                ...common,
                readOnly: input.readOnly,
                required: input.required,
                ...(checkable ? { checked: input.checked, indeterminate: input.indeterminate } : {}),
                ...(input.placeholder ? { placeholder: input.placeholder } : {}),
                textValueCapture: textual ? "omitted-sensitive" : "not-applicable",
              };
            }
            if (tagName === "TEXTAREA") {
              const textarea = element as HTMLTextAreaElement;
              return {
                controlKind: "textarea",
                ...common,
                readOnly: textarea.readOnly,
                required: textarea.required,
                ...(textarea.placeholder ? { placeholder: textarea.placeholder } : {}),
                textValueCapture: "omitted-sensitive",
              };
            }
            if (tagName === "SELECT") {
              const select = element as HTMLSelectElement;
              return {
                controlKind: "select",
                ...common,
                required: select.required,
                multiple: select.multiple,
                textValueCapture: "omitted-sensitive",
              };
            }
            return {
              controlKind: tagName.toLowerCase() as "button" | "progress" | "meter" | "output",
              ...common,
              textValueCapture: "not-applicable",
            };
          }

          function pseudoContent(content: string): RawNode["pseudo"] {
            if (!content || content === "none" || content === "normal") {
              return { type: "before", content, contentKind: "none" };
            }
            const first = content[0];
            const last = content.at(-1);
            if ((first === '"' || first === "'") && last === first) {
              const generatedText = content
                .slice(1, -1)
                .replace(/\\([\\"'])/g, "$1")
                .replace(/\\A\s?/gi, "\n");
              return { type: "before", content, contentKind: "text", generatedText };
            }
            return { type: "before", content, contentKind: "complex" };
          }

          function capturePseudo(
            element: Element,
            host: RawNode,
            hostId: string,
            pseudoType: "before" | "after" | "marker",
            context: LocalFrameContext,
          ): void {
            if (nodes.length >= maxNodes) {
              reportBudget(context.frameId);
              return;
            }
            const view = element.ownerDocument.defaultView;
            if (!view) return;
            let style: CSSStyleDeclaration;
            try {
              style = view.getComputedStyle(element, `::${pseudoType}`);
            } catch {
              return;
            }
            const hostDisplay = view.getComputedStyle(element).display;
            const parsed = pseudoContent(style.content || "");
            parsed.type = pseudoType;
            if (pseudoType !== "marker" && parsed.contentKind === "none") return;
            if (pseudoType === "marker" && hostDisplay !== "list-item" && parsed.contentKind === "none") return;

            const captureNodeId = createId(context.frameId);
            const generatedText = parsed.generatedText;
            const raw: RawNode = {
              captureNodeId,
              kind: "pseudo",
              relationships: { sourceParentId: hostId, composedParentId: hostId },
              childCaptureNodeIds: [],
              frameContext: context,
              source: {
                pseudoType,
                ...(host.source.sourceSelector ? { sourceSelector: `${host.source.sourceSelector}::${pseudoType}` } : {}),
              },
              visibility: {
                display: style.display || "inline",
                visibility: style.visibility || "visible",
                contentVisibility: style.contentVisibility || "visible",
                opacity: Number.parseFloat(style.opacity || "1"),
                hiddenAttribute: false,
                rendered: style.display !== "none" && style.visibility !== "hidden" && style.visibility !== "collapse",
              },
              pseudo: parsed,
              ...(generatedText === undefined
                ? {}
                : {
                    textContent: generatedText,
                    text: {
                      value: generatedText,
                      runs: [rawTextRun(generatedText, style)],
                      fragments: [],
                      whiteSpace: style.whiteSpace,
                      wordBreak: style.wordBreak,
                      overflowWrap: style.overflowWrap,
                      textAlign: style.textAlign,
                      direction: style.direction === "rtl" ? "rtl" : "ltr",
                      writingMode: style.writingMode,
                    },
                  }),
            };
            nodes.push(raw);
            host.childCaptureNodeIds.push(captureNodeId);
          }

`;

          standard = replaceRequired(
            standard,
            "  function boundsForNode(node: Node, offsetX: number, offsetY: number): LocalRect | undefined {",
            standardHelpers + "  function boundsForNode(node: Node, offsetX: number, offsetY: number): LocalRect | undefined {",
            "Standard NODE-10 helper insertion",
          );
          standard = replaceRequired(
            standard,
            `  function isMasked(bounds: LocalRect | undefined): boolean {\n    if (!bounds || captureTarget.type !== "region") return false;\n    return captureTarget.exclusions.some((item) => intersects(item.bounds, bounds));\n  }`,
            `  function isMasked(bounds: LocalRect | undefined): boolean {\n    if (!bounds || captureTarget.type !== "region") return false;\n    return captureTarget.exclusions.some(\n      (item) => item.kind === "redact" && intersects(item.bounds, bounds),\n    );\n  }`,
            "Standard redact-only masking",
          );

          const oldTextStart = "    if (node.nodeType === 3) {";
          const oldTextEnd = "      return captureNodeId;\n    }";
          const newTextBlock = `    if (node.nodeType === 3) {
              if (!node.textContent) return undefined;
              const textNode = node as Text;
              const bounds = boundsForNode(textNode, offsetX, offsetY);
              if (isFullyExcluded(bounds)) return undefined;
              const captureNodeId = createId(context.frameId);
              const masked = isMasked(bounds);
              const rects = clientRects(textNode, offsetX, offsetY);
              const text = masked ? undefined : textEvidence(textNode, offsetX, offsetY);
              const raw: RawNode = {
                captureNodeId,
                kind: "text",
                relationships: {
                  sourceParentId,
                  composedParentId,
                  ...(shadowHostId === undefined ? {} : { shadowHostId }),
                },
                childCaptureNodeIds: [],
                frameContext: context,
                source: {},
                ...(bounds === undefined ? {} : { geometry: { bounds, clientRects: rects } }),
                ...(masked ? {} : { textContent: textNode.textContent }),
                ...(text === undefined ? {} : { text }),
              };
              nodes.push(raw);
              nodeIds.set(node, captureNodeId);
              if (!masked && textNode.textContent.length > 4096) {
                diagnostics.push({
                  code: "STANDARD_TEXT_FRAGMENT_LIMIT",
                  message: "Text fragment character measurement is capped at 4096 UTF-16 code units per text node; the full text run is still preserved.",
                  frameId: context.frameId,
                  sourceNodeId: captureNodeId,
                });
              }
              return captureNodeId;
            }`;
          standard = replaceBetween(
            standard,
            oldTextStart,
            oldTextEnd,
            newTextBlock,
            "Standard text node evidence",
          );

          standard = replaceRequired(
            standard,
            `    const visibility = visibilityFor(element);\n    const raw: RawNode = {`,
            `    const visibility = visibilityFor(element);\n    const elementRects = clientRects(element, offsetX, offsetY);\n    const inline = masked ? undefined : inlineEvidence(element, elementRects);\n    const formVisual = masked ? undefined : formVisualEvidence(element);\n    const raw: RawNode = {`,
            "Standard inline/form evidence setup",
          );
          standard = replaceRequired(
            standard,
            `      ...(bounds === undefined\n        ? {}\n        : { geometry: { bounds, clientRects: clientRects(element, offsetX, offsetY) } }),\n      ...(visibility === undefined ? {} : { visibility }),\n    };`,
            `      ...(bounds === undefined ? {} : { geometry: { bounds, clientRects: elementRects } }),\n      ...(visibility === undefined ? {} : { visibility }),\n      ...(inline === undefined ? {} : { inline }),\n      ...(formVisual === undefined ? {} : { formVisual }),\n    };`,
            "Standard inline/form evidence fields",
          );
          standard = replaceRequired(
            standard,
            `    nodes.push(raw);\n    nodeIds.set(node, captureNodeId);\n\n    const currentScrollContainerId = registerScrollContainer(`,
            `    nodes.push(raw);\n    nodeIds.set(node, captureNodeId);\n\n    if (!masked) {\n      capturePseudo(element, raw, captureNodeId, "marker", context);\n      capturePseudo(element, raw, captureNodeId, "before", context);\n    }\n\n    const currentScrollContainerId = registerScrollContainer(`,
            "Standard marker/before capture",
          );
          standard = replaceRequired(
            standard,
            `    if (tagName === "IFRAME" && !masked) {\n      captureIframeDocument(element as HTMLIFrameElement, captureNodeId, context, bounds);\n    }\n\n    return captureNodeId;`,
            `    if (tagName === "IFRAME" && !masked) {\n      captureIframeDocument(element as HTMLIFrameElement, captureNodeId, context, bounds);\n    }\n\n    if (!masked) capturePseudo(element, raw, captureNodeId, "after", context);\n\n    return captureNodeId;`,
            "Standard after capture",
          );
          standard = replaceRequired(
            standard,
            `    let changed = true;\n    while (changed) {`,
            `    for (const node of nodes) {\n      if (node.kind !== "pseudo") continue;\n      const parentId = node.relationships.sourceParentId;\n      if (parentId && keep.has(parentId)) keep.add(node.captureNodeId);\n    }\n\n    let changed = true;\n    while (changed) {`,
            "Standard region pseudo retention",
          );
          writeFileSync(standardPath, standard, "utf8");

          const cdpPath = "packages/cdp-capture-adapter/src/normalize.ts";
          let cdp = readFileSync(cdpPath, "utf8");
          cdp = replaceRequired(
            cdp,
            "  CdpRareIntegerData,\n  CdpRareStringData,",
            "  CdpRareBooleanData,\n  CdpRareIntegerData,\n  CdpRareStringData,",
            "CDP rare boolean import",
          );
          cdp = replaceRequired(
            cdp,
            `export const CDP_COMPUTED_STYLE_PROPERTIES = [\n  "display",\n  "visibility",\n  "content-visibility",\n  "opacity",\n  "overflow-x",\n  "overflow-y",\n  "position",\n] as const;`,
            `export const CDP_COMPUTED_STYLE_PROPERTIES = [\n  "display",\n  "visibility",\n  "content-visibility",\n  "opacity",\n  "overflow-x",\n  "overflow-y",\n  "position",\n  "font-family",\n  "font-size",\n  "font-style",\n  "font-weight",\n  "font-stretch",\n  "font-variation-settings",\n  "font-feature-settings",\n  "line-height",\n  "letter-spacing",\n  "color",\n  "text-decoration-line",\n  "white-space",\n  "word-break",\n  "overflow-wrap",\n  "text-align",\n  "direction",\n  "writing-mode",\n  "vertical-align",\n  "content",\n  "appearance",\n  "accent-color",\n] as const;`,
            "CDP NODE-10 computed styles",
          );
          cdp = replaceRequired(
            cdp,
            `function rareString(\n  data: CdpRareStringData | undefined,\n  nodeIndex: number,\n  strings: readonly string[],\n): string | undefined {\n  if (!data) return undefined;\n  const position = data.index.indexOf(nodeIndex);\n  if (position < 0) return undefined;\n  const value = stringAt(strings, data.value[position]);\n  return value || undefined;\n}\n`,
            `function rareString(\n  data: CdpRareStringData | undefined,\n  nodeIndex: number,\n  strings: readonly string[],\n): string | undefined {\n  if (!data) return undefined;\n  const position = data.index.indexOf(nodeIndex);\n  if (position < 0) return undefined;\n  const value = stringAt(strings, data.value[position]);\n  return value || undefined;\n}\n\nfunction rareBoolean(data: CdpRareBooleanData | undefined, nodeIndex: number): boolean | undefined {\n  return data ? data.index.includes(nodeIndex) : undefined;\n}\n`,
            "CDP rare boolean helper",
          );
          cdp = replaceRequired(
            cdp,
            `function nodeKind(\n  nodeType: number | undefined,\n  nodeName: string,\n  shadowRootType: string | undefined,\n): RawNode["kind"] | undefined {\n  if (nodeType === 9) return "document";`,
            `function nodeKind(\n  nodeType: number | undefined,\n  nodeName: string,\n  shadowRootType: string | undefined,\n  pseudoType: string | undefined,\n): RawNode["kind"] | undefined {\n  if (pseudoType) return "pseudo";\n  if (nodeType === 9) return "document";`,
            "CDP pseudo node kind",
          );

          const cdpHelpers = `function cssPixels(value: string): number | undefined {
            if (!value || value === "normal") return undefined;
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed) ? parsed : undefined;
          }

          function layoutIndicesLookup(layout: CdpLayoutTreeSnapshot): Map<number, number[]> {
            const result = new Map<number, number[]>();
            layout.nodeIndex.forEach((nodeIndex, layoutIndex) => {
              const entries = result.get(nodeIndex) ?? [];
              entries.push(layoutIndex);
              result.set(nodeIndex, entries);
            });
            return result;
          }

          function unionRects(rects: Rect[]): Rect | undefined {
            if (rects.length === 0) return undefined;
            const left = Math.min(...rects.map((rect) => rect.x));
            const top = Math.min(...rects.map((rect) => rect.y));
            const right = Math.max(...rects.map((rect) => rect.x + rect.width));
            const bottom = Math.max(...rects.map((rect) => rect.y + rect.height));
            return { x: left, y: top, width: right - left, height: bottom - top };
          }

          function rawTextRun(
            value: string,
            computed: Record<(typeof CDP_COMPUTED_STYLE_PROPERTIES)[number], string>,
          ): NonNullable<RawNode["text"]>["runs"][number] {
            const fontSize = cssPixels(computed["font-size"]) ?? 0;
            const lineHeight = cssPixels(computed["line-height"]);
            const letterSpacing = cssPixels(computed["letter-spacing"]);
            return {
              start: 0,
              end: value.length,
              text: value,
              font: {
                family: computed["font-family"],
                ...(computed["font-style"] ? { style: computed["font-style"] } : {}),
                ...(computed["font-weight"] ? { weight: computed["font-weight"] } : {}),
                ...(computed["font-stretch"] ? { stretch: computed["font-stretch"] } : {}),
                ...(computed["font-variation-settings"]
                  ? { variationSettings: computed["font-variation-settings"] }
                  : {}),
                ...(computed["font-feature-settings"]
                  ? { featureSettings: computed["font-feature-settings"] }
                  : {}),
              },
              fontSize,
              ...(lineHeight === undefined
                ? { lineHeight: computed["line-height"] || "normal" }
                : { lineHeight }),
              ...(letterSpacing === undefined ? {} : { letterSpacing }),
              ...(computed.color ? { color: computed.color } : {}),
              ...(computed["text-decoration-line"]
                ? { decoration: computed["text-decoration-line"] }
                : {}),
              direction: computed.direction === "rtl" ? "rtl" : "ltr",
            };
          }

          function cdpBaseline(
            bounds: Rect,
            computed: Record<(typeof CDP_COMPUTED_STYLE_PROPERTIES)[number], string>,
          ): Pick<NonNullable<RawNode["text"]>["fragments"][number], "baseline" | "baselineSource" | "baselineConfidence"> {
            const fontSize = cssPixels(computed["font-size"]) ?? bounds.height;
            const lineHeight = cssPixels(computed["line-height"]) ?? bounds.height;
            const leading = Math.max(0, Math.min(bounds.height, lineHeight) - fontSize);
            return {
              baseline: bounds.y + leading / 2 + fontSize * 0.8,
              baselineSource: "cdp-layout-estimate",
              baselineConfidence: 0.7,
            };
          }

          function cdpTextEvidence(
            value: string,
            computed: Record<(typeof CDP_COMPUTED_STYLE_PROPERTIES)[number], string>,
            layout: CdpLayoutTreeSnapshot,
            layoutIndices: number[],
            strings: readonly string[],
          ): RawNode["text"] {
            if (!value) return undefined;
            let cursor = 0;
            const fragments = layoutIndices.flatMap((layoutIndex, lineIndex) => {
              const bounds =
                rectangle(layout.clientRects?.[layoutIndex]) ?? rectangle(layout.bounds[layoutIndex]);
              if (!bounds) return [];
              const renderedText = stringAt(strings, layout.text[layoutIndex]);
              const found = renderedText ? value.indexOf(renderedText, cursor) : -1;
              const start = found >= 0 ? found : Math.min(cursor, value.length);
              const end = renderedText
                ? Math.min(value.length, start + renderedText.length)
                : value.length;
              cursor = Math.max(cursor, end);
              return [
                {
                  start,
                  end,
                  bounds,
                  ...cdpBaseline(bounds, computed),
                  lineIndex,
                },
              ];
            });
            return {
              value,
              runs: [rawTextRun(value, computed)],
              fragments,
              whiteSpace: computed["white-space"],
              wordBreak: computed["word-break"],
              overflowWrap: computed["overflow-wrap"],
              textAlign: computed["text-align"],
              direction: computed.direction === "rtl" ? "rtl" : "ltr",
              writingMode: computed["writing-mode"],
            };
          }

          function inlineEvidence(
            computed: Record<(typeof CDP_COMPUTED_STYLE_PROPERTIES)[number], string>,
            fragmentBounds: Rect[],
          ): RawNode["inline"] {
            const display = computed.display;
            if (!(display.startsWith("inline") || display.startsWith("ruby"))) return undefined;
            return {
              display,
              writingMode: computed["writing-mode"],
              ...(computed["vertical-align"]
                ? { verticalAlign: computed["vertical-align"] }
                : {}),
              fragmentBounds,
            };
          }

          function pseudoEvidence(
            pseudoType: string,
            content: string,
            renderedText: string,
          ): RawNode["pseudo"] {
            if (renderedText) {
              return { type: pseudoType, content, contentKind: "text", generatedText: renderedText };
            }
            if (!content || content === "none" || content === "normal") {
              return { type: pseudoType, content, contentKind: "none" };
            }
            return { type: pseudoType, content, contentKind: "complex" };
          }

          function formVisualEvidence(
            nodeName: string,
            attributes: Record<string, string>,
            computed: Record<(typeof CDP_COMPUTED_STYLE_PROPERTIES)[number], string>,
            checked: boolean | undefined,
          ): RawNode["formVisual"] {
            if (!["INPUT", "TEXTAREA", "SELECT", "BUTTON", "PROGRESS", "METER", "OUTPUT"].includes(nodeName)) {
              return undefined;
            }
            const disabled = Object.hasOwn(attributes, "disabled");
            const common = {
              disabled,
              ...(computed.appearance ? { appearance: computed.appearance } : {}),
              ...(computed["accent-color"] ? { accentColor: computed["accent-color"] } : {}),
            };
            if (nodeName === "INPUT") {
              const inputType = (attributes.type || "text").toLowerCase();
              const checkable = inputType === "checkbox" || inputType === "radio";
              const textual = !["button", "submit", "reset", "checkbox", "radio", "range", "color", "file", "image", "hidden"].includes(inputType);
              return {
                controlKind: "input",
                inputType,
                ...common,
                readOnly: Object.hasOwn(attributes, "readonly"),
                required: Object.hasOwn(attributes, "required"),
                ...(checkable && checked !== undefined ? { checked } : {}),
                ...(attributes.placeholder ? { placeholder: attributes.placeholder } : {}),
                textValueCapture: textual ? "omitted-sensitive" : "not-applicable",
              };
            }
            if (nodeName === "TEXTAREA") {
              return {
                controlKind: "textarea",
                ...common,
                readOnly: Object.hasOwn(attributes, "readonly"),
                required: Object.hasOwn(attributes, "required"),
                ...(attributes.placeholder ? { placeholder: attributes.placeholder } : {}),
                textValueCapture: "omitted-sensitive",
              };
            }
            if (nodeName === "SELECT") {
              return {
                controlKind: "select",
                ...common,
                required: Object.hasOwn(attributes, "required"),
                multiple: Object.hasOwn(attributes, "multiple"),
                textValueCapture: "omitted-sensitive",
              };
            }
            return {
              controlKind: nodeName.toLowerCase() as "button" | "progress" | "meter" | "output",
              ...common,
              textValueCapture: "not-applicable",
            };
          }

`;
          cdp = replaceRequired(
            cdp,
            "function makeNodeId(\n",
            cdpHelpers + "function makeNodeId(\n",
            "CDP NODE-10 helper insertion",
          );
          cdp = replaceRequired(
            cdp,
            `    const layoutMap = layoutLookup(document.layout);\n    const baseUrl = stringAt(strings, document.baseURL) || url;`,
            `    const layoutMap = layoutLookup(document.layout);\n    const layoutIndicesMap = layoutIndicesLookup(document.layout);\n    const baseUrl = stringAt(strings, document.baseURL) || url;`,
            "CDP layout fragment index",
          );

          const cdpLoopStart = "    document.nodes.nodeType.forEach((type, nodeIndex) => {";
          const cdpLoopEnd = "      nodes.push(raw);\n    });";
          const newCdpLoop = `    document.nodes.nodeType.forEach((type, nodeIndex) => {
              const nodeName = stringAt(strings, document.nodes.nodeName[nodeIndex]).toUpperCase();
              const shadowRootType = rareString(document.nodes.shadowRootType, nodeIndex, strings);
              const pseudoType = rareString(document.nodes.pseudoType, nodeIndex, strings);
              const kind = nodeKind(type, nodeName, shadowRootType, pseudoType);
              if (!kind) return;

              const captureNodeId = nodeIdsByDocument[documentIndex]![nodeIndex]!;
              const parentIndex = document.nodes.parentIndex[nodeIndex];
              const ownerForRoot = nodeIndex === rootIndex ? owner : undefined;
              const parentCaptureNodeId = ownerForRoot
                ? nodeIdsByDocument[ownerForRoot.documentIndex]?.[ownerForRoot.nodeIndex]
                : typeof parentIndex === "number" && parentIndex >= 0
                  ? nodeIdsByDocument[documentIndex]?.[parentIndex]
                  : undefined;

              const layoutIndex = layoutMap.get(nodeIndex);
              const layoutIndices = layoutIndicesMap.get(nodeIndex) ?? [];
              const layoutBounds = layoutIndices
                .map((index) => rectangle(document.layout.bounds[index]))
                .filter((value): value is Rect => value !== undefined);
              const bounds = unionRects(layoutBounds);
              if (
                input.captureTarget.type === "region" &&
                bounds &&
                input.captureTarget.exclusions.some(
                  (item) => item.kind === "exclude" && contains(item.bounds, bounds),
                )
              ) {
                return;
              }
              const masked =
                input.captureTarget.type === "region" &&
                bounds !== undefined &&
                input.captureTarget.exclusions.some(
                  (item) => item.kind === "redact" && intersects(item.bounds, bounds),
                );

              const computed = stylesFor(document.layout, layoutIndex, strings);
              const attributes = sanitizeAttributes(
                nodeName,
                document.nodes.attributes[nodeIndex],
                strings,
                baseUrl,
              );
              const hiddenAttribute = Object.hasOwn(attributes, "hidden");
              const rendered =
                layoutIndex !== undefined &&
                computed.display !== "none" &&
                computed.visibility !== "hidden" &&
                computed.visibility !== "collapse";
              const nodeValue = stringAt(strings, document.nodes.nodeValue[nodeIndex]);
              const clientRects = layoutIndices
                .map(
                  (index) =>
                    rectangle(document.layout.clientRects?.[index]) ??
                    rectangle(document.layout.bounds[index]),
                )
                .filter((value): value is Rect => value !== undefined);
              const paintOrder =
                layoutIndex === undefined ? undefined : document.layout.paintOrders?.[layoutIndex];
              const renderedText = layoutIndices
                .map((index) => stringAt(strings, document.layout.text[index]))
                .filter(Boolean)
                .join("");
              const pseudo =
                kind === "pseudo" && pseudoType
                  ? pseudoEvidence(pseudoType, computed.content, renderedText)
                  : undefined;
              const textValue =
                kind === "text" ? nodeValue : kind === "pseudo" ? pseudo?.generatedText : undefined;
              const text =
                !masked && textValue
                  ? cdpTextEvidence(textValue, computed, document.layout, layoutIndices, strings)
                  : undefined;
              const inline = masked ? undefined : inlineEvidence(computed, clientRects);
              const formVisual = masked
                ? undefined
                : formVisualEvidence(
                    nodeName,
                    attributes,
                    computed,
                    rareBoolean(document.nodes.inputChecked, nodeIndex),
                  );

              const raw: RawNode = {
                captureNodeId,
                kind,
                relationships: {
                  ...(parentCaptureNodeId
                    ? { sourceParentId: parentCaptureNodeId, composedParentId: parentCaptureNodeId }
                    : {}),
                },
                childCaptureNodeIds: [],
                frameContext: context,
                source: {
                  ...(nodeName && !nodeName.startsWith("#") ? { tagName: nodeName } : {}),
                  ...(pseudoType ? { pseudoType } : {}),
                  ...(masked ? {} : { attributes }),
                  ...(typeof document.nodes.backendNodeId[nodeIndex] === "number"
                    ? { backendNodeId: document.nodes.backendNodeId[nodeIndex] }
                    : {}),
                },
                ...(bounds
                  ? { geometry: { bounds, ...(clientRects.length > 0 ? { clientRects } : {}) } }
                  : {}),
                ...(layoutIndex === undefined
                  ? {}
                  : {
                      visibility: {
                        display: computed.display || "",
                        visibility: computed.visibility || "",
                        ...(computed["content-visibility"]
                          ? { contentVisibility: computed["content-visibility"] }
                          : {}),
                        opacity: Number.parseFloat(computed.opacity || "1"),
                        hiddenAttribute,
                        rendered,
                      },
                    }),
                ...(!masked && textValue ? { textContent: textValue } : {}),
                ...(text === undefined ? {} : { text }),
                ...(inline === undefined ? {} : { inline }),
                ...(pseudo === undefined ? {} : { pseudo }),
                ...(formVisual === undefined ? {} : { formVisual }),
                ...(typeof paintOrder === "number" ? { paintOrder } : {}),
              };
              nodes.push(raw);
            });`;
          cdp = replaceBetween(cdp, cdpLoopStart, cdpLoopEnd, newCdpLoop, "CDP NODE-10 node normalization");
          writeFileSync(cdpPath, cdp, "utf8");

          const foundationPath = "scripts/validate-foundation.mjs";
          let foundation = readFileSync(foundationPath, "utf8");
          if (!foundation.includes('import "./validate-node-10.mjs";')) {
            foundation = replaceRequired(
              foundation,
              'import "./validate-node-09.mjs";\n',
              'import "./validate-node-09.mjs";\nimport "./validate-node-10.mjs";\n',
              "NODE-10 foundation import",
            );
          }
          writeFileSync(foundationPath, foundation, "utf8");
          NODE

      - name: Apply canonical formatting
        run: pnpm exec prettier --write packages/capture-core packages/standard-capture-adapter packages/cdp-capture-adapter scripts apps/browser-extension docs/IMPLEMENTATION_STATUS.md

      - name: Validate complete repository
        run: pnpm check

      - name: Commit validated NODE-10 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/capture-core packages/standard-capture-adapter packages/cdp-capture-adapter scripts/validate-foundation.mjs
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "feat(node-10): implement text inline pseudo capture paths"
          git push origin HEAD:feat/node-10-text-inline-pseudo-capture
