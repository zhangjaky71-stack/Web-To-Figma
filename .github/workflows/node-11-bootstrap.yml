name: NODE-11 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: node-11-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-11-css-cascade-authored-semantics' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-11-css-cascade-authored-semantics

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wire NODE-11 foundation validator
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/validate-foundation.mjs";
          let source = readFileSync(path, "utf8");
          const marker = 'import "./validate-node-10.mjs";';
          const addition = 'import "./validate-node-11.mjs";';
          if (!source.includes(addition)) {
            if (!source.includes(marker)) throw new Error("NODE-10 foundation import marker missing");
            source = source.replace(marker, `${marker}\n${addition}`);
            writeFileSync(path, source, "utf8");
          }
          NODE

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          packages/css-cascade
          scripts/validate-node-11.mjs
          scripts/validate-foundation.mjs
          docs/IMPLEMENTATION_STATUS.md
          docs/README.md
          docs/nodes/NODE-10_TEXT_INLINE_PSEUDO_CAPTURE.md

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/node-11-bootstrap.yml

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-11 foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "chore(node-11): bootstrap css cascade workspace"
          git push origin HEAD:feat/node-11-css-cascade-authored-semantics
