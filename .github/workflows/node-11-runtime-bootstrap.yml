name: NODE-11 Runtime Bootstrap

on:
  push:
    branches: [feat/node-11-css-cascade-authored-semantics]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-11-runtime-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-11-css-cascade-authored-semantics

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          packages/css-cascade
          packages/standard-capture-adapter/package.json
          packages/standard-capture-adapter/src/types.ts
          packages/standard-capture-adapter/src/index.ts
          packages/standard-capture-adapter/src/cascade-capture.ts
          apps/browser-extension/package.json
          apps/browser-extension/src/runtime/css-cascade-runtime.ts
          apps/browser-extension/src/runtime/css-cascade-store.ts
          apps/browser-extension/src/runtime/job-state.ts
          apps/browser-extension/src/runtime/service-worker.ts
          apps/browser-extension/test/css-cascade-runtime.test.ts
          apps/browser-extension/scripts/package-extension.mjs
          apps/browser-extension/scripts/validate-extension-package.mjs
          scripts/validate-node-11.mjs

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/node-11-runtime-bootstrap.yml

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-11 runtime
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(node-11): validate authored cascade integration"
          git push origin HEAD:feat/node-11-css-cascade-authored-semantics
