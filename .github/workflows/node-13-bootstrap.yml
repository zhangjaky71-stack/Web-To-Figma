name: NODE-13 Asset Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-13-asset-resolver'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-13-asset-resolver

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Wire NODE-13 guardrail
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/validate-foundation.mjs";
          let source = readFileSync(path, "utf8");
          const anchor = 'import "./validate-node-12.mjs";';
          const addition = 'import "./validate-node-13.mjs";';
          if (!source.includes(addition)) source = source.replace(anchor, `${anchor}\n${addition}`);
          if (!source.includes(addition)) throw new Error("NODE-13 guardrail anchor missing");
          writeFileSync(path, source);
          EOF

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/asset-resolver \
            packages/standard-capture-adapter/package.json \
            packages/standard-capture-adapter/src/types.ts \
            packages/standard-capture-adapter/src/index.ts \
            packages/standard-capture-adapter/src/asset-acquisition.ts \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-13-package.mjs \
            apps/browser-extension/src/runtime/asset-runtime.ts \
            apps/browser-extension/src/runtime/asset-store.ts \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/test/asset-runtime.test.ts \
            apps/browser-extension/test/asset-store.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-13.mjs \
            docs/ASSET_RESOLVER_V2.md \
            docs/adr/ADR-0013-asset-resolution-sidecar.md \
            docs/nodes/NODE-13_ASSET_RESOLVER.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/node-13-bootstrap.yml

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-13 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-13): validate asset resolver integration"
            git push origin HEAD:feat/node-13-asset-resolver
          fi
