name: NODE-15 Responsive Capture Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-15-multi-viewport-responsive-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-15-multi-viewport-responsive-capture

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Wire NODE-15 guardrail
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/validate-foundation.mjs";
          let source = readFileSync(path, "utf8");
          const anchor = 'import "./validate-node-14.mjs";';
          const addition = 'import "./validate-node-15.mjs";';
          if (!source.includes(addition)) source = source.replace(anchor, `${anchor}\n${addition}`);
          if (!source.includes(addition)) throw new Error("NODE-15 guardrail anchor missing");
          writeFileSync(path, source);
          EOF

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/responsive-capture \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-15-package.mjs \
            apps/browser-extension/src/runtime/cdp-runtime.ts \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/protocol.ts \
            apps/browser-extension/src/runtime/popup.ts \
            apps/browser-extension/src/runtime/responsive-capture-runtime.ts \
            apps/browser-extension/src/runtime/responsive-capture-store.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/static/popup.html \
            apps/browser-extension/static/shell.css \
            apps/browser-extension/test/index.test.ts \
            apps/browser-extension/test/protocol.test.ts \
            apps/browser-extension/test/responsive-capture-runtime.test.ts \
            apps/browser-extension/test/responsive-capture-store.test.ts \
            apps/browser-extension/test/responsive-cdp-runtime.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-09.mjs \
            scripts/validate-node-15.mjs \
            docs/RESPONSIVE_CAPTURE_V2.md \
            docs/adr/ADR-0015-responsive-multi-viewport-orchestration.md \
            docs/nodes/NODE-15_MULTI_VIEWPORT_RESPONSIVE_CAPTURE.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/node-15-bootstrap.yml

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-15 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-15): validate responsive capture integration"
            git push origin HEAD:feat/node-15-multi-viewport-responsive-capture
          fi
