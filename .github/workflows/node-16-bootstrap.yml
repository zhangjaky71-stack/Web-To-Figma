name: NODE-16 Responsive Inference Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-16-responsive-inference-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-16-responsive-inference-engine

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-16 integration patch
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceOnce(source, before, after, label) {
            if (source.includes(after)) return source;
            if (!source.includes(before)) throw new Error(`NODE-16 patch anchor missing: ${label}`);
            return source.replace(before, after);
          }

          const serviceWorkerPath = "apps/browser-extension/src/runtime/service-worker.ts";
          let serviceWorker = readFileSync(serviceWorkerPath, "utf8");
          serviceWorker = replaceOnce(
            serviceWorker,
            '} from "@w2f/responsive-capture";\nimport {\n  captureStandardSnapshotInPage,',
            '} from "@w2f/responsive-capture";\nimport { summarizeResponsiveInference } from "@w2f/responsive-inference";\nimport {\n  captureStandardSnapshotInPage,',
            "responsive inference core import",
          );
          serviceWorker = replaceOnce(
            serviceWorker,
            'import { deleteResponsiveCapture, writeResponsiveCapture } from "./responsive-capture-store.js";',
            'import { deleteResponsiveCapture, writeResponsiveCapture } from "./responsive-capture-store.js";\nimport {\n  inferResponsiveCaptureEvidence,\n  loadResponsiveInferenceEvidence,\n} from "./responsive-inference-runtime.js";\nimport {\n  deleteResponsiveInference,\n  writeResponsiveInference,\n} from "./responsive-inference-store.js";',
            "responsive inference browser imports",
          );
          serviceWorker = replaceOnce(
            serviceWorker,
            '  await Promise.allSettled([\n    deleteResponsiveCapture(jobId),\n    ...plans.map((plan) => deleteAllCaptureArtifacts(responsiveArtifactId(jobId, plan.id))),\n  ]);',
            '  await Promise.allSettled([\n    deleteResponsiveCapture(jobId),\n    deleteResponsiveInference(jobId),\n    ...plans.map((plan) => deleteAllCaptureArtifacts(responsiveArtifactId(jobId, plan.id))),\n  ]);',
            "responsive inference cleanup",
          );
          serviceWorker = replaceOnce(
            serviceWorker,
            'function responsiveReceipt(\n  storageKey: string,\n  capture: ReturnType<typeof buildResponsiveCapture>,\n): ResponsiveCaptureReceipt {\n  const summary = summarizeResponsiveCapture(capture);\n  return {\n    storageKey,\n    mode: capture.mode,\n    plannedViewportCount: summary.plannedViewportCount,\n    capturedSnapshotCount: summary.capturedSnapshotCount,\n    stableNodeEvidenceCount: summary.stableNodeEvidenceCount,\n    diagnosticCount: summary.diagnosticCount,\n    viewportWidths: capture.plannedViewports.map((viewport) => viewport.width),\n  };\n}',
            'function responsiveReceipt(\n  storageKey: string,\n  capture: ReturnType<typeof buildResponsiveCapture>,\n  inferenceStorageKey: string,\n  inference: ReturnType<typeof inferResponsiveCaptureEvidence>,\n): ResponsiveCaptureReceipt {\n  const summary = summarizeResponsiveCapture(capture);\n  const inferenceSummary = summarizeResponsiveInference(inference);\n  return {\n    storageKey,\n    mode: capture.mode,\n    plannedViewportCount: summary.plannedViewportCount,\n    capturedSnapshotCount: summary.capturedSnapshotCount,\n    stableNodeEvidenceCount: summary.stableNodeEvidenceCount,\n    diagnosticCount: summary.diagnosticCount,\n    viewportWidths: capture.plannedViewports.map((viewport) => viewport.width),\n    inferenceStorageKey,\n    responsiveRuleCount: inferenceSummary.ruleCount,\n    breakpointCandidateCount: inferenceSummary.breakpointCandidateCount,\n    responsiveSizingDecisionCount: inferenceSummary.sizingDecisionCount,\n    responsiveInferenceDiagnosticCount: inferenceSummary.diagnosticCount,\n  };\n}',
            "responsive receipt inference metrics",
          );
          serviceWorker = replaceOnce(
            serviceWorker,
            '    const storageKey = await writeResponsiveCapture(jobId, capture);\n    job = transitionCaptureJob(job, "completed", "responsive-capture-complete", new Date(), {',
            '    const storageKey = await writeResponsiveCapture(jobId, capture);\n    const inferenceEvidence = await loadResponsiveInferenceEvidence(jobId);\n    const inference = inferResponsiveCaptureEvidence(\n      inferenceEvidence.capture,\n      inferenceEvidence.children,\n    );\n    const inferenceStorageKey = await writeResponsiveInference(jobId, inference);\n    job = transitionCaptureJob(job, "completed", "responsive-capture-complete", new Date(), {',
            "responsive inference execution",
          );
          serviceWorker = replaceOnce(
            serviceWorker,
            '      responsive: responsiveReceipt(storageKey, capture),',
            '      responsive: responsiveReceipt(storageKey, capture, inferenceStorageKey, inference),',
            "responsive inference receipt call",
          );
          writeFileSync(serviceWorkerPath, serviceWorker);

          const inferencePath = "packages/responsive-inference/src/inference.ts";
          let inference = readFileSync(inferencePath, "utf8");
          inference = replaceOnce(
            inference,
            '  return JSON.stringify(value);',
            '  return JSON.stringify(value) ?? String(value);',
            "stable value serialization",
          );
          inference = replaceOnce(
            inference,
            '    if (percent && Number(percent[1]) >= 95) {',
            '    if (percent && Number(percent[1] ?? "NaN") >= 95) {',
            "percent capture strictness",
          );
          inference = replaceOnce(
            inference,
            '      const boundary = Number(match[1]);',
            '      const boundary = Number(match[1] ?? "NaN");',
            "media breakpoint capture strictness",
          );
          writeFileSync(inferencePath, inference);

          const foundationPath = "scripts/validate-foundation.mjs";
          let foundation = readFileSync(foundationPath, "utf8");
          const anchor = 'import "./validate-node-15.mjs";';
          const addition = 'import "./validate-node-16.mjs";';
          if (!foundation.includes(addition)) foundation = foundation.replace(anchor, `${anchor}\n${addition}`);
          if (!foundation.includes(addition)) throw new Error("NODE-16 foundation guardrail anchor missing");
          writeFileSync(foundationPath, foundation);
          EOF

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/responsive-inference \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-16-package.mjs \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/responsive-inference-runtime.ts \
            apps/browser-extension/src/runtime/responsive-inference-store.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/test/responsive-inference-runtime.test.ts \
            apps/browser-extension/test/responsive-inference-store.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-16.mjs \
            docs/RESPONSIVE_INFERENCE_V2.md \
            docs/adr/ADR-0016-responsive-inference-evidence-precedence.md \
            docs/nodes/NODE-16_RESPONSIVE_INFERENCE_ENGINE.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/node-16-bootstrap.yml

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-16 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-16): validate responsive inference integration"
            git push origin HEAD:feat/node-16-responsive-inference-engine
          fi
