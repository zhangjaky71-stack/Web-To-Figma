name: NODE-18 Table Layout Bootstrap V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-18-table-layout-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-18-table-layout-engine

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install current workspace
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-18 integration closure
        run: |
          node scripts/node-18-finalize.mjs
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "apps/browser-extension/src/runtime/service-worker.ts";
          let source = readFileSync(path, "utf8");
          const before = '        ...layoutReceipt,\n        ...environmentReceipt,';
          const after = '        ...layoutReceipt,\n        ...tableReceipt,\n        ...environmentReceipt,';
          source = source.replaceAll(before, after);
          const receiptUses = source.match(/\.\.\.tableReceipt/g)?.length ?? 0;
          if (receiptUses !== 2) {
            throw new Error(`NODE-18 expected tableReceipt in both Standard/CDP receipts, found ${receiptUses}`);
          }
          writeFileSync(path, source);
          EOF

      - name: Refresh patched workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/table-layout-engine \
            packages/standard-capture-adapter/src/cascade-capture.ts \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-18-package.mjs \
            apps/browser-extension/src/runtime/css-cascade-runtime.ts \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/src/runtime/table-layout-runtime.ts \
            apps/browser-extension/src/runtime/table-layout-store.ts \
            apps/browser-extension/test/table-layout-runtime.test.ts \
            apps/browser-extension/test/table-layout-store.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-18.mjs \
            docs/TABLE_LAYOUT_ENGINE_V2.md \
            docs/adr/ADR-0018-table-occupancy-and-rendering-boundary.md \
            docs/nodes/NODE-18_TABLE_LAYOUT_ENGINE.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary finalization files
        run: |
          git rm .github/workflows/node-18-bootstrap.yml
          git rm .github/workflows/node-18-bootstrap-v2.yml
          git rm scripts/node-18-finalize.mjs

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-18 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-18): validate table layout integration"
            git push origin HEAD:feat/node-18-table-layout-engine
          fi
