name: NODE-19 Render Tree Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-19-render-tree-optimizer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-19-render-tree-optimizer

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install current workspace
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-19 integration closure
        run: node scripts/node-19-finalize.mjs

      - name: Fix strict Render Tree core typing and revision content
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "packages/render-tree-optimizer/src/optimizer.ts";
          let source = readFileSync(path, "utf8");
          source = source.replace(
            "const document = await createDocumentIdentity({",
            "const documentIdentity = await createDocumentIdentity({",
          );
          source = source.replaceAll("document.documentId", "documentIdentity.documentId");
          source = source.replace(
            '      : Number.isFinite(zNumber)\n        ? { zIndex: zNumber }',
            '      : typeof zNumber === "number" && Number.isFinite(zNumber)\n        ? { zIndex: zNumber }',
          );
          source = source.replace(
            '    paintHash: fingerprint.paintHash,\n    hierarchyHash:',
            '    ...(fingerprint.paintHash ? { paintHash: fingerprint.paintHash } : {}),\n    hierarchyHash:',
          );
          if (!source.includes("function subtreeContentEvidence(")) {
            const anchor = "async function revisionHashesFor(\n";
            if (!source.includes(anchor)) throw new Error("NODE-19 revision helper anchor missing");
            const helper = `function subtreeContentEvidence(\n  sourceNodeId: string,\n  childrenBySourceId: ReadonlyMap<string, string[]>,\n  sourceById: ReadonlyMap<string, RawNode>,\n  seen = new Set<string>(),\n): unknown {\n  if (seen.has(sourceNodeId)) return [\"cycle\"];\n  const sourceNode = sourceById.get(sourceNodeId);\n  if (!sourceNode) return [\"missing\"];\n  seen.add(sourceNodeId);\n  const children = (childrenBySourceId.get(sourceNodeId) ?? []).map((childId) =>\n    subtreeContentEvidence(childId, childrenBySourceId, sourceById, seen),\n  );\n  seen.delete(sourceNodeId);\n  return [\n    sourceNode.kind,\n    tag(sourceNode),\n    sourceNode.source.role ?? \"\",\n    sourceNode.textContent ?? sourceNode.text?.value ?? \"\",\n    sourceNode.source.attributes ?? {},\n    children,\n  ];\n}\n\n`;
            source = source.replace(anchor, `${helper}${anchor}`);
          }
          source = source.replace(
            '  fingerprint: StructuralFingerprint,\n): Promise<NodeRevisionHashes> {',
            '  fingerprint: StructuralFingerprint,\n  childrenBySourceId: ReadonlyMap<string, string[]>,\n  sourceById: ReadonlyMap<string, RawNode>,\n): Promise<NodeRevisionHashes> {',
          );
          source = source.replace(
            '    contentHash: await hashPayload([\n      "w2f-render-content-v1",\n      source.textContent ?? source.text?.value ?? "",\n      source.source.attributes ?? {},\n    ]),',
            '    contentHash: await hashPayload([\n      "w2f-render-content-v1",\n      subtreeContentEvidence(source.captureNodeId, childrenBySourceId, sourceById),\n    ]),',
          );
          source = source.replace(
            '    const revisionHashes = await revisionHashesFor(node, source, fingerprint);',
            '    const revisionHashes = await revisionHashesFor(\n      node,\n      source,\n      fingerprint,\n      childrenById,\n      byId,\n    );',
          );
          for (const required of [
            'typeof zNumber === "number" && Number.isFinite(zNumber)',
            '...(fingerprint.paintHash ? { paintHash: fingerprint.paintHash } : {})',
            'function subtreeContentEvidence(',
            'subtreeContentEvidence(source.captureNodeId, childrenBySourceId, sourceById)',
          ]) {
            if (!source.includes(required)) throw new Error(`NODE-19 core closure missing ${required}`);
          }
          if (source.includes("document.documentId")) {
            throw new Error("NODE-19 document global-name collision remains");
          }
          writeFileSync(path, source);
          EOF

      - name: Fix Standard and CDP render-tree receipt fanout
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "apps/browser-extension/src/runtime/service-worker.ts";
          let source = readFileSync(path, "utf8");
          const before = '        ...tableReceipt,\n        ...environmentReceipt,';
          const after = '        ...tableReceipt,\n        ...renderTreeReceipt,\n        ...environmentReceipt,';
          source = source.replaceAll(before, after);
          const uses = source.match(/\.\.\.renderTreeReceipt/g)?.length ?? 0;
          if (uses !== 2) {
            throw new Error(`NODE-19 expected renderTreeReceipt in Standard/CDP receipts, found ${uses}`);
          }
          writeFileSync(path, source);
          EOF

      - name: Refresh patched workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/render-tree-optimizer \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-19-package.mjs \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/src/runtime/render-tree-runtime.ts \
            apps/browser-extension/src/runtime/render-tree-store.ts \
            apps/browser-extension/test/render-tree-runtime.test.ts \
            apps/browser-extension/test/render-tree-store.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-19.mjs \
            docs/RENDER_TREE_OPTIMIZER_V2.md \
            docs/adr/ADR-0019-render-tree-boundary-and-wrapper-folding.md \
            docs/nodes/NODE-19_RENDER_TREE_OPTIMIZER.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary finalization files
        run: |
          git rm .github/workflows/node-19-bootstrap.yml
          git rm scripts/node-19-finalize.mjs

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-19 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-19): validate render tree integration"
            git push origin HEAD:feat/node-19-render-tree-optimizer
          fi
