name: NODE-20 Compositing Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/node-20-compositing-fallback-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/node-20-compositing-fallback-boundary

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install current workspace
        run: pnpm install --no-frozen-lockfile

      - name: Apply NODE-20 integration closure
        run: node scripts/node-20-finalize.mjs

      - name: Refresh patched workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/compositing-engine \
            apps/browser-extension/package.json \
            apps/browser-extension/scripts/package-extension.mjs \
            apps/browser-extension/scripts/validate-node-20-package.mjs \
            apps/browser-extension/src/runtime/job-state.ts \
            apps/browser-extension/src/runtime/service-worker.ts \
            apps/browser-extension/src/runtime/compositing-runtime.ts \
            apps/browser-extension/src/runtime/compositing-store.ts \
            apps/browser-extension/test/compositing-runtime.test.ts \
            apps/browser-extension/test/compositing-store.test.ts \
            scripts/validate-foundation.mjs \
            scripts/validate-node-20.mjs \
            docs/COMPOSITING_FALLBACK_BOUNDARY_V2.md \
            docs/adr/ADR-0020-minimal-safe-fallback-boundary.md \
            docs/nodes/NODE-20_COMPOSITING_FALLBACK_BOUNDARY.md \
            docs/IMPLEMENTATION_STATUS.md \
            pnpm-lock.yaml

      - name: Remove temporary finalization files
        run: |
          git rm .github/workflows/node-20-bootstrap.yml
          git rm scripts/node-20-finalize.mjs

      - name: Validate final repository shape
        run: pnpm check

      - name: Commit validated NODE-20 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "build(node-20): validate compositing integration"
            git push origin HEAD:feat/node-20-compositing-fallback-boundary
          fi
