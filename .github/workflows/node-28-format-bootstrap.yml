name: NODE-28 Format Bootstrap

on:
  push:
    branches:
      - node-28-hybrid-raster-renderer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: node-28-hybrid-raster-renderer
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format NODE-28 files
        run: >-
          pnpm exec prettier --write
          apps/figma-plugin/src/figma-hybrid-renderer.ts
          apps/figma-plugin/src/protocol.ts
          apps/figma-plugin/test/hybrid-raster.test.ts
          packages/figma-renderer/src/transaction.ts
          scripts/validate-node-28.mjs
      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          rm .github/workflows/node-28-format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add -A
          git commit -m "style(node-28): format hybrid raster implementation"
          git push origin HEAD:node-28-hybrid-raster-renderer
