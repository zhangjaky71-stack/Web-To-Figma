name: NODE27 Format Closure

on:
  push:
    branches:
      - node-27-responsive-layout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: node-27-responsive-layout

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NODE-27 files
        run: >-
          pnpm exec prettier --write
          apps/figma-plugin/src/figma-layout-renderer.ts
          packages/figma-renderer/src/layout/planner.ts
          packages/figma-renderer/test/layout-planner.test.ts
          .github/workflows/node27-format.yml

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/figma-plugin/src/figma-layout-renderer.ts \
            packages/figma-renderer/src/layout/planner.ts \
            packages/figma-renderer/test/layout-planner.test.ts \
            .github/workflows/node27-format.yml
          git commit -m "style(node-27): format responsive layout implementation"
          git push origin HEAD:node-27-responsive-layout
