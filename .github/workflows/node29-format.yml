name: NODE-29 Format Closure

on:
  push:
    branches: [node-29-visual-structure-editability-qa]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: node-29-visual-structure-editability-qa

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NODE-29 files and remove temporary workflow
        run: |
          pnpm exec prettier --write \
            apps/figma-plugin/src/main.ts \
            apps/figma-plugin/src/figma-qa.ts \
            packages/figma-renderer/src/qa/index.ts \
            packages/figma-renderer/src/qa/pixel.ts \
            packages/figma-renderer/src/qa/structure.ts \
            packages/figma-renderer/src/qa/types.ts \
            packages/figma-renderer/test/qa.test.ts \
            scripts/validate-node-29.mjs \
            docs/nodes/NODE-29_VISUAL_STRUCTURE_EDITABILITY_QA.md \
            .github/workflows/ci.yml
          rm .github/workflows/node29-format.yml

      - name: Commit formatting closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(node-29): format QA closure"
          git push origin HEAD:node-29-visual-structure-editability-qa
