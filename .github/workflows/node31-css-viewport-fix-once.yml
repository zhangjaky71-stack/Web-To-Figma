name: NODE-31 CSS Viewport Fix Once
on:
  push:
    paths: [".github/workflows/node31-css-viewport-fix-once.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate
      - name: Patch CSS viewport semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/cdp-capture-adapter/src/types.ts'); s=p.read_text(); a='  screenshot: CdpScreenshotResponse;\n  devicePixelRatio: number;'; b='  screenshot: CdpScreenshotResponse;\n  viewportWidth?: number;\n  viewportHeight?: number;\n  devicePixelRatio: number;'; assert a in s; p.write_text(s.replace(a,b,1))
          p=Path('packages/cdp-capture-adapter/src/normalize.ts'); s=p.read_text(); a='      viewportWidth: cssVisual?.clientWidth ?? cssLayout?.clientWidth ?? contentSize?.width ?? 0,\n      viewportHeight:\n        cssVisual?.clientHeight ?? cssLayout?.clientHeight ?? contentSize?.height ?? 0,'; b='      viewportWidth:\n        input.evidence.viewportWidth ??\n        cssVisual?.clientWidth ??\n        cssLayout?.clientWidth ??\n        contentSize?.width ??\n        0,\n      viewportHeight:\n        input.evidence.viewportHeight ??\n        cssVisual?.clientHeight ??\n        cssLayout?.clientHeight ??\n        contentSize?.height ??\n        0,'; assert a in s; p.write_text(s.replace(a,b,1))
          p=Path('apps/browser-extension/src/runtime/cdp-runtime.ts'); s=p.read_text(); s=s.replace('function readDevicePixelRatio(value: Record<string, unknown>): number {','function readPositiveRuntimeNumber(value: Record<string, unknown>): number | undefined {',1); s=s.replace('if (typeof result !== "object" || result === null || Array.isArray(result)) return 1;','if (typeof result !== "object" || result === null || Array.isArray(result)) return undefined;',1); s=s.replace('? observed : 1;','? observed : undefined;',1); s=s.replace('const [domSnapshot, layoutMetrics, frameTree, dprEvaluation, screenshot] = await Promise.all([','const [domSnapshot, layoutMetrics, frameTree, dprEvaluation, widthEvaluation, heightEvaluation, screenshot] = await Promise.all([',1); anchor='      command<CdpScreenshotResponse>(api, target, "Page.captureScreenshot", {'; insert='      command<Record<string, unknown>>(api, target, "Runtime.evaluate", { expression: "window.innerWidth", returnByValue: true, silent: true }),\n      command<Record<string, unknown>>(api, target, "Runtime.evaluate", { expression: "window.innerHeight", returnByValue: true, silent: true }),\n'; assert anchor in s; s=s.replace(anchor,insert+anchor,1); a='        devicePixelRatio: readDevicePixelRatio(dprEvaluation),'; b='        viewportWidth: readPositiveRuntimeNumber(widthEvaluation) ?? layoutMetrics.cssVisualViewport?.clientWidth ?? layoutMetrics.cssLayoutViewport?.clientWidth ?? 0,\n        viewportHeight: readPositiveRuntimeNumber(heightEvaluation) ?? layoutMetrics.cssVisualViewport?.clientHeight ?? layoutMetrics.cssLayoutViewport?.clientHeight ?? 0,\n        devicePixelRatio: readPositiveRuntimeNumber(dprEvaluation) ?? 1,'; assert a in s; p.write_text(s.replace(a,b,1))
          p=Path('packages/cdp-capture-adapter/test/normalize.test.ts'); s=p.read_text(); anchor='  it("normalizes NODE-10 text fragments, baseline provenance, pseudo text and safe form state", () => {'; add='  it("uses CSS viewport dimensions while retaining scrollbar-excluding client width", () => {\n    const evidence = fixture();\n    evidence.viewportWidth = 1440;\n    evidence.viewportHeight = 900;\n    evidence.layoutMetrics.cssLayoutViewport!.clientWidth = 1425;\n    evidence.layoutMetrics.cssVisualViewport!.clientWidth = 1425;\n    const result = normalizeCdpCapture({ captureTarget: { type: "document" }, evidence, capturedAt: "2026-09-03T00:00:00.000Z" });\n    expect(result.snapshot.environment.viewportWidth).toBe(1440);\n    expect(result.snapshot.environment.viewportHeight).toBe(900);\n    expect(result.snapshot.scrollContainers[0]?.clientWidth).toBe(1425);\n  });\n\n'; assert anchor in s; p.write_text(s.replace(anchor,add+anchor,1))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/cdp-capture-adapter/src/types.ts packages/cdp-capture-adapter/src/normalize.ts apps/browser-extension/src/runtime/cdp-runtime.ts packages/cdp-capture-adapter/test/normalize.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cdp-capture-adapter/src/types.ts packages/cdp-capture-adapter/src/normalize.ts apps/browser-extension/src/runtime/cdp-runtime.ts packages/cdp-capture-adapter/test/normalize.test.ts
          git diff --cached --check
          git commit -m "fix(node-31): preserve CSS viewport width in CDP captures"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
