name: NODE-31 Evidence Format Once

on:
  push:
    paths:
      - ".github/workflows/node31-evidence-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format validators
        run: pnpm exec prettier --write scripts/validate-node-31-known-limitations.mjs scripts/validate-node-31-security-evidence.mjs

      - name: Commit formatted validators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-node-31-known-limitations.mjs scripts/validate-node-31-security-evidence.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(node-31): format evidence validators"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
