name: NODE-31 Format Export

on:
  push:
    branches:
      - node-31-real-world-compatibility-release-candidate

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NODE-31 Desktop measurement sources
        run: |
          pnpm exec prettier --write \
            apps/figma-plugin/scripts/build-node31-measurement-plugin.mjs \
            apps/figma-plugin/scripts/validate-node31-measurement-package.mjs \
            apps/figma-plugin/src/node31-desktop-evidence.ts \
            apps/figma-plugin/src/node31-desktop-measurement.ts \
            apps/figma-plugin/src/node31-desktop-metrics.ts \
            apps/figma-plugin/src/node31-measurement-main.ts \
            apps/figma-plugin/src/node31-measurement-ui.ts \
            apps/figma-plugin/static/node31-measurement-ui.html \
            scripts/ingest-node-31-desktop-evidence.mjs

      - name: Commit exact Prettier output
        run: |
          if git diff --quiet -- \
            apps/figma-plugin/scripts/build-node31-measurement-plugin.mjs \
            apps/figma-plugin/scripts/validate-node31-measurement-package.mjs \
            apps/figma-plugin/src/node31-desktop-evidence.ts \
            apps/figma-plugin/src/node31-desktop-measurement.ts \
            apps/figma-plugin/src/node31-desktop-metrics.ts \
            apps/figma-plugin/src/node31-measurement-main.ts \
            apps/figma-plugin/src/node31-measurement-ui.ts \
            apps/figma-plugin/static/node31-measurement-ui.html \
            scripts/ingest-node-31-desktop-evidence.mjs; then
            echo "NODE-31 sources already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/figma-plugin/scripts/build-node31-measurement-plugin.mjs \
            apps/figma-plugin/scripts/validate-node31-measurement-package.mjs \
            apps/figma-plugin/src/node31-desktop-evidence.ts \
            apps/figma-plugin/src/node31-desktop-measurement.ts \
            apps/figma-plugin/src/node31-desktop-metrics.ts \
            apps/figma-plugin/src/node31-measurement-main.ts \
            apps/figma-plugin/src/node31-measurement-ui.ts \
            apps/figma-plugin/static/node31-measurement-ui.html \
            scripts/ingest-node-31-desktop-evidence.mjs
          git commit -m "style(node-31): format desktop measurement harness"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
