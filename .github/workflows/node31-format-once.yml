name: NODE-31 one-shot format

on:
  push:
    branches:
      - node-31-real-world-compatibility-release-candidate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact remaining files
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            apps/browser-extension/src/runtime/cdp-runtime.ts \
            apps/browser-extension/test/responsive-cdp-runtime.test.ts \
            scripts/run-node-31-file-protocol-runtime-v18.mjs

      - name: Print formatted CI workflow
        run: |
          echo '---NODE31-CI-FORMATTED-BEGIN---'
          cat .github/workflows/ci.yml
          echo '---NODE31-CI-FORMATTED-END---'

      - name: Commit non-workflow formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/browser-extension/src/runtime/cdp-runtime.ts \
            apps/browser-extension/test/responsive-cdp-runtime.test.ts \
            scripts/run-node-31-file-protocol-runtime-v18.mjs
          git diff --cached --check
          git commit -m "style(node-31): format final RC runtime changes"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
