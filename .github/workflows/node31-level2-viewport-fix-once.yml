name: NODE-31 Level-2 Viewport Fix Once

on:
  push:
    paths:
      - ".github/workflows/node31-level2-viewport-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Align CDP viewport semantics with CSS viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path("packages/cdp-capture-adapter/src/types.ts")
          text = types.read_text()
          old = '''export interface CdpCaptureEvidence {
            domSnapshot: CdpDomSnapshotResponse;
            layoutMetrics: CdpLayoutMetricsResponse;
            frameTree: CdpFrameTreeResponse;
            screenshot: CdpScreenshotResponse;
            devicePixelRatio: number;
          }'''
          new = '''export interface CdpCaptureEvidence {
            domSnapshot: CdpDomSnapshotResponse;
            layoutMetrics: CdpLayoutMetricsResponse;
            frameTree: CdpFrameTreeResponse;
            screenshot: CdpScreenshotResponse;
            viewportWidth?: number;
            viewportHeight?: number;
            devicePixelRatio: number;
          }'''
          if old not in text:
              raise SystemExit("CdpCaptureEvidence block not found")
          types.write_text(text.replace(old, new, 1))

          normalize = Path("packages/cdp-capture-adapter/src/normalize.ts")
          text = normalize.read_text()
          old = '''      viewportWidth: cssVisual?.clientWidth ?? cssLayout?.clientWidth ?? contentSize?.width ?? 0,
                viewportHeight:
                  cssVisual?.clientHeight ?? cssLayout?.clientHeight ?? contentSize?.height ?? 0,'''
          new = '''      viewportWidth:
                  input.evidence.viewportWidth ??
                  cssVisual?.clientWidth ??
                  cssLayout?.clientWidth ??
                  contentSize?.width ??
                  0,
                viewportHeight:
                  input.evidence.viewportHeight ??
                  cssVisual?.clientHeight ??
                  cssLayout?.clientHeight ??
                  contentSize?.height ??
                  0,'''
          if old not in text:
              raise SystemExit("RawSnapshot viewport block not found")
          normalize.write_text(text.replace(old, new, 1))

          runtime = Path("apps/browser-extension/src/runtime/cdp-runtime.ts")
          text = runtime.read_text()
          old = '''function readDevicePixelRatio(value: Record<string, unknown>): number {
            const result = value.result;
            if (typeof result !== "object" || result === null || Array.isArray(result)) return 1;
            const observed = (result as Record<string, unknown>).value;
            return typeof observed === "number" && Number.isFinite(observed) && observed > 0 ? observed : 1;
          }'''
          new = '''function readViewportObservation(value: Record<string, unknown>): {
            viewportWidth?: number;
            viewportHeight?: number;
            devicePixelRatio: number;
          } {
            const result = value.result;
            if (typeof result !== "object" || result === null || Array.isArray(result)) {
              return { devicePixelRatio: 1 };
            }
            const observed = (result as Record<string, unknown>).value;
            if (typeof observed !== "object" || observed === null || Array.isArray(observed)) {
              return { devicePixelRatio: 1 };
            }
            const record = observed as Record<string, unknown>;
            const positive = (candidate: unknown): number | undefined =>
              typeof candidate === "number" && Number.isFinite(candidate) && candidate > 0
                ? candidate
                : undefined;
            const viewportWidth = positive(record.width);
            const viewportHeight = positive(record.height);
            const devicePixelRatio = positive(record.devicePixelRatio) ?? 1;
            return {
              ...(viewportWidth === undefined ? {} : { viewportWidth }),
              ...(viewportHeight === undefined ? {} : { viewportHeight }),
              devicePixelRatio,
            };
          }'''
          if old not in text:
              raise SystemExit("readDevicePixelRatio helper not found")
          text = text.replace(old, new, 1)
          old = '''    const [domSnapshot, layoutMetrics, frameTree, dprEvaluation, screenshot] = await Promise.all(['''
          new = '''    const [domSnapshot, layoutMetrics, frameTree, viewportEvaluation, screenshot] = await Promise.all(['''
          if old not in text:
              raise SystemExit("CDP capture tuple not found")
          text = text.replace(old, new, 1)
          old = '''      command<Record<string, unknown>>(api, target, "Runtime.evaluate", {
                expression: "window.devicePixelRatio",
                returnByValue: true,
                silent: true,
              }),'''
          new = '''      command<Record<string, unknown>>(api, target, "Runtime.evaluate", {
                expression:
                  "({ width: window.innerWidth, height: window.innerHeight, devicePixelRatio: window.devicePixelRatio })",
                returnByValue: true,
                silent: true,
              }),'''
          if old not in text:
              raise SystemExit("CDP viewport Runtime.evaluate block not found")
          text = text.replace(old, new, 1)
          old = '''    return normalizeCdpCapture({
              captureTarget,
              capturedAt: new Date().toISOString(),
              evidence: {
                domSnapshot,
                layoutMetrics,
                frameTree,
                screenshot,
                devicePixelRatio: readDevicePixelRatio(dprEvaluation),
              },'''
          new = '''    const viewport = readViewportObservation(viewportEvaluation);
            return normalizeCdpCapture({
              captureTarget,
              capturedAt: new Date().toISOString(),
              evidence: {
                domSnapshot,
                layoutMetrics,
                frameTree,
                screenshot,
                ...viewport,
              },'''
          if old not in text:
              raise SystemExit("normalizeCdpCapture evidence block not found")
          runtime.write_text(text.replace(old, new, 1))

          test = Path("packages/cdp-capture-adapter/test/normalize.test.ts")
          text = test.read_text()
          anchor = '''  it("normalizes NODE-10 text fragments, baseline provenance, pseudo text and safe form state", () => {'''
          addition = '''  it("keeps CSS viewport dimensions distinct from scrollbar-excluding client dimensions", () => {
            const evidence = fixture();
            evidence.viewportWidth = 1440;
            evidence.viewportHeight = 900;
            if (evidence.layoutMetrics.cssLayoutViewport) {
              evidence.layoutMetrics.cssLayoutViewport.clientWidth = 1425;
              evidence.layoutMetrics.cssLayoutViewport.clientHeight = 900;
            }
            if (evidence.layoutMetrics.cssVisualViewport) {
              evidence.layoutMetrics.cssVisualViewport.clientWidth = 1425;
              evidence.layoutMetrics.cssVisualViewport.clientHeight = 900;
            }
            const result = normalizeCdpCapture({
              captureTarget: { type: "document" },
              evidence,
              capturedAt: "2026-09-03T00:00:00.000Z",
            });
            expect(result.snapshot.environment.viewportWidth).toBe(1440);
            expect(result.snapshot.environment.viewportHeight).toBe(900);
            expect(result.snapshot.scrollContainers[0]?.clientWidth).toBe(1425);
          });

'''
          if anchor not in text:
              raise SystemExit("normalize test insertion anchor not found")
          test.write_text(text.replace(anchor, addition + anchor, 1))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format viewport fix
        run: pnpm exec prettier --write packages/cdp-capture-adapter/src/types.ts packages/cdp-capture-adapter/src/normalize.ts apps/browser-extension/src/runtime/cdp-runtime.ts packages/cdp-capture-adapter/test/normalize.test.ts

      - name: Validate targeted viewport fix
        run: |
          pnpm --filter @w2f/cdp-capture-adapter test
          pnpm --filter @w2f/cdp-capture-adapter typecheck
          pnpm --filter @w2f/browser-extension typecheck
          pnpm exec prettier --check packages/cdp-capture-adapter/src/types.ts packages/cdp-capture-adapter/src/normalize.ts apps/browser-extension/src/runtime/cdp-runtime.ts packages/cdp-capture-adapter/test/normalize.test.ts
          git diff --check

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cdp-capture-adapter/src/types.ts packages/cdp-capture-adapter/src/normalize.ts apps/browser-extension/src/runtime/cdp-runtime.ts packages/cdp-capture-adapter/test/normalize.test.ts
          git commit -m "fix(node-31): preserve CSS viewport width in CDP captures"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
