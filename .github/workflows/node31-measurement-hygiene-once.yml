name: NODE-31 Measurement Hygiene Once

on:
  push:
    paths:
      - ".github/workflows/node31-measurement-hygiene-once.yml"

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Bind measurement evidence to branch head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("scripts/run-node-31-measurement-input-level1.mjs")
          text = collector.read_text()
          start = text.index("function checkoutRevision() {")
          end = text.index("\n\nasync function findChrome()", start)
          replacement = '''function checkoutRevision() {
            const explicitBranchHead = process.env.W2F_NODE31_BRANCH_HEAD;
            if (explicitBranchHead && /^[a-f0-9]{40}$/.test(explicitBranchHead)) {
              return explicitBranchHead;
            }
            const githubSha = process.env.GITHUB_SHA;
            if (githubSha && /^[a-f0-9]{40}$/.test(githubSha)) return githubSha;
            return execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          }'''
          collector.write_text(text[:start] + replacement + text[end:])

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text()
          marker = "      - name: NODE-31 Level-1 measurement input\n"
          start = text.index(marker)
          end = text.index("\n      - name: Upload NODE-31 Level-1 measurement input", start)
          expression = "$" + "{{ github.event.pull_request.head.sha || github.sha }}"
          replacement = (
              marker
              + "        env:\n"
              + f"          W2F_NODE31_BRANCH_HEAD: {expression}\n"
              + "        run: node scripts/run-node-31-measurement-input-level1.mjs\n"
          )
          workflow.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format measurement sources
        run: >-
          pnpm exec prettier --write
          packages/figma-renderer/src/qa/measurement-artifact.ts
          packages/figma-renderer/test/node31-release-candidate.test.ts
          scripts/run-node-31-measurement-input-level1.mjs
          scripts/run-node-31-measurement-provenance.mjs
          .github/workflows/ci.yml
          .gitignore
          .prettierignore

      - name: Commit hygiene changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/figma-renderer/src/qa/measurement-artifact.ts \
            packages/figma-renderer/test/node31-release-candidate.test.ts \
            scripts/run-node-31-measurement-input-level1.mjs \
            scripts/run-node-31-measurement-provenance.mjs \
            .github/workflows/ci.yml \
            .gitignore \
            .prettierignore
          if git diff --cached --quiet; then
            echo "No hygiene changes required."
            exit 0
          fi
          git commit -m "chore(node-31): bind and format measurement evidence"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
