name: NODE-31 responsive package format once

on:
  push:
    branches:
      - node-31-real-world-compatibility-release-candidate
    paths:
      - .github/workflows/node31-responsive-package-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format responsive package files
        run: |
          pnpm exec prettier --write apps/browser-extension/src/runtime/wtf-package-builder.ts apps/browser-extension/test/wtf-responsive-package-contract.test.ts
          pnpm exec prettier --check apps/browser-extension/src/runtime/wtf-package-builder.ts apps/browser-extension/test/wtf-responsive-package-contract.test.ts
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/browser-extension/src/runtime/wtf-package-builder.ts apps/browser-extension/test/wtf-responsive-package-contract.test.ts
          git commit -m "style(node-31): format responsive package references"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
