name: NODE-31 V18 race fix

on:
  push:
    branches:
      - node-31-real-world-compatibility-release-candidate
    paths:
      - .github/workflows/node31-v18-race-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Patch bounded file-tab visibility wait
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-file-protocol-runtime-v18.mjs")
          text = path.read_text()
          old = '''    const fileTarget = await createUnattachedFileTarget(harness.browser);
              const fileTab = await evaluate(
                options.client,
                `(async () => {
                  const tabs = await chrome.tabs.query({});
                  const tab = tabs.find((candidate) => candidate.url === ${JSON.stringify(fixtureUrl)});
                  return tab && typeof tab.id === "number"
                    ? { id: tab.id, url: tab.url, windowId: tab.windowId, active: tab.active }
                    : null;
                })()`,
                30000,
              );
              assert(
                fileTab?.url === fixtureUrl,
                `Extension could not resolve real file tab: ${JSON.stringify(fileTab)}`,
              );
              assert(typeof fileTab?.id === "number", "Resolved file tab has no numeric id");
          '''
          new = '''    const fileTarget = await createUnattachedFileTarget(harness.browser);
              let fileTab = null;
              for (let attempt = 0; attempt < 400; attempt += 1) {
                fileTab = await evaluate(
                  options.client,
                  `(async () => {
                    const tabs = await chrome.tabs.query({});
                    const tab = tabs.find((candidate) => candidate.url === ${JSON.stringify(fixtureUrl)});
                    return tab && typeof tab.id === "number"
                      ? { id: tab.id, url: tab.url, windowId: tab.windowId, active: tab.active }
                      : null;
                  })()`,
                  30000,
                );
                if (fileTab?.url === fixtureUrl && typeof fileTab.id === "number") break;
                await delay(25);
              }
              assert(
                fileTab?.url === fixtureUrl,
                `Extension could not resolve real file tab: ${JSON.stringify(fileTab)}`,
              );
              assert(typeof fileTab?.id === "number", "Resolved file tab has no numeric id");
          '''
          if old not in text:
              raise SystemExit("expected V18 single-shot file-tab block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify patch
        run: |
          pnpm exec prettier --write scripts/run-node-31-file-protocol-runtime-v18.mjs
          pnpm exec prettier --check scripts/run-node-31-file-protocol-runtime-v18.mjs
          git diff --check

      - name: Commit race fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-node-31-file-protocol-runtime-v18.mjs
          git diff --cached --check
          git commit -m "test(node-31): wait for extension file tab visibility"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
