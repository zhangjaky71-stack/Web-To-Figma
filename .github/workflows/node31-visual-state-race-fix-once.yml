name: NODE-31 visual-state race fix

on:
  push:
    branches:
      - node-31-real-world-compatibility-release-candidate
    paths:
      - .github/workflows/node31-visual-state-race-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: node-31-real-world-compatibility-release-candidate

      - name: Stabilize pre-freeze motion observation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-node-31-visual-state-runtime.mjs")
          text = path.read_text()
          old = '''  const beforeA = await readVisualState(client);
            await delay(300);
            const beforeB = await readVisualState(client);
            assert(beforeA?.ready && beforeB?.ready, "Fixture did not expose ready visual-state samples");
          '''
          new = '''  await waitFor(
              client,
              `globalThis.__node31VisualState?.().ready === true && globalThis.__node31VisualState?.().mediaPaused === false`,
              "Fixture media did not enter playing state",
            );

            const beforeA = await readVisualState(client);
            let beforeB = beforeA;
            for (let attempt = 0; attempt < 80; attempt += 1) {
              await delay(100);
              beforeB = await readVisualState(client);
              if (
                beforeB?.ready &&
                animationProgressed(beforeA.animationTimes, beforeB.animationTimes) &&
                (delta(beforeA.cssX, beforeB.cssX) >= 3 || delta(beforeA.waapiX, beforeB.waapiX) >= 3) &&
                beforeB.mediaPaused === false &&
                beforeB.mediaTime - beforeA.mediaTime >= 0.08
              ) {
                break;
              }
            }
            assert(beforeA?.ready && beforeB?.ready, "Fixture did not expose ready visual-state samples");
          '''
          if old not in text:
              raise SystemExit("expected visual-state pre-freeze sample block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify patch
        run: |
          pnpm exec prettier --write scripts/run-node-31-visual-state-runtime.mjs
          pnpm exec prettier --check scripts/run-node-31-visual-state-runtime.mjs
          git diff --check

      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-node-31-visual-state-runtime.mjs
          git diff --cached --check
          git commit -m "test(node-31): wait for pre-freeze visual motion"
          git push origin HEAD:node-31-real-world-compatibility-release-candidate
