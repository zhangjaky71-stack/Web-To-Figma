<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web-To-Figma Capture</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body class="popup-shell">
    <main class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">W2F Capture</p>
          <h1>Web → Figma</h1>
        </div>
        <span id="job-status" class="status" data-status="idle">Ready</span>
      </header>

      <p id="source-capability" class="details">Checking current source…</p>
      <p id="job-details" class="details">
        Choose a capture mode to verify the extension shell on this source.
      </p>

      <div class="actions">
        <button id="capture-full-page" class="primary" type="button" disabled>Full page</button>
        <button id="capture-region" type="button" disabled>Select area</button>
      </div>

      <div class="footer-actions">
        <button id="cancel-job" class="text-button" type="button" disabled>Cancel</button>
        <button id="open-options" class="text-button" type="button">Details</button>
      </div>

      <p class="note">
        NODE-06 validates HTTP/file source access and offline resolution. Capture engines arrive in
        later nodes.
      </p>
    </main>
    <script type="module" src="runtime/popup.js"></script>
  </body>
</html>
