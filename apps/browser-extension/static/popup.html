<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web-To-Figma Capture</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body class="popup-shell">
    <main class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">W2F Capture</p>
          <h1>Web → Figma</h1>
        </div>
        <span id="job-status" class="status" data-status="idle">Ready</span>
      </header>

      <p id="job-details" class="details">Choose a capture mode for the current tab.</p>

      <div class="actions">
        <button id="capture-full-page" class="primary" type="button">Full page</button>
        <button id="capture-region" type="button">Select area</button>
      </div>

      <section class="responsive-card" aria-labelledby="responsive-title">
        <div class="section-heading">
          <h2 id="responsive-title">Responsive Capture</h2>
          <span id="responsive-capability" class="capability-note">Checking…</span>
        </div>
        <label class="radio-row">
          <input
            id="responsive-current"
            type="radio"
            name="responsive-mode"
            value="current"
            checked
          />
          <span>Current Viewport</span>
        </label>
        <label class="radio-row">
          <input id="responsive-common" type="radio" name="responsive-mode" value="common" />
          <span>Common Breakpoints <small>1440 / 768 / 390</small></span>
        </label>
        <label class="radio-row">
          <input id="responsive-custom" type="radio" name="responsive-mode" value="custom" />
          <span>Custom</span>
        </label>
        <input
          id="responsive-custom-widths"
          class="compact-input"
          type="text"
          inputmode="numeric"
          placeholder="e.g. 1440, 1024, 768, 390"
          aria-label="Custom viewport widths"
          disabled
        />
        <button id="capture-responsive" type="button">Capture responsive snapshots</button>
      </section>

      <div class="footer-actions">
        <button id="export-wtf" class="primary" type="button" disabled>Export .wtf</button>
        <button id="cancel-job" class="text-button" type="button" disabled>Cancel</button>
        <button id="open-options" class="text-button" type="button">Details</button>
      </div>

      <p class="note">
        Current Viewport works in both builds. Common and Custom synthetic viewports require the
        High Fidelity build and are restored automatically after capture.
      </p>
    </main>
    <script type="module" src="runtime/popup.js"></script>
  </body>
</html>
