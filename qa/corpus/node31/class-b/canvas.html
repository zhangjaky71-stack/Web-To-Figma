<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE-31 Canvas</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#11151b;color:#eef3f8}.wrap{max-width:900px;margin:auto;padding:44px 22px}.stage{margin-top:26px;padding:20px;border-radius:24px;background:#1b222c}.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}canvas{display:block;width:100%;height:auto;border-radius:16px;background:#0c1015}.badge{padding:6px 10px;border-radius:999px;background:#2a3442}</style></head><body data-node31-category="canvas"><main class="wrap"><div class="meta"><div><small>Expected fallback fixture</small><h1>Canvas rendering surface</h1></div><span class="badge">minimal local raster fallback</span></div><p>Surrounding DOM text remains native/editable; only the canvas surface is expected to rasterize.</p><section class="stage"><canvas id="chart" width="820" height="360"></canvas></section></main><script>const c=document.getElementById('chart');const x=c.getContext('2d');x.fillStyle='#0c1015';x.fillRect(0,0,c.width,c.height);const g=x.createLinearGradient(0,0,c.width,0);g.addColorStop(0,'#6aa5ff');g.addColorStop(1,'#bc78ff');x.strokeStyle=g;x.lineWidth=8;x.beginPath();[60,120,190,150,245,205,292,265,330].forEach((v,i)=>{const px=40+i*90,py=320-v;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#aeb9c8';x.font='18px system-ui';x.fillText('Local canvas chart — expected surface fallback',40,330);</script></body></html>
