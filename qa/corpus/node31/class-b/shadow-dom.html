<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE-31 Shadow DOM</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;font:15px system-ui,sans-serif;color:#18202a}.wrap{max-width:920px;margin:auto;padding:48px 22px}.lead{max-width:620px;margin-bottom:30px}fixture-card{display:block}</style></head><body data-node31-category="shadow-dom"><main class="wrap"><div class="lead"><small>Composed tree fixture</small><h1>Shadow-root content must remain observable.</h1><p>The host is ordinary light DOM while the product card is rendered inside an open ShadowRoot with its own style scope.</p></div><fixture-card><span slot="meta">Assigned light DOM metadata</span></fixture-card></main><script>const host=document.querySelector('fixture-card');const root=host.attachShadow({mode:'open'});root.innerHTML=`<style>:host{display:block}.card{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:24px;border-radius:22px;background:white;box-shadow:0 12px 36px #61738b22}.art{min-height:160px;border-radius:16px;background:linear-gradient(135deg,#99bfff,#d7c8ff)}h2{margin:0 0 10px;font:700 28px system-ui,sans-serif}p{margin:0;color:#56606c;font:15px/1.6 system-ui,sans-serif}.meta{display:block;margin-top:12px;color:#59677a;font:600 13px system-ui,sans-serif}@media(max-width:560px){.card{grid-template-columns:1fr}.art{min-height:120px}}</style><section class="card"><div class="art"></div><div><h2>Open ShadowRoot</h2><p>Scoped styles, responsive layout and editable text live below the shadow boundary.</p><div class="meta"><slot name="meta"></slot></div></div></section>`;</script></body></html>
