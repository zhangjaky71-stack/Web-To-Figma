<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE-31 WebGL</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#0d0d12;color:#f2f0ff}.wrap{max-width:900px;margin:auto;padding:44px 22px}.stage{margin-top:26px;padding:18px;border-radius:24px;background:#191823}.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#302d43}canvas{display:block;width:100%;height:auto;border-radius:16px;background:#11101a}</style></head><body data-node31-category="webgl"><main class="wrap"><div class="meta"><div><small>Expected fallback fixture</small><h1>WebGL rendering surface</h1></div><span class="badge">minimal local raster fallback</span></div><p>The WebGL canvas is expected to rasterize while surrounding text and containers remain native.</p><section class="stage"><canvas id="gl" width="820" height="360"></canvas></section></main><script>const c=document.getElementById('gl');const gl=c.getContext('webgl',{preserveDrawingBuffer:true});if(gl){gl.clearColor(.08,.06,.16,1);gl.clear(gl.COLOR_BUFFER_BIT);const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');gl.compileShader(vs);const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,'precision mediump float;void main(){gl_FragColor=vec4(.38,.58,.98,1.);}');gl.compileShader(fs);const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.75,-.55,.75,-.55,0,.72]),gl.STATIC_DRAW);const p=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);}else{const x=c.getContext('2d');x.fillStyle='#11101a';x.fillRect(0,0,c.width,c.height);x.fillStyle='#f2f0ff';x.font='20px system-ui';x.fillText('WebGL unavailable in this environment',32,52);}</script></body></html>
