<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NODE-31 visual state runtime</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: sans-serif;
      }

      #css-box,
      #waapi-box {
        position: absolute;
        left: 40px;
        width: 80px;
        height: 80px;
      }

      #css-box {
        top: 40px;
        background: #ccc;
        animation: node31-drift 1.2s linear infinite alternate;
      }

      #waapi-box {
        top: 160px;
        background: #999;
      }

      @keyframes node31-drift {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(240px);
        }
      }
    </style>
  </head>
  <body>
    <div id="css-box" aria-label="css animation fixture"></div>
    <div id="waapi-box" aria-label="waapi animation fixture"></div>
    <div id="media-host"></div>

    <script>
      (() => {
        const cssBox = document.getElementById("css-box");
        const waapiBox = document.getElementById("waapi-box");
        const mediaHost = document.getElementById("media-host");
        const shadowRoot = mediaHost.attachShadow({ mode: "open" });
        const audio = document.createElement("audio");
        audio.id = "shadow-audio";
        audio.loop = true;
        audio.preload = "auto";
        shadowRoot.append(audio);

        waapiBox.animate(
          [
            { transform: "translateX(0)", opacity: 0.4 },
            { transform: "translateX(180px)", opacity: 1 },
          ],
          {
            duration: 900,
            direction: "alternate",
            iterations: Infinity,
            easing: "linear",
          },
        );

        function createSilentWav(durationSeconds = 8, sampleRate = 8000) {
          const sampleCount = durationSeconds * sampleRate;
          const bytesPerSample = 2;
          const buffer = new ArrayBuffer(44 + sampleCount * bytesPerSample);
          const view = new DataView(buffer);
          const writeAscii = (offset, value) => {
            for (let index = 0; index < value.length; index += 1) {
              view.setUint8(offset + index, value.charCodeAt(index));
            }
          };

          writeAscii(0, "RIFF");
          view.setUint32(4, 36 + sampleCount * bytesPerSample, true);
          writeAscii(8, "WAVE");
          writeAscii(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * bytesPerSample, true);
          view.setUint16(32, bytesPerSample, true);
          view.setUint16(34, 16, true);
          writeAscii(36, "data");
          view.setUint32(40, sampleCount * bytesPerSample, true);
          return buffer;
        }

        const audioUrl = URL.createObjectURL(new Blob([createSilentWav()], { type: "audio/wav" }));
        audio.src = audioUrl;

        function domSignature() {
          return JSON.stringify({
            bodyStyle: document.body.getAttribute("style"),
            cssStyle: cssBox.getAttribute("style"),
            waapiStyle: waapiBox.getAttribute("style"),
            mediaHostHtml: mediaHost.outerHTML,
            shadowHtml: shadowRoot.innerHTML,
          });
        }

        globalThis.__node31VisualState = () => {
          const animations = document.getAnimations();
          return {
            ready: globalThis.__node31VisualStateReady === true,
            cssX: cssBox.getBoundingClientRect().x,
            cssTransform: getComputedStyle(cssBox).transform,
            waapiX: waapiBox.getBoundingClientRect().x,
            waapiTransform: getComputedStyle(waapiBox).transform,
            animationTimes: animations.map((animation) => Number(animation.currentTime ?? -1)),
            animationStates: animations.map((animation) => animation.playState),
            mediaPaused: audio.paused,
            mediaTime: audio.currentTime,
            freezeGlobalPresent: Boolean(globalThis.__W2F_VISUAL_STATE_FREEZE_V1__),
            domSignature: domSignature(),
          };
        };

        audio
          .play()
          .then(() => {
            globalThis.__node31VisualStateReady = true;
          })
          .catch((error) => {
            globalThis.__node31VisualStateError = String(error);
          });
      })();
    </script>
  </body>
</html>
